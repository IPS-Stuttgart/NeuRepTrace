name: Katja global physical-finger s05 fallback

on:
  workflow_dispatch:
  pull_request:
    branches:
      - codex/katja-progressive-sequence-20260805
    paths:
      - .github/workflows/katja-global-physical-s05-fallback.yml

permissions:
  contents: read

jobs:
  global-physical-s05-fallback:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    env:
      KATJA_DATASET_ROOT: /mnt/lexar4tb/datasets/Katja Button Press Data
      KATJA_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_finger_events_v2.npz
    steps:
      - uses: actions/checkout@v7

      - name: Apply exact correct-order protocol
        run: |
          git apply --check experiments/katja-correct-order.patch
          git apply experiments/katja-correct-order.patch

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check numpy scipy h5py

      - name: Verify CUDA
        run: |
          nvidia-smi
          python - <<'PY'
          import torch

          print(torch.__version__, torch.cuda.is_available())
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is required")
          PY

      - name: Build exact feature cache when absent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KATJA_CACHE")"
          if [ ! -s "$KATJA_CACHE" ]; then
            temporary="${KATJA_CACHE%.npz}.tmp.${GITHUB_RUN_ID}.npz"
            python -m neureptrace.katja_spm_feature_cache \
              --dataset-root "$KATJA_DATASET_ROOT" \
              --output "$temporary" \
              --button-lag-ms 30 \
              --force
            mv "$temporary" "$KATJA_CACHE"
          fi

      - name: Run global physical-finger k20 screen
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/katja-global-physical-s05-fallback"
          mkdir -p "$output"
          python - <<'PY' | tee "${RUNNER_TEMP}/katja-global-physical-s05-fallback.txt"
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          from neureptrace._katja_finger_sequence_support import (
              DEFAULT_PARTICIPANTS,
              load_katja_feature_cache,
          )
          from neureptrace.katja_global_physical_benchmark import (
              run_katja_global_physical_benchmark,
          )

          output = Path(os.environ["RUNNER_TEMP"]) / "katja-global-physical-s05-fallback"
          cache = load_katja_feature_cache(os.environ["KATJA_CACHE"])
          model_kwargs = {
              "hidden_units": 96,
              "num_layers": 2,
              "num_heads": 4,
              "adapter_rank": 8,
              "source_max_epochs": 120,
              "meta_epochs": 2,
              "meta_support_trials": 4,
              "meta_query_trials": 4,
              "meta_inner_steps": 5,
              "adapter_steps": 80,
              "last_block_steps": 60,
              "full_finetune_steps": 60,
              "batch_size": 64,
              "device": "cuda",
          }
          per_seed, per_target, summary, metadata = (
              run_katja_global_physical_benchmark(
                  cache,
                  participants=DEFAULT_PARTICIPANTS,
                  target_participants=("s05",),
                  calibration_counts=(20,),
                  calibration_seeds=(13,),
                  n_source_participants=9,
                  source_selection_seed=13,
                  pca_components=256,
                  model_kwargs=model_kwargs,
              )
          )
          per_seed.to_csv(output / "per_seed.csv", index=False)
          per_target.to_csv(output / "per_target.csv", index=False)
          summary.to_csv(output / "summary.csv", index=False)
          (output / "metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(summary.to_string(index=False))
          PY

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: katja-global-physical-s05-fallback
          path: |
            ${{ runner.temp }}/katja-global-physical-s05-fallback.txt
            ${{ runner.temp }}/katja-global-physical-s05-fallback/*.csv
            ${{ runner.temp }}/katja-global-physical-s05-fallback/*.json
          if-no-files-found: warn

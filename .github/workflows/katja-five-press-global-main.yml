name: Katja five-press global k20 main-ref screen

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/katja-five-press-global-main.yml
      - src/neureptrace/katja_five_press_feature_cache.py
      - src/neureptrace/katja_five_press_sequence_benchmark.py
      - tests/test_katja_five_press_sequence_benchmark.py

permissions:
  contents: read

jobs:
  five-press-global:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 480
    env:
      KATJA_ROOT: /mnt/lexar4tb/datasets/Katja Button Press Data
      KATJA_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_five_press_exact_ica_v1.npz
      KATJA_OUT: ${{ runner.temp }}/katja-five-press-main
    steps:
      - uses: actions/checkout@v7
      - name: Select exact ICA inputs
        run: |
          git apply --recount --check experiments/katja-correct-order.patch
          git apply --recount experiments/katja-correct-order.patch
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install and validate
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pytest numpy scipy h5py
          python -m pytest -q tests/test_katja_five_press_sequence_benchmark.py
          nvidia-smi
          python - <<'PY'
          import torch
          assert torch.cuda.is_available(), "CUDA is required"
          print(torch.__version__, torch.cuda.get_device_name(0))
          PY
      - name: Build five-press cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KATJA_CACHE")"
          if [ ! -s "$KATJA_CACHE" ]; then
            tmp="${KATJA_CACHE%.npz}.tmp.${GITHUB_RUN_ID}.npz"
            python -m neureptrace.katja_five_press_feature_cache \
              --dataset-root "$KATJA_ROOT" --output "$tmp" \
              --button-lag-ms 30 --force
            mv "$tmp" "$KATJA_CACHE"
          fi
      - name: Run exact full cohort
        run: |
          python -m neureptrace.katja_five_press_sequence_benchmark \
            --feature-cache "$KATJA_CACHE" --output-dir "$KATJA_OUT" \
            --participants s05,s06,s08,s09,s10,s11,s13,s14,s15,s16,s17,s18,s20,s21,s24,s25,s28 \
            --calibration-counts 20 --calibration-seeds 13 \
            --n-source-participants 9 --source-selection-seed 2026 \
            --pca-components 256 --hidden-units 96 --num-layers 2 \
            --num-heads 4 --adapter-rank 8 --source-max-epochs 120 \
            --meta-epochs 2 --adapter-steps 80 --last-block-steps 60 \
            --full-finetune-steps 60 --batch-size 64 --device cuda \
            | tee "${RUNNER_TEMP}/katja-five-press-main.txt"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: katja-five-press-global-main
          path: |
            ${{ runner.temp }}/katja-five-press-main.txt
            ${{ runner.temp }}/katja-five-press-main/*.csv
            ${{ runner.temp }}/katja-five-press-main/*.json
          if-no-files-found: warn

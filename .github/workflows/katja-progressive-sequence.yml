name: Katja progressive sequence benchmark

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/katja-progressive-sequence.yml
      - src/neureptrace/katja_spm_feature_cache.py
      - src/neureptrace/katja_finger_sequence_benchmark.py
      - src/neureptrace/_katja_finger_sequence_support.py
      - src/neureptrace/decoding/_progressive_sequence_core.py
      - src/neureptrace/decoding/_progressive_sequence_model.py
      - src/neureptrace/decoding/_progressive_sequence_network.py
      - src/neureptrace/decoding/_progressive_sequence_training.py
      - src/neureptrace/decoding/progressive_sequence_finetune.py
      - tests/test_progressive_sequence_finetune.py
      - tests/test_katja_finger_sequence_benchmark.py
      - workflow-triggers/katja_progressive_sequence.txt

permissions:
  contents: read

jobs:
  build-and-pilot:
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 180
    env:
      KATJA_DATASET_ROOT: /mnt/lexar4tb/datasets/Katja Button Press Data
      KATJA_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_finger_events_v1.npz
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project and experiment dependencies
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pytest numpy scipy h5py

      - name: Verify GPU and focused tests
        run: |
          nvidia-smi
          python - <<'PY'
          import torch
          print({
              "torch": torch.__version__,
              "cuda_available": torch.cuda.is_available(),
              "cuda_device": torch.cuda.get_device_name(0) if torch.cuda.is_available() else None,
          })
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is required for the Katja neural pilot")
          PY
          python -m pytest -q \
            tests/test_progressive_sequence_finetune.py \
            tests/test_katja_finger_sequence_benchmark.py \
            | tee "${RUNNER_TEMP}/katja-progressive-tests.txt"

      - name: Build response-locked feature cache atomically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KATJA_CACHE")"
          if [ ! -s "$KATJA_CACHE" ]; then
            temporary="${KATJA_CACHE%.npz}.tmp.${GITHUB_RUN_ID}.npz"
            rm -f "$temporary"
            python -m neureptrace.katja_spm_feature_cache \
              --dataset-root "$KATJA_DATASET_ROOT" \
              --output "$temporary" \
              --button-lag-ms 30 \
              --force \
              | tee "${RUNNER_TEMP}/katja-feature-build.txt"
            mv "$temporary" "$KATJA_CACHE"
          else
            echo "Reusing $KATJA_CACHE" | tee "${RUNNER_TEMP}/katja-feature-build.txt"
          fi

      - name: Audit feature cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "${RUNNER_TEMP}/katja-cache-audit.txt"
          from __future__ import annotations

          import json
          import os
          from collections import Counter, defaultdict

          import numpy as np

          path = os.environ["KATJA_CACHE"]
          with np.load(path, allow_pickle=False) as cache:
              features = cache["features"]
              subjects = cache["subjects"].astype(str)
              trials = cache["trial_ids"]
              positions = cache["press_positions"].astype(int)
              sequences = cache["sequence_ids"].astype(int)
              fingers = cache["finger_codes"].astype(int)
              metadata = json.loads(str(cache["metadata_json"].item()))

          grouped: dict[tuple[str, int], list[tuple[int, int, int]]] = defaultdict(list)
          for subject, trial, position, sequence, finger in zip(
              subjects.tolist(),
              trials.tolist(),
              positions.tolist(),
              sequences.tolist(),
              fingers.tolist(),
              strict=True,
          ):
              grouped[(subject, int(trial))].append((position, sequence, finger))
          malformed = []
          for key, values in grouped.items():
              if sorted(position for position, _, _ in values) != [2, 3, 4, 5]:
                  malformed.append((key, "positions", values))
              if len({finger for _, _, finger in values}) != 4:
                  malformed.append((key, "fingers", values))
              if len({sequence for _, sequence, _ in values}) != 1:
                  malformed.append((key, "sequence", values))
          if malformed:
              raise RuntimeError(f"Malformed complete trials: {malformed[:5]}")
          if features.ndim != 2 or not np.all(np.isfinite(features)):
              raise RuntimeError("Feature matrix must be finite and two-dimensional")
          if float(np.std(features)) <= 0.0:
              raise RuntimeError("Feature matrix is constant")

          sequence_counts = Counter((subject, int(sequence)) for subject, sequence in zip(subjects[::4], sequences[::4], strict=True))
          report = {
              "path": path,
              "features_shape": list(features.shape),
              "feature_mean": float(np.mean(features)),
              "feature_std": float(np.std(features)),
              "n_subjects": len(set(subjects.tolist())),
              "n_trials": len(grouped),
              "selected_channel_count": metadata["selected_channel_count"],
              "trials_per_subject_sequence": {
                  f"{subject}:{sequence}": count
                  for (subject, sequence), count in sorted(sequence_counts.items())
              },
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          if report["n_subjects"] != 17:
              raise RuntimeError(f"Expected 17 participants, got {report['n_subjects']}")
          if min(sequence_counts.values()) < 21:
              raise RuntimeError("Every participant/sequence needs k20 plus evaluation trials")
          PY

      - name: Run s05 progressive-sequence pilot
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/katja-pilot-s05"
          python -m neureptrace.katja_finger_sequence_benchmark \
            --feature-cache "$KATJA_CACHE" \
            --output-dir "$output" \
            --targets s05 \
            --calibration-counts 1,3,5,10,15,20 \
            --calibration-seeds 13 \
            --source-max-epochs 120 \
            --meta-epochs 2 \
            --adapter-steps 80 \
            --last-block-steps 60 \
            --full-finetune-steps 60 \
            --batch-size 64 \
            --device cuda \
            | tee "${RUNNER_TEMP}/katja-pilot-s05.txt"

      - name: Upload audit and pilot results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: katja-progressive-sequence-pilot-s05
          path: |
            ${{ runner.temp }}/katja-progressive-tests.txt
            ${{ runner.temp }}/katja-feature-build.txt
            ${{ runner.temp }}/katja-cache-audit.txt
            ${{ runner.temp }}/katja-pilot-s05.txt
            ${{ runner.temp }}/katja-pilot-s05/*.csv
            ${{ runner.temp }}/katja-pilot-s05/*.json
          if-no-files-found: warn

name: Katja structured-loss development sweep

permissions:
    contents: read

on: # yamllint disable-line rule:truthy
    workflow_dispatch:
    pull_request:
        branches:
            - main
        paths:
            - .github/workflows/katja-progressive-sequence.yml
            - experiments/katja-correct-order.patch
            - experiments/katja-refit-full-data.patch
            - src/neureptrace/katja_spm_feature_cache.py
            - src/neureptrace/katja_finger_sequence_benchmark.py
            - src/neureptrace/_katja_finger_sequence_support.py
            - src/neureptrace/decoding/_progressive_sequence_core.py
            - src/neureptrace/decoding/_progressive_sequence_model.py
            - src/neureptrace/decoding/_progressive_sequence_network.py
            - src/neureptrace/decoding/_progressive_sequence_training.py
            - src/neureptrace/decoding/progressive_sequence_finetune.py
            - tests/test_progressive_sequence_finetune.py
            - tests/test_katja_finger_sequence_benchmark.py
            - workflow-triggers/katja_progressive_sequence.txt

concurrency:
    group: ${{ github.repository }}-katja-structured-development-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    structured-loss-sweep:
        name: Five-seed s05 development sweep
        runs-on: [self-hosted, Linux, X64, nvidia-smi]
        timeout-minutes: 180
        env:
            KATJA_DATASET_ROOT: /mnt/lexar4tb/datasets/Katja Button Press Data
            KATJA_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_finger_events_exact_ica_v4.npz
            KATJA_PATCH_BASELINE: ca2ca39a1a3e5d7fd0b7cee4f697c9a9e1a47aa4
        steps:
            - name: Check out experiment branch
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Restore patch baseline and apply experiment patches
              shell: bash
              run: |
                  set -euo pipefail
                  git fetch --no-tags --depth=1 origin "$KATJA_PATCH_BASELINE"
                  for path in \
                    src/neureptrace/decoding/_progressive_sequence_model.py \
                    src/neureptrace/decoding/_progressive_sequence_training.py
                  do
                      git show "$KATJA_PATCH_BASELINE:$path" > "$path"
                  done
                  git apply --check experiments/katja-correct-order.patch
                  git apply experiments/katja-correct-order.patch
                  git apply --check experiments/katja-refit-full-data.patch
                  git apply experiments/katja-refit-full-data.patch
                  git diff --check

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install project and evaluation dependencies
              run: |
                  python -m pip install --disable-pip-version-check -e .
                  python -m pip install --disable-pip-version-check pytest numpy scipy pandas h5py

            - name: Verify workstation2, CUDA, and focused tests
              shell: bash
              run: |
                  set -euo pipefail
                  nvidia-smi
                  python - <<'PY'
                  from pathlib import Path

                  import torch

                  root = Path("/mnt/lexar4tb/datasets/Katja Button Press Data")
                  report = {
                      "dataset_exists": root.is_dir(),
                      "dataset_root": str(root),
                      "torch": torch.__version__,
                      "cuda_available": torch.cuda.is_available(),
                      "cuda_device": (
                          torch.cuda.get_device_name(0)
                          if torch.cuda.is_available()
                          else None
                      ),
                  }
                  print(report)
                  if not root.is_dir():
                      raise SystemExit(f"Katja dataset directory is missing: {root}")
                  if not torch.cuda.is_available():
                      raise SystemExit("CUDA is required for the Katja development sweep")
                  PY
                  python -m pytest -q \
                    tests/test_progressive_sequence_finetune.py \
                    tests/test_katja_finger_sequence_benchmark.py \
                    | tee "${RUNNER_TEMP}/katja-structured-development-tests.txt"

            - name: Validate or rebuild exact ICA response-locked cache
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "$(dirname "$KATJA_CACHE")"
                  cache_valid=0
                  if [ -s "$KATJA_CACHE" ]; then
                      if python - <<'PY'
                  import json
                  import os

                  import numpy as np

                  path = os.environ["KATJA_CACHE"]
                  with np.load(path, allow_pickle=False) as archive:
                      metadata = json.loads(str(archive["metadata_json"].item()))
                      shape = list(archive["features"].shape)
                  assert metadata["format"] == "neureptrace_katja_button_press_event_features_exact_ica_v4"
                  assert metadata["correct_order_rule"] == "finite variable timing and recorded press equals cueFinger"
                  print({"cache": path, "shape": shape, "format": metadata["format"]})
                  PY
                      then
                          cache_valid=1
                      fi
                  fi
                  if [ "$cache_valid" -ne 1 ]; then
                      temporary="${KATJA_CACHE%.npz}.tmp.${GITHUB_RUN_ID}.npz"
                      rm -f "$temporary"
                      python -m neureptrace.katja_spm_feature_cache \
                        --dataset-root "$KATJA_DATASET_ROOT" \
                        --output "$temporary" \
                        --button-lag-ms 30 \
                        --force
                      mv "$temporary" "$KATJA_CACHE"
                  fi

            - name: Sweep structured objectives on development target s05
              shell: bash
              run: |
                  set -euo pipefail
                  output="${RUNNER_TEMP}/katja-structured-development"
                  mkdir -p "$output"
                  python - <<'PY' | tee "${RUNNER_TEMP}/katja-structured-development.txt"
                  from __future__ import annotations

                  import json
                  import os
                  import time
                  from pathlib import Path

                  import pandas as pd
                  import torch

                  from neureptrace._katja_finger_sequence_support import (
                      DEFAULT_CALIBRATION_SEEDS,
                      DEFAULT_PARTICIPANTS,
                      load_katja_feature_cache,
                  )
                  from neureptrace.katja_finger_sequence_benchmark import (
                      run_katja_finger_sequence_benchmark,
                  )

                  output = Path(os.environ["RUNNER_TEMP"]) / "katja-structured-development"
                  cache = load_katja_feature_cache(os.environ["KATJA_CACHE"])
                  base = {
                      "hidden_units": 96,
                      "num_layers": 2,
                      "num_heads": 4,
                      "adapter_rank": 8,
                      "source_max_epochs": 120,
                      "meta_epochs": 2,
                      "meta_support_trials": 4,
                      "meta_query_trials": 4,
                      "meta_inner_steps": 5,
                      "adapter_steps": 80,
                      "last_block_steps": 60,
                      "full_finetune_steps": 60,
                      "batch_size": 64,
                      "device": "cuda",
                      "refit_source_on_all": True,
                      "refit_target_on_all": True,
                  }
                  configurations = (
                      (
                          "independent",
                          {
                              "sinkhorn_loss_weight": 0.0,
                              "assignment_loss_weight": 0.0,
                              "sinkhorn_temperature": 1.0,
                          },
                      ),
                      (
                          "sinkhorn_025",
                          {
                              "sinkhorn_loss_weight": 0.25,
                              "assignment_loss_weight": 0.0,
                              "sinkhorn_temperature": 1.0,
                          },
                      ),
                      (
                          "assignment_010",
                          {
                              "sinkhorn_loss_weight": 0.0,
                              "assignment_loss_weight": 0.10,
                              "sinkhorn_temperature": 1.0,
                          },
                      ),
                      (
                          "joint_025_005",
                          {
                              "sinkhorn_loss_weight": 0.25,
                              "assignment_loss_weight": 0.05,
                              "sinkhorn_temperature": 1.0,
                          },
                      ),
                      (
                          "joint_050_010",
                          {
                              "sinkhorn_loss_weight": 0.50,
                              "assignment_loss_weight": 0.10,
                              "sinkhorn_temperature": 1.0,
                          },
                      ),
                      (
                          "joint_100_025",
                          {
                              "sinkhorn_loss_weight": 1.00,
                              "assignment_loss_weight": 0.25,
                              "sinkhorn_temperature": 1.0,
                          },
                      ),
                      (
                          "joint_200_050",
                          {
                              "sinkhorn_loss_weight": 2.00,
                              "assignment_loss_weight": 0.50,
                              "sinkhorn_temperature": 1.0,
                          },
                      ),
                      (
                          "joint_050_010_temp050",
                          {
                              "sinkhorn_loss_weight": 0.50,
                              "assignment_loss_weight": 0.10,
                              "sinkhorn_temperature": 0.50,
                          },
                      ),
                      (
                          "joint_100_025_temp050",
                          {
                              "sinkhorn_loss_weight": 1.00,
                              "assignment_loss_weight": 0.25,
                              "sinkhorn_temperature": 0.50,
                          },
                      ),
                  )
                  seed_frames = []
                  target_frames = []
                  summary_frames = []
                  run_metadata = {
                      "feature_cache": os.environ["KATJA_CACHE"],
                      "feature_format": "neureptrace_katja_button_press_event_features_exact_ica_v4",
                      "development_target": "s05",
                      "selection_endpoint": (
                          "mean five-seed independent k20 accuracy; "
                          "independent k15 then constrained k20 as tie-breakers"
                      ),
                      "calibration_seeds": list(DEFAULT_CALIBRATION_SEEDS),
                      "configurations": {},
                  }
                  for name, overrides in configurations:
                      started = time.time()
                      model_kwargs = {**base, **overrides}
                      per_seed, per_target, summary, metadata = (
                          run_katja_finger_sequence_benchmark(
                              cache,
                              participants=DEFAULT_PARTICIPANTS,
                              target_participants=("s05",),
                              calibration_counts=(15, 20),
                              calibration_seeds=DEFAULT_CALIBRATION_SEEDS,
                              n_source_participants=9,
                              source_selection_seed=13,
                              pca_components=64,
                              model_kwargs=model_kwargs,
                          )
                      )
                      elapsed = time.time() - started
                      for frame in (per_seed, per_target, summary):
                          frame.insert(0, "configuration", name)
                          frame.insert(1, "elapsed_seconds", elapsed)
                      seed_frames.append(per_seed)
                      target_frames.append(per_target)
                      summary_frames.append(summary)
                      run_metadata["configurations"][name] = {
                          "elapsed_seconds": elapsed,
                          "model_kwargs": model_kwargs,
                          "benchmark_metadata": metadata,
                      }
                      print(f"\n=== {name} ({elapsed:.1f} s) ===")
                      print(summary.to_string(index=False))
                      torch.cuda.empty_cache()

                  all_seed = pd.concat(seed_frames, ignore_index=True)
                  all_target = pd.concat(target_frames, ignore_index=True)
                  all_summary = pd.concat(summary_frames, ignore_index=True)
                  all_seed.to_csv(
                      output / "katja_structured_development_per_seed.csv",
                      index=False,
                  )
                  all_target.to_csv(
                      output / "katja_structured_development_per_target.csv",
                      index=False,
                  )
                  all_summary.to_csv(
                      output / "katja_structured_development_summary.csv",
                      index=False,
                  )

                  pivot = all_summary.pivot(
                      index="configuration",
                      columns="k",
                      values=[
                          "independent_accuracy_mean",
                          "permutation_accuracy_mean",
                      ],
                  )
                  ranking = pd.DataFrame(
                      {
                          "configuration": pivot.index,
                          "independent_k15": pivot[
                              "independent_accuracy_mean"
                          ][15].to_numpy(),
                          "independent_k20": pivot[
                              "independent_accuracy_mean"
                          ][20].to_numpy(),
                          "permutation_k20": pivot[
                              "permutation_accuracy_mean"
                          ][20].to_numpy(),
                      }
                  ).sort_values(
                      [
                          "independent_k20",
                          "independent_k15",
                          "permutation_k20",
                      ],
                      ascending=False,
                  )
                  ranking.to_csv(
                      output / "katja_structured_development_ranking.csv",
                      index=False,
                  )
                  selected_name = str(ranking.iloc[0]["configuration"])
                  selected_overrides = dict(configurations)[selected_name]
                  selected = {
                      "configuration": selected_name,
                      "overrides": selected_overrides,
                      "independent_k15": float(
                          ranking.iloc[0]["independent_k15"]
                      ),
                      "independent_k20": float(
                          ranking.iloc[0]["independent_k20"]
                      ),
                      "permutation_k20": float(
                          ranking.iloc[0]["permutation_k20"]
                      ),
                  }
                  run_metadata["selected"] = selected
                  (output / "katja_structured_development_selected.json").write_text(
                      json.dumps(selected, indent=2, sort_keys=True),
                      encoding="utf-8",
                  )
                  (output / "katja_structured_development_metadata.json").write_text(
                      json.dumps(run_metadata, indent=2, sort_keys=True),
                      encoding="utf-8",
                  )
                  print("\n=== Five-seed development ranking ===")
                  print(ranking.to_string(index=False))
                  print("\nSelected:")
                  print(json.dumps(selected, indent=2, sort_keys=True))
                  PY

            - name: Write development result to workflow summary
              if: always()
              shell: bash
              run: |
                  if ! command -v python >/dev/null 2>&1; then
                      exit 0
                  fi
                  python - <<'PY'
                  import os
                  from pathlib import Path

                  import pandas as pd

                  ranking_path = (
                      Path(os.environ["RUNNER_TEMP"])
                      / "katja-structured-development"
                      / "katja_structured_development_ranking.csv"
                  )
                  if not ranking_path.exists():
                      raise SystemExit(0)
                  ranking = pd.read_csv(ranking_path).copy()
                  for column in (
                      "independent_k15",
                      "independent_k20",
                      "permutation_k20",
                  ):
                      ranking[column] *= 100.0
                  with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
                      "a", encoding="utf-8"
                  ) as stream:
                      stream.write("## Katja structured-loss development sweep\n\n")
                      stream.write(
                          "Five seeds on development subject s05 only, using the "
                          "exact-order ICA-corrected feature cache. The 16-subject "
                          "confirmatory cohort was not used for selection.\n\n"
                      )
                      stream.write("```text\n")
                      stream.write(ranking.to_string(index=False))
                      stream.write("\n```\n")
                  PY

            - name: Upload structured-loss development results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: katja-structured-development-s05-exact-ica-v4
                  path: |
                      ${{ runner.temp }}/katja-structured-development-tests.txt
                      ${{ runner.temp }}/katja-structured-development.txt
                      ${{ runner.temp }}/katja-structured-development/*.csv
                      ${{ runner.temp }}/katja-structured-development/*.json
                  if-no-files-found: warn

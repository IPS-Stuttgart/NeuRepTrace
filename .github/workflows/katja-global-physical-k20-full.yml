name: Katja exact ICA global physical-finger full k20

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/katja-global-physical-k20-full.yml
      - experiments/katja-correct-order.patch
      - src/neureptrace/_katja_finger_sequence_support.py
      - src/neureptrace/katja_global_physical_benchmark.py
      - src/neureptrace/decoding/_progressive_sequence_model.py
      - src/neureptrace/decoding/_progressive_sequence_training.py

permissions:
  contents: read

jobs:
  full-k20:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 420
    env:
      KATJA_DATASET_ROOT: /mnt/lexar4tb/datasets/Katja Button Press Data
      KATJA_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_finger_events_exact_ica_v4.npz
    steps:
      - uses: actions/checkout@v7

      - name: Apply exact ICA and correct-order protocol
        run: |
          git apply --recount --check experiments/katja-correct-order.patch
          git apply --recount experiments/katja-correct-order.patch

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check numpy scipy h5py

      - name: Verify CUDA
        run: |
          nvidia-smi
          python - <<'PY'
          import torch

          print(
              {
                  "torch": torch.__version__,
                  "cuda_available": torch.cuda.is_available(),
                  "cuda_device": (
                      torch.cuda.get_device_name(0)
                      if torch.cuda.is_available()
                      else None
                  ),
              }
          )
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is required")
          PY

      - name: Require exact ICA feature cache
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s "$KATJA_CACHE" ]; then
            mkdir -p "$(dirname "$KATJA_CACHE")"
            temporary="${KATJA_CACHE%.npz}.tmp.${GITHUB_RUN_ID}.npz"
            python -m neureptrace.katja_spm_feature_cache \
              --dataset-root "$KATJA_DATASET_ROOT" \
              --output "$temporary" \
              --button-lag-ms 30 \
              --force
            mv "$temporary" "$KATJA_CACHE"
          fi

      - name: Run all 17 targets at k20 seed 13
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/katja-global-physical-k20-full"
          mkdir -p "$output"
          python - <<'PY' | tee "${RUNNER_TEMP}/katja-global-physical-k20-full.txt"
          from __future__ import annotations

          import json
          import os
          import time
          from pathlib import Path

          import neureptrace.katja_global_physical_benchmark as benchmark
          from neureptrace._katja_finger_sequence_support import (
              DEFAULT_PARTICIPANTS,
              katja_nested_trial_calibration_indices,
              load_katja_feature_cache,
          )
          from neureptrace.decoding.progressive_sequence_finetune import (
              NestedTrialCalibrationSplit,
          )

          def exact_splits(
              strata,
              calibration_counts=(20,),
              *,
              max_per_stratum=None,
              min_evaluation_per_stratum=1,
              seed=13,
              context=(),
          ):
              del context
              counts = tuple(int(value) for value in calibration_counts)
              if max_per_stratum is not None and int(max_per_stratum) != max(counts):
                  raise ValueError("Exact Katja split requires max_per_stratum=max(calibration_counts).")
              if int(min_evaluation_per_stratum) != 1:
                  raise ValueError("Exact Katja split uses at least one evaluation trial per sequence.")
              calibration, evaluation, pool = katja_nested_trial_calibration_indices(
                  strata,
                  counts,
                  seed=int(seed),
              )
              return {
                  count: NestedTrialCalibrationSplit(
                      calibration_indices=indices,
                      evaluation_indices=evaluation.copy(),
                      calibration_pool_indices=pool.copy(),
                      per_stratum=int(count),
                      max_per_stratum=max(counts),
                      seed=int(seed),
                  )
                  for count, indices in calibration.items()
              }

          benchmark.select_nested_trial_calibration_splits = exact_splits
          output = Path(os.environ["RUNNER_TEMP"]) / "katja-global-physical-k20-full"
          cache = load_katja_feature_cache(os.environ["KATJA_CACHE"])
          model_kwargs = {
              "hidden_units": 96,
              "num_layers": 2,
              "num_heads": 4,
              "adapter_rank": 8,
              "source_max_epochs": 120,
              "meta_epochs": 2,
              "meta_support_trials": 4,
              "meta_query_trials": 4,
              "meta_inner_steps": 5,
              "adapter_steps": 80,
              "last_block_steps": 60,
              "full_finetune_steps": 60,
              "batch_size": 64,
              "device": "cuda",
          }
          started = time.time()
          per_seed, per_target, summary, metadata = (
              benchmark.run_katja_global_physical_benchmark(
                  cache,
                  participants=DEFAULT_PARTICIPANTS,
                  target_participants=DEFAULT_PARTICIPANTS,
                  calibration_counts=(20,),
                  calibration_seeds=(13,),
                  n_source_participants=9,
                  source_selection_seed=2026,
                  pca_components=256,
                  model_kwargs=model_kwargs,
              )
          )
          metadata.update(
              {
                  "comparison_source_seed": 2026,
                  "comparison_split_implementation": "recovered_sequential_rng",
                  "spm_input_selection": "Bfc*ICA_corrected.mat",
                  "elapsed_seconds": time.time() - started,
                  "screening_policy": "pre_registered_after_s05_four_window_vs_high_resolution_ablation",
              }
          )
          per_seed.to_csv(output / "per_seed.csv", index=False)
          per_target.to_csv(output / "per_target.csv", index=False)
          summary.to_csv(output / "summary.csv", index=False)
          (output / "metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print("\n=== population summary ===")
          print(summary.to_string(index=False))
          print("\n=== per-target ranking ===")
          print(
              per_target.sort_values("independent_accuracy", ascending=False).to_string(
                  index=False
              )
          )
          PY

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: katja-global-physical-k20-full
          path: |
            ${{ runner.temp }}/katja-global-physical-k20-full.txt
            ${{ runner.temp }}/katja-global-physical-k20-full/*.csv
            ${{ runner.temp }}/katja-global-physical-k20-full/*.json
          if-no-files-found: warn

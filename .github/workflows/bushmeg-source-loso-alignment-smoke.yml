name: BUSH-MEG source LOSO alignment smoke

run-name: BUSH-MEG source LOSO alignment smoke method=${{ inputs.alignment_method }} anchor=${{ inputs.alignment_anchor_mode }} shuffle=${{ inputs.label_shuffle_control }}

on:
    workflow_dispatch:
        inputs:
            participants:
                description: "BUSH-MEG participants; use at least 3 for strict source-only alignment"
                required: true
                default: "1-3"
            alignment_method:
                description: "Strict source-only alignment method"
                required: true
                type: choice
                options:
                    - none
                    - procrustes
                    - hyperalignment
                    - mcca
                default: none
            alignment_anchor_mode:
                description: "Source-label anchor representation"
                required: true
                type: choice
                options:
                    - class_mean
                    - class_repetition
                default: class_mean
            label_shuffle_control:
                description: "Shuffle train-fold labels as a matched null control"
                required: true
                type: boolean
                default: false
            label_shuffle_seed:
                description: "Seed for label-shuffle null controls"
                required: true
                default: "13"

jobs:
    bushmeg-source-loso-alignment-smoke:
        runs-on: ubuntu-latest
        timeout-minutes: 240
        env:
            BUSH_MEG_DATA_DIR: ${{ github.workspace }}/.cache/bushmeg
            BUSHMEG_DATA_DIR: ${{ github.workspace }}/.cache/bushmeg
            BUSHMEG_WEBDAV_URL: ${{ secrets.BUSHMEG_WEBDAV_URL }}
            BUSHMEG_DATA_KEY: ${{ secrets.BUSHMEG_DATA_KEY }}
            BUSHMEG_DATA_PASSWORD: ${{ secrets.BUSHMEG_DATA_PASSWORD }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Restore existing BUSH-MEG data cache
              uses: actions/cache/restore@v5
              with:
                  path: .cache/bushmeg
                  key: bushmeg-data-v1
                  restore-keys: |
                      bushmeg-data-

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: pip

            - name: Install NeuRepTrace
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e .

            - name: Download BUSH-MEG source LOSO smoke files
              run: |
                  python -m neureptrace.bushmeg_data prepare-smoke \
                    --data-dir "$BUSH_MEG_DATA_DIR" \
                    --participants "${{ inputs.participants }}" \
                    --roles main \
                    --max-files 3

            - name: Run BUSH-MEG source LOSO alignment smoke
              run: |
                  python -m neureptrace.bushmeg_source_loso \
                    configs/bush_meg/source_loso_alignment_smoke.yml \
                    --set "participants.ids=${{ inputs.participants }}" \
                    --set "source_loso.alignment_method=${{ inputs.alignment_method }}" \
                    --set "source_loso.alignment_anchor_mode=${{ inputs.alignment_anchor_mode }}" \
                    --set "source_loso.alignment_repetition_cap=16" \
                    --set "source_loso.alignment_components=64" \
                    --set "source_loso.alignment_times=[0.088,0.136,0.184,0.232,0.280]" \
                    --set "source_loso.alignment_target_projection=group_projection" \
                    --set "source_loso.label_shuffle_control=${{ inputs.label_shuffle_control }}" \
                    --set "source_loso.label_shuffle_seed=${{ inputs.label_shuffle_seed }}"

            - name: Upload BUSH-MEG source LOSO alignment smoke output
              uses: actions/upload-artifact@v7
              with:
                  name: bushmeg-source-loso-alignment-smoke-${{ inputs.alignment_method }}-${{ inputs.alignment_anchor_mode }}-shuffle-${{ inputs.label_shuffle_control }}
                  path: outputs/bushmeg_source_loso_alignment_smoke

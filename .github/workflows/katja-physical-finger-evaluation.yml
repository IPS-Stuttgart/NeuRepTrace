name: Katja physical-finger outer-fold evaluation

permissions:
    contents: read

on: # yamllint disable-line rule:truthy
    workflow_dispatch:
    pull_request:
        branches:
            - agent/katja-source-model-ensemble
        paths:
            - .github/workflows/katja-physical-finger-evaluation.yml

jobs:
    archive-note:
        name: Physical-finger evaluation archived
        runs-on: ubuntu-latest
        steps:
            - name: Record completed frozen comparison
              run: |
                  echo "The frozen 17-target physical-head comparison completed in run 31021832048."
                  echo "Local 3-model ensemble: 61.7276% independent k20."
                  echo "Masked physical 3-model ensemble: 61.0502%."
                  echo "Uniform local/physical 6-model blend: 62.0223%."
                  echo "Blend paired delta: +0.2947 pp, 95% interval [-0.2454,+0.8349] pp, p=0.2644."
                  echo "Artifact: 8937965215."
                  echo "The self-hosted execution trigger was removed after completion."

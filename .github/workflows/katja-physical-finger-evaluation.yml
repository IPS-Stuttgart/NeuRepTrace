name: Katja physical-finger outer-fold evaluation

permissions:
    contents: read

on: # yamllint disable-line rule:truthy
    workflow_dispatch:
    pull_request:
        branches:
            - agent/katja-source-model-ensemble
        paths:
            - workflow-triggers/katja_physical_finger_evaluation.txt

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    physical-finger-evaluation:
        name: Dual-GPU 17-target physical-head comparison
        runs-on: [self-hosted, Linux, X64, nvidia-smi]
        timeout-minutes: 360
        env:
            KATJA_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_finger_events_exact_ica_v4.npz
            KATJA_CONFIG: experiments/katja-physical-finger-evaluation-config.json
            KATJA_PATCH_BASELINE: ca2ca39a1a3e5d7fd0b7cee4f697c9a9e1a47aa4
            KATJA_TARGETS: s05,s06,s08,s09,s10,s11,s13,s14,s15,s16,s17,s18,s20,s21,s24,s25,s28
            KATJA_SEEDS: 13,29,47,71,101
            OMP_NUM_THREADS: "2"
            MKL_NUM_THREADS: "2"
            OPENBLAS_NUM_THREADS: "2"
            PYTHONUNBUFFERED: "1"
        steps:
            - name: Check out experiment branch
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Validate frozen evaluation scope
              shell: bash
              run: |
                  set -euo pipefail
                  python - <<'PY'
                  import json
                  import os
                  from pathlib import Path

                  config = json.loads(Path(os.environ["KATJA_CONFIG"]).read_text(encoding="utf-8"))
                  expected_targets = os.environ["KATJA_TARGETS"].split(",")
                  expected_seeds = [int(value) for value in os.environ["KATJA_SEEDS"].split(",")]
                  assert config["enabled"] is True
                  assert config["analysis_status"] == "frozen_structural_outer_pseudo_target_evaluation"
                  assert config["targets"] == expected_targets
                  assert config["calibration_seeds"] == expected_seeds
                  assert config["calibration_count"] == 20
                  assert config["source_participants_per_target"] == 9
                  assert config["source_selection_seed"] == 13
                  assert config["primary_candidate"] == "local_physical_blend6"
                  assert config["reference_method"] == "local_ensemble3"
                  assert config["candidate_methods"] == [
                      "local_ensemble3",
                      "physical_ensemble3_masked",
                      "local_physical_blend6",
                  ]
                  print(json.dumps(config, indent=2, sort_keys=True))
                  PY

            - name: Restore model baseline and apply full-data refit patch
              shell: bash
              run: |
                  set -euo pipefail
                  git fetch --no-tags --depth=1 origin "$KATJA_PATCH_BASELINE"
                  for path in \
                    src/neureptrace/decoding/_progressive_sequence_model.py \
                    src/neureptrace/decoding/_progressive_sequence_training.py
                  do
                      git show "$KATJA_PATCH_BASELINE:$path" > "$path"
                  done
                  git apply --check experiments/katja-refit-full-data.patch
                  git apply experiments/katja-refit-full-data.patch
                  git diff --check

            - name: Install project and evaluation dependencies
              run: |
                  python -m pip install --disable-pip-version-check -e .
                  python -m pip install --disable-pip-version-check pytest numpy scipy pandas h5py

            - name: Verify dual GPUs, scripts, and focused tests
              shell: bash
              run: |
                  set -euo pipefail
                  nvidia-smi
                  python - <<'PY'
                  import torch

                  report = {
                      "torch": torch.__version__,
                      "cuda_available": torch.cuda.is_available(),
                      "cuda_device_count": torch.cuda.device_count(),
                      "cuda_devices": [
                          torch.cuda.get_device_name(index)
                          for index in range(torch.cuda.device_count())
                      ],
                  }
                  print(report)
                  if not torch.cuda.is_available() or torch.cuda.device_count() < 2:
                      raise SystemExit("Two CUDA devices are required for this workflow")
                  PY
                  python -m py_compile \
                    experiments/katja_physical_finger_benchmark.py \
                    experiments/katja_physical_finger_combine.py \
                    experiments/katja_physical_finger_audit.py \
                    src/neureptrace/katja_physical_finger.py
                  python -m pytest -q \
                    tests/test_katja_physical_finger.py \
                    tests/test_progressive_sequence_finetune.py \
                    tests/test_katja_finger_sequence_benchmark.py \
                    | tee "${RUNNER_TEMP}/katja-physical-tests.txt"

            - name: Validate exact ICA response-locked cache
              shell: bash
              run: |
                  set -euo pipefail
                  test -s "$KATJA_CACHE"
                  python - <<'PY'
                  import json
                  import os

                  import numpy as np

                  with np.load(os.environ["KATJA_CACHE"], allow_pickle=False) as archive:
                      metadata = json.loads(str(archive["metadata_json"].item()))
                      shape = list(archive["features"].shape)
                  assert metadata["format"] == "neureptrace_katja_button_press_event_features_exact_ica_v4"
                  assert metadata["correct_order_rule"] == "finite variable timing and recorded press equals cueFinger"
                  print({"cache": os.environ["KATJA_CACHE"], "shape": shape, "format": metadata["format"]})
                  PY

            - name: Run frozen physical-head comparison with eight workers
              shell: bash
              run: |
                  set -euo pipefail
                  root="${RUNNER_TEMP}/katja-physical-finger"
                  mkdir -p "$root"
                  groups=(
                    "s05,s06,s08"
                    "s09,s10"
                    "s11,s13"
                    "s14,s15"
                    "s16,s17"
                    "s18,s20"
                    "s21,s24"
                    "s25,s28"
                  )
                  gpus=(0 0 0 0 1 1 1 1)
                  pids=()
                  for worker in "${!groups[@]}"; do
                      output="$root/worker${worker}"
                      mkdir -p "$output"
                      CUDA_VISIBLE_DEVICES="${gpus[$worker]}" \
                        python experiments/katja_physical_finger_benchmark.py \
                          --feature-cache "$KATJA_CACHE" \
                          --targets "${groups[$worker]}" \
                          --calibration-seeds "$KATJA_SEEDS" \
                          --output-dir "$output" \
                          > "$root/worker${worker}.log" 2>&1 &
                      pids+=("$!")
                  done

                  status=0
                  for index in "${!pids[@]}"; do
                      if ! wait "${pids[$index]}"; then
                          echo "Worker ${index} failed" >&2
                          status=1
                      fi
                  done
                  for log in "$root"/worker*.log; do
                      echo "===== ${log##*/} ====="
                      cat "$log"
                  done
                  exit "$status"

            - name: Combine outer-target results
              shell: bash
              run: |
                  set -euo pipefail
                  root="${RUNNER_TEMP}/katja-physical-finger"
                  combined="$root/combined"
                  python experiments/katja_physical_finger_combine.py \
                    --root "$root" \
                    --targets "$KATJA_TARGETS" \
                    --seeds "$KATJA_SEEDS" \
                    --output-dir "$combined" \
                    | tee "${RUNNER_TEMP}/katja-physical-combined.txt"

            - name: Write physical-head result to workflow summary
              if: always()
              shell: bash
              run: |
                  if ! command -v python >/dev/null 2>&1; then
                      exit 0
                  fi
                  python - <<'PY'
                  import os
                  from pathlib import Path

                  import pandas as pd

                  combined = Path(os.environ["RUNNER_TEMP"]) / "katja-physical-finger" / "combined"
                  summary_path = combined / "katja_physical_summary.csv"
                  paired_path = combined / "katja_physical_paired.csv"
                  if not summary_path.exists() or not paired_path.exists():
                      raise SystemExit(0)
                  summary = pd.read_csv(summary_path).copy()
                  paired = pd.read_csv(paired_path).copy()
                  for column in (
                      "independent_accuracy_mean",
                      "independent_accuracy_sem",
                      "permutation_accuracy_mean",
                      "permutation_accuracy_sem",
                      "independent_delta_vs_julia",
                  ):
                      summary[column] *= 100.0
                  for column in (
                      "mean_independent_delta",
                      "sem_independent_delta",
                      "ci95_lower",
                      "ci95_upper",
                  ):
                      paired[column] *= 100.0
                  with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
                      stream.write("## Katja physical-finger outer-fold evaluation\n\n")
                      stream.write("Frozen k20 comparison over all 17 outer pseudo-targets.\n\n")
                      stream.write("```text\n")
                      stream.write(summary.to_string(index=False))
                      stream.write("\n\n")
                      stream.write(paired.to_string(index=False))
                      stream.write("\n```\n")
                  PY

            - name: Upload physical-head evaluation
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: katja-physical-finger-outer-folds
                  path: |
                      ${{ runner.temp }}/katja-physical-tests.txt
                      ${{ runner.temp }}/katja-physical-combined.txt
                      ${{ runner.temp }}/katja-physical-finger/worker*.log
                      ${{ runner.temp }}/katja-physical-finger/worker*/*.csv
                      ${{ runner.temp }}/katja-physical-finger/worker*/*.json
                      ${{ runner.temp }}/katja-physical-finger/combined/*.csv
                      ${{ runner.temp }}/katja-physical-finger/combined/*.json
                  if-no-files-found: warn

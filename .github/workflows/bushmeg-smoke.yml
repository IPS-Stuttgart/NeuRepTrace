name: BUSH-MEG smoke

on:
    workflow_dispatch:
        inputs:
            run_source_loso_alignment:
                description: "Also run strict source-only BUSH-MEG LOSO alignment smoke"
                required: true
                type: boolean
                default: false
            source_loso_participants:
                description: "BUSH-MEG participants for source LOSO alignment smoke; use at least 3"
                required: false
                default: "1-3"
            alignment_method:
                description: "Strict source-only alignment method"
                required: true
                type: choice
                options:
                    - none
                    - procrustes
                    - hyperalignment
                    - mcca
                    - euclidean
                    - coral
                    - target_baseline_covariance
                    - subject_sensor_covariance
                default: none
            alignment_anchor_mode:
                description: "Source-label anchor representation"
                required: true
                type: choice
                options:
                    - class_mean
                    - class_repetition
                default: class_mean
            label_shuffle_control:
                description: "Shuffle train-fold labels as a matched null control"
                required: true
                type: boolean
                default: false
            label_shuffle_seed:
                description: "Seed for label-shuffle null controls"
                required: true
                default: "13"
    pull_request:
        paths:
            - ".github/workflows/bushmeg-smoke.yml"
            - "examples/configs/bushmeg_transfer*.yml"
            - "src/neureptrace/bushmeg_data.py"
            - "src/neureptrace/dataset_config.py"
            - "src/neureptrace/io/**"
            - "src/neureptrace/transfer_from_config.py"
            - "tests/test_bushmeg_data.py"
            - "tests/test_dataset_config_file_templates.py"

jobs:
    bushmeg-smoke:
        runs-on: ubuntu-latest
        env:
            BUSH_MEG_DATA_DIR: ${{ github.workspace }}/.cache/bushmeg
            BUSHMEG_DATA_DIR: ${{ github.workspace }}/.cache/bushmeg
            BUSHMEG_WEBDAV_URL: ${{ secrets.BUSHMEG_WEBDAV_URL }}
            BUSHMEG_DATA_KEY: ${{ secrets.BUSHMEG_DATA_KEY }}
            BUSHMEG_DATA_PASSWORD: ${{ secrets.BUSHMEG_DATA_PASSWORD }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Restore existing BUSH-MEG data cache only
              uses: actions/cache/restore@v5
              with:
                  path: .cache/bushmeg
                  key: bushmeg-data-v1
                  restore-keys: |
                      bushmeg-data-

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"
                  cache: pip

            - name: Install NeuRepTrace
              run: |
                  python -m pip install --upgrade pip
                  python -m pip install -e . pytest

            - name: Run non-private smoke helper tests
              run: |
                  pytest -q tests/test_bushmeg_data.py tests/test_dataset_config_file_templates.py

            - name: Check cached files and credentials
              id: bushmeg_inputs
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ -f "$BUSHMEG_DATA_DIR/Part2Data.mat" && -f "$BUSHMEG_DATA_DIR/Part2CueData.mat" ]]; then
                    echo "files_present=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "files_present=false" >> "$GITHUB_OUTPUT"
                  fi
                  if [[ -n "${BUSHMEG_WEBDAV_URL:-}" && -n "${BUSHMEG_DATA_KEY:-}" && -n "${BUSHMEG_DATA_PASSWORD:-}" ]]; then
                    echo "credentials_present=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "credentials_present=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Download only the requested BUSH-MEG smoke files
              if: steps.bushmeg_inputs.outputs.files_present != 'true' && steps.bushmeg_inputs.outputs.credentials_present == 'true'
              run: |
                  python -m neureptrace.bushmeg_data prepare-smoke \
                    --data-dir "$BUSHMEG_DATA_DIR" \
                    --participants 2 \
                    --roles main cue \
                    --max-files 2 \
                    --allow-missing

            - name: Re-check smoke data availability
              id: bushmeg_ready
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ -f "$BUSHMEG_DATA_DIR/Part2Data.mat" && -f "$BUSHMEG_DATA_DIR/Part2CueData.mat" ]]; then
                    echo "ready=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "ready=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Explain skipped private-data smoke
              if: steps.bushmeg_ready.outputs.ready != 'true'
              run: |
                  echo "Skipping private BUSH-MEG smoke: Part2Data.mat/Part2CueData.mat are not cached or could not be downloaded."

            - name: Run NeuRepTrace BUSH-MEG transfer smoke
              if: steps.bushmeg_ready.outputs.ready == 'true'
              run: |
                  python -m neureptrace.dataset_config examples/configs/bushmeg_transfer_smoke.yml --check-files --print-effective-config
                  python -m neureptrace.transfer_from_config examples/configs/bushmeg_transfer_smoke.yml --no-provenance
                  python - <<'PY'
                  from pathlib import Path
                  import pandas as pd

                  summary = Path("outputs/bushmeg_smoke/transfer_summary.csv")
                  observations = Path("outputs/bushmeg_smoke/transfer_observations.csv")
                  assert summary.exists() and summary.stat().st_size > 0, summary
                  assert observations.exists() and observations.stat().st_size > 0, observations
                  rows = pd.read_csv(summary)
                  assert len(rows) > 0
                  assert rows["n_train"].min() > 0
                  assert rows["n_test"].min() > 0
                  assert rows["n_classes"].min() >= 2
                  PY

            - name: Download BUSH-MEG source LOSO smoke files
              if: github.event_name == 'workflow_dispatch' && inputs.run_source_loso_alignment
              run: |
                  python -m neureptrace.bushmeg_data prepare-smoke \
                    --data-dir "$BUSH_MEG_DATA_DIR" \
                    --participants "${{ inputs.source_loso_participants }}" \
                    --roles main \
                    --max-files 3

            - name: Run strict source-only BUSH-MEG LOSO alignment smoke
              if: github.event_name == 'workflow_dispatch' && inputs.run_source_loso_alignment
              run: |
                  python -m neureptrace.bushmeg_source_loso \
                    configs/bush_meg/source_loso_alignment_smoke.yml \
                    --set "participants.ids=${{ inputs.source_loso_participants }}" \
                    --set "source_loso.alignment_method=${{ inputs.alignment_method }}" \
                    --set "source_loso.alignment_anchor_mode=${{ inputs.alignment_anchor_mode }}" \
                    --set "source_loso.alignment_repetition_cap=16" \
                    --set "source_loso.alignment_components=64" \
                    --set "source_loso.alignment_times=same_decode_window" \
                    --set "source_loso.alignment_target_projection=group_projection" \
                    --set "source_loso.label_shuffle_control=${{ inputs.label_shuffle_control }}" \
                    --set "source_loso.label_shuffle_seed=${{ inputs.label_shuffle_seed }}"

            - name: Upload BUSH-MEG source LOSO alignment smoke output
              if: github.event_name == 'workflow_dispatch' && inputs.run_source_loso_alignment
              uses: actions/upload-artifact@v7
              with:
                  name: bushmeg-source-loso-alignment-smoke-${{ inputs.alignment_method }}-${{ inputs.alignment_anchor_mode }}-shuffle-${{ inputs.label_shuffle_control }}
                  path: outputs/bushmeg_source_loso_alignment_smoke

name: Katja high-resolution global-finger s05 benchmark

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/katja-global-physical-finger
    paths:
      - .github/workflows/katja-highres-global-s05.yml

permissions:
  contents: read

jobs:
  highres-global-s05:
    runs-on: [self-hosted, Linux, X64, nvidia-smi]
    timeout-minutes: 180
    env:
      KATJA_DATASET_ROOT: /mnt/lexar4tb/datasets/Katja Button Press Data
      KATJA_HIGHRES_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_finger_events_16x25ms_v1.npz
    steps:
      - name: Check out experiment branch
        uses: actions/checkout@v7

      - name: Apply current protocol and refit experiments
        run: |
          git apply --check experiments/katja-correct-order.patch
          git apply experiments/katja-correct-order.patch
          git apply --check experiments/katja-refit-full-data.patch
          git apply experiments/katja-refit-full-data.patch

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install project and experiment dependencies
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pytest numpy scipy h5py

      - name: Verify CUDA and focused tests
        run: |
          nvidia-smi
          python - <<'PY'
          import torch

          print(
              {
                  "torch": torch.__version__,
                  "cuda_available": torch.cuda.is_available(),
                  "cuda_device": (
                      torch.cuda.get_device_name(0)
                      if torch.cuda.is_available()
                      else None
                  ),
              }
          )
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is required for the Katja neural sweep")
          PY
          python -m pytest -q \
            tests/test_progressive_sequence_finetune.py \
            tests/test_katja_finger_sequence_benchmark.py \
            tests/test_katja_global_physical_benchmark.py \
            | tee "${RUNNER_TEMP}/katja-highres-global-tests.txt"

      - name: Build 16-bin response-locked cache when absent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KATJA_HIGHRES_CACHE")"
          if [ ! -s "$KATJA_HIGHRES_CACHE" ]; then
            temporary="${KATJA_HIGHRES_CACHE%.npz}.tmp.${GITHUB_RUN_ID}.npz"
            rm -f "$temporary"
            python - "$temporary" <<'PY'
          from __future__ import annotations

          import json
          import sys

          import numpy as np

          from neureptrace.katja_spm_feature_cache import (
              build_katja_spm_feature_cache,
          )

          response_start = -0.2
          response_stop = 0.2
          temporal_bins = 16
          width = (response_stop - response_start) / temporal_bins
          centers = tuple(
              response_start + (index + 0.5) * width
              for index in range(temporal_bins)
          )
          metadata = build_katja_spm_feature_cache(
              "/mnt/lexar4tb/datasets/Katja Button Press Data",
              sys.argv[1],
              window_centers_seconds=centers,
              window_width_seconds=width,
              button_lag_seconds=0.03,
          )
          metadata["response_start_seconds"] = response_start
          metadata["response_stop_seconds"] = response_stop
          metadata["temporal_bins"] = temporal_bins
          print(json.dumps(metadata, indent=2, sort_keys=True))
          PY
            mv "$temporary" "$KATJA_HIGHRES_CACHE"
          fi

      - name: Audit high-resolution cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "${RUNNER_TEMP}/katja-highres-cache-audit.txt"
          from __future__ import annotations

          import json
          import os

          import numpy as np

          from neureptrace._katja_finger_sequence_support import (
              load_katja_feature_cache,
          )

          cache = load_katja_feature_cache(os.environ["KATJA_HIGHRES_CACHE"])
          subjects = cache["subjects"].astype(str)
          report = {
              "features_shape": list(cache["features"].shape),
              "feature_width": int(cache["features"].shape[1]),
              "participants": sorted(set(subjects.tolist())),
              "n_participants": int(np.unique(subjects).shape[0]),
              "all_finite": bool(np.all(np.isfinite(cache["features"]))),
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          if report["feature_width"] % 16:
              raise SystemExit("High-resolution feature width is not divisible by 16")
          PY

      - name: Sweep high-resolution global physical-finger models on s05
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/katja-highres-global-s05"
          mkdir -p "$output"
          python - <<'PY' | tee "${RUNNER_TEMP}/katja-highres-global-s05.txt"
          from __future__ import annotations

          import json
          import os
          import time
          from pathlib import Path

          import pandas as pd

          from neureptrace._katja_finger_sequence_support import (
              DEFAULT_PARTICIPANTS,
              load_katja_feature_cache,
          )
          from neureptrace.katja_global_physical_benchmark import (
              run_katja_global_physical_benchmark,
          )

          output = Path(os.environ["RUNNER_TEMP"]) / "katja-highres-global-s05"
          cache = load_katja_feature_cache(os.environ["KATJA_HIGHRES_CACHE"])
          base = {
              "hidden_units": 128,
              "num_layers": 2,
              "num_heads": 4,
              "adapter_rank": 16,
              "source_max_epochs": 120,
              "meta_epochs": 2,
              "meta_support_trials": 4,
              "meta_query_trials": 4,
              "meta_inner_steps": 5,
              "adapter_steps": 100,
              "last_block_steps": 80,
              "full_finetune_steps": 80,
              "batch_size": 64,
              "device": "cuda",
              "refit_source_on_all": True,
              "refit_target_on_all": True,
          }
          configurations = [
              ("highres16_pca128", 128, {}),
              ("highres16_pca512", 512, {}),
              (
                  "highres16_raw_strong",
                  None,
                  {
                      "source_replay_weight": 0.25,
                      "l2sp_weight": 1e-3,
                      "adaptation_learning_rate": 1e-3,
                      "full_finetune_learning_rate": 5e-5,
                      "dropout": 0.20,
                      "feature_dropout": 0.10,
                  },
              ),
          ]
          seed_frames = []
          target_frames = []
          summary_frames = []
          metadata = {}
          for name, pca_components, overrides in configurations:
              started = time.time()
              kwargs = {**base, **overrides}
              per_seed, per_target, summary, run_metadata = (
                  run_katja_global_physical_benchmark(
                      cache,
                      participants=DEFAULT_PARTICIPANTS,
                      target_participants=("s05",),
                      calibration_counts=(20,),
                      calibration_seeds=(13,),
                      n_source_participants=9,
                      source_selection_seed=13,
                      pca_components=pca_components,
                      model_kwargs=kwargs,
                  )
              )
              elapsed = time.time() - started
              for frame in (per_seed, per_target, summary):
                  frame.insert(0, "configuration", name)
                  frame.insert(
                      1,
                      "pca_components",
                      "none" if pca_components is None else pca_components,
                  )
                  frame.insert(2, "elapsed_seconds", elapsed)
              seed_frames.append(per_seed)
              target_frames.append(per_target)
              summary_frames.append(summary)
              metadata[name] = {
                  "pca_components": pca_components,
                  "model_kwargs": kwargs,
                  "elapsed_seconds": elapsed,
                  "benchmark_metadata": run_metadata,
              }
              print("\n===", name, f"({elapsed:.1f} s) ===")
              print(summary.to_string(index=False))

          all_seed = pd.concat(seed_frames, ignore_index=True)
          all_target = pd.concat(target_frames, ignore_index=True)
          all_summary = pd.concat(summary_frames, ignore_index=True)
          all_seed.to_csv(output / "per_seed.csv", index=False)
          all_target.to_csv(output / "per_target.csv", index=False)
          all_summary.to_csv(output / "summary.csv", index=False)
          (output / "metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print("\n=== k20 high-resolution ranking ===")
          ranking = all_summary.sort_values(
              ["independent_accuracy_mean", "permutation_accuracy_mean"],
              ascending=False,
          )
          print(
              ranking[
                  [
                      "configuration",
                      "independent_accuracy_mean",
                      "global_unmasked_accuracy_mean",
                      "permutation_accuracy_mean",
                      "independent_delta_vs_julia",
                      "permutation_delta_vs_julia",
                  ]
              ].to_string(index=False)
          )
          PY

      - name: Upload high-resolution results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: katja-highres-global-s05
          path: |
            ${{ runner.temp }}/katja-highres-global-tests.txt
            ${{ runner.temp }}/katja-highres-cache-audit.txt
            ${{ runner.temp }}/katja-highres-global-s05.txt
            ${{ runner.temp }}/katja-highres-global-s05/*.csv
            ${{ runner.temp }}/katja-highres-global-s05/*.json
          if-no-files-found: warn

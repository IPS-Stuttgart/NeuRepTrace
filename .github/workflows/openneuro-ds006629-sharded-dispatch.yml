name: Dispatch ds006629 sharded OpenNeuro LOSO

run-name: Dispatch ds006629 sharded LOSO ${{ inputs.runner_type }} no_download=${{ inputs.no_download }}

on:
    workflow_dispatch:
        inputs:
            runner_type:
                description: "Runner family for the actual OpenNeuro MEG LOSO workflow"
                required: true
                type: choice
                options:
                    - self-hosted
                    - github-hosted
                default: github-hosted
            subjects:
                description: "Subject ids/ranges for ds006629. Default excludes sub-06, which has a channel-definition staging failure."
                required: true
                default: "1,2,4,5,7-12,14-21"
            runs:
                description: "Run ids for ds006629."
                required: true
                default: "0"
            max_events_per_label:
                description: "Per-run class cap during staging; 0 disables the cap"
                required: true
                default: "120"
            stage_seed:
                description: "Random seed for capped event selection during staging"
                required: true
                default: "13"
            no_download:
                description: "Use already cached/staged data only; fail instead of downloading missing raw files"
                required: true
                type: boolean
                default: false
            skip_failed_subjects:
                description: "Skip corrupt or missing subjects after download and decode the successful cohort"
                required: true
                type: boolean
                default: true
            min_successful_subjects:
                description: "Minimum staged subjects required when skip_failed_subjects is enabled"
                required: true
                default: "18"
            decoder:
                description: "Optional classifier override for the actual decode workflow"
                required: false
                default: ""
            data_root:
                description: "Optional raw BIDS root override, e.g. persistent self-hosted cache"
                required: false
                default: ""
            staged_root:
                description: "Optional staged Epochs root override, e.g. persistent self-hosted cache"
                required: false
                default: ""
            shard_groups_json:
                description: "JSON array of held-out group shards. Each item may be a comma-separated multi-group shard. Default is one shard per selected ds006629 subject, excluding sub-06."
                required: true
                default: '["sub-01","sub-02","sub-04","sub-05","sub-07","sub-08","sub-09","sub-10","sub-11","sub-12","sub-14","sub-15","sub-16","sub-17","sub-18","sub-19","sub-20","sub-21"]'
            extra_config_overrides:
                description: "Optional semicolon/newline-separated additional --set overrides for the actual workflow"
                required: false
                default: ""
            diagnostics_best_time:
                description: "Optional fixed diagnostic time in seconds"
                required: false
                default: "0.184"
            time_decode_backend:
                description: "Same-time decoder backend for non-ensemble decoders"
                required: true
                type: choice
                options:
                    - sklearn
                    - mne
                default: sklearn
            class_prior_correction:
                description: "Optional train-fold class-prior correction"
                required: true
                type: choice
                options:
                    - none
                    - train_uniform
                default: none
            label_shuffle_control:
                description: "Dispatch a matched label-shuffle null control instead of the real-label run"
                required: true
                type: boolean
                default: false
            label_shuffle_seed:
                description: "Seed for label-shuffle null controls"
                required: true
                default: "13"

permissions:
    actions: write
    contents: read

jobs:
    dispatch:
        runs-on: ubuntu-latest
        steps:
            - name: Validate shard JSON
              id: shards
              shell: bash
              env:
                  SHARD_GROUPS_JSON: ${{ inputs.shard_groups_json }}
              run: |
                  set -euo pipefail
                  python - <<'PY'
                  from __future__ import annotations

                  import json
                  import os
                  import re

                  try:
                      raw_shards = json.loads(os.environ["SHARD_GROUPS_JSON"])
                  except json.JSONDecodeError as exc:
                      raise SystemExit(f"Invalid shard_groups_json: {exc}") from exc

                  if not isinstance(raw_shards, list) or not raw_shards:
                      raise SystemExit("shard_groups_json must be a non-empty JSON array of strings")

                  group_pattern = re.compile(r"^[A-Za-z0-9_.-]+$")
                  normalized_shards = []
                  seen_shards = set()
                  for raw_shard in raw_shards:
                      if not isinstance(raw_shard, str):
                          raise SystemExit("shard_groups_json must contain strings only")
                      groups = [group.strip() for group in raw_shard.split(",") if group.strip()]
                      if not groups:
                          raise SystemExit("shard_groups_json entries must contain at least one held-out group")
                      invalid_groups = [group for group in groups if not group_pattern.fullmatch(group)]
                      if invalid_groups:
                          raise SystemExit(
                              "shard_groups_json entries may contain only letters, digits, '.', '_' and '-'; "
                              f"invalid group(s): {invalid_groups}"
                          )
                      if len(set(groups)) != len(groups):
                          raise SystemExit(f"Shard {raw_shard!r} contains duplicate held-out groups")
                      normalized_shard = ",".join(groups)
                      if normalized_shard in seen_shards:
                          raise SystemExit(f"Duplicate held-out shard {normalized_shard!r}")
                      seen_shards.add(normalized_shard)
                      normalized_shards.append(normalized_shard)

                  compact = json.dumps(normalized_shards, separators=(",", ":"))
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
                      handle.write(f"shard_groups_json={compact}\n")
                  print(f"Validated {len(normalized_shards)} ds006629 held-out shard(s): {normalized_shards}")
                  PY

            - name: Dispatch OpenNeuro MEG LOSO sharded run
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  SHARD_GROUPS_JSON: ${{ steps.shards.outputs.shard_groups_json }}
                  EXTRA_CONFIG_OVERRIDES: ${{ inputs.extra_config_overrides }}
              run: |
                  set -euo pipefail

                  overrides="workflow.outer_test_group_shards_json=${SHARD_GROUPS_JSON}"
                  if [[ -n "${EXTRA_CONFIG_OVERRIDES//[[:space:];]/}" ]]; then
                    overrides+=$'\n'
                    overrides+="$EXTRA_CONFIG_OVERRIDES"
                  fi

                  echo "Dispatching .github/workflows/openneuro-meg-loso.yml with ds006629 sharding:"
                  printf '%s\n' "$overrides"

                  gh workflow run openneuro-meg-loso.yml \
                    --repo "$GITHUB_REPOSITORY" \
                    --ref "$GITHUB_REF_NAME" \
                    -f dataset=ds006629 \
                    -f mode=full \
                    -f subjects='${{ inputs.subjects }}' \
                    -f runs='${{ inputs.runs }}' \
                    -f data_root='${{ inputs.data_root }}' \
                    -f staged_root='${{ inputs.staged_root }}' \
                    -f max_events_per_label='${{ inputs.max_events_per_label }}' \
                    -f stage_seed='${{ inputs.stage_seed }}' \
                    -f run_decode=true \
                    -f no_download='${{ inputs.no_download }}' \
                    -f skip_failed_subjects='${{ inputs.skip_failed_subjects }}' \
                    -f min_successful_subjects='${{ inputs.min_successful_subjects }}' \
                    -f decoder='${{ inputs.decoder }}' \
                    -f config_overrides="$overrides" \
                    -f diagnostics_best_time='${{ inputs.diagnostics_best_time }}' \
                    -f temporal_smoothing=false \
                    -f ensemble_weights='' \
                    -f ensemble_source_decoders='' \
                    -f ensemble_baseline_window='' \
                    -f ensemble_min_probability='1e-12' \
                    -f time_decode_backend='${{ inputs.time_decode_backend }}' \
                    -f class_prior_correction='${{ inputs.class_prior_correction }}' \
                    -f label_shuffle_control='${{ inputs.label_shuffle_control }}' \
                    -f label_shuffle_seed='${{ inputs.label_shuffle_seed }}' \
                    -f runner_type='${{ inputs.runner_type }}'

                  echo "Dispatched ds006629 sharded OpenNeuro MEG LOSO run."

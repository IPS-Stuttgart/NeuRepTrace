name: Katja button-press data discovery

on:
    workflow_dispatch:
    pull_request:
        branches:
            - main
        paths:
            - .github/workflows/katja-button-press-discovery.yml
            - workflow-triggers/katja_button_press.txt

permissions:
    contents: read

jobs:
    discover-katja-data:
        runs-on: [self-hosted, Linux]
        timeout-minutes: 30
        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install lightweight inspection dependencies
              run: python -m pip install --disable-pip-version-check numpy scipy h5py

            - name: Inspect Katja dataset and prior feature artifacts
              shell: bash
              run: |
                  set -euo pipefail
                  report="${RUNNER_TEMP}/katja-discovery.txt"
                  roots=(
                    "/mnt/lexar4tb/datasets/Katja Button Press Data"
                    "/mnt/lexar4tb/Katja_Button_Press_Data"
                  )
                  {
                    echo "runner=${RUNNER_NAME:-unknown}"
                    echo "workspace=${GITHUB_WORKSPACE:-unknown}"
                    echo "date=$(date --iso-8601=seconds)"
                    echo
                    echo "== exact dataset trees =="
                    for root in "${roots[@]}"; do
                      echo "-- $root"
                      if [ -d "$root" ]; then
                        find "$root" -maxdepth 7 -printf '%y\t%s\t%p\n' 2>/dev/null | sort -k3 | head -n 5000
                      else
                        echo "missing"
                      fi
                    done
                    echo
                    echo "== prior Katja/finger/seqID artifacts =="
                    for root in /home/github-runner/actions-runner/_work /home/github-runner/.cache /mnt/lexar4tb; do
                      [ -d "$root" ] || continue
                      find "$root" -maxdepth 10 -type f \
                        \( -iname '*katja*' -o -iname '*finger*' -o -iname '*seqid*' -o -iname '*button*press*' \) \
                        -printf '%s\t%p\n' 2>/dev/null | sort -n | tail -n 1500 || true
                    done
                  } | tee "$report"

                  python - "$report" "${roots[@]}" <<'PY'
                  from __future__ import annotations

                  import pathlib
                  import sys

                  import h5py
                  import numpy as np
                  from scipy.io import whosmat

                  report = pathlib.Path(sys.argv[1])
                  roots = [pathlib.Path(value) for value in sys.argv[2:]]
                  candidates: list[pathlib.Path] = []
                  for root in roots:
                      if root.is_dir():
                          candidates.extend(path for path in root.rglob("*") if path.is_file())
                  text = report.read_text(encoding="utf-8", errors="replace")
                  for line in text.splitlines():
                      fields = line.split("\t")
                      if len(fields) >= 2 and fields[-1].startswith("/"):
                          path = pathlib.Path(fields[-1])
                          if path.is_file() and path not in candidates:
                              candidates.append(path)

                  with report.open("a", encoding="utf-8") as handle:
                      handle.write("\n== lightweight file schemas ==\n")
                      for path in candidates[:2000]:
                          suffix = path.suffix.lower()
                          if suffix not in {".mat", ".csv", ".tsv", ".txt", ".json", ".npz", ".npy"}:
                              continue
                          try:
                              handle.write(f"\n-- {path} ({path.stat().st_size} bytes)\n")
                              if suffix in {".csv", ".tsv", ".txt", ".json"} and path.stat().st_size < 50_000_000:
                                  with path.open("r", encoding="utf-8", errors="replace") as source:
                                      for _ in range(5):
                                          line = source.readline()
                                          if not line:
                                              break
                                          handle.write(line[:4000])
                              elif suffix == ".npz":
                                  with np.load(path, allow_pickle=False) as archive:
                                      handle.write(f"npz_keys={archive.files}\n")
                                      for key in archive.files[:50]:
                                          array = archive[key]
                                          handle.write(f"  {key}: shape={array.shape}, dtype={array.dtype}\n")
                              elif suffix == ".npy":
                                  array = np.load(path, mmap_mode="r", allow_pickle=False)
                                  handle.write(f"npy_shape={array.shape}, dtype={array.dtype}\n")
                              elif suffix == ".mat":
                                  try:
                                      handle.write(f"mat_variables={whosmat(path)}\n")
                                  except Exception as scipy_error:
                                      try:
                                          with h5py.File(path, "r") as archive:
                                              handle.write(f"hdf5_keys={list(archive.keys())}\n")
                                              for key in list(archive.keys())[:50]:
                                                  item = archive[key]
                                                  handle.write(
                                                      f"  {key}: type={type(item).__name__}, "
                                                      f"shape={getattr(item, 'shape', None)}, dtype={getattr(item, 'dtype', None)}\n"
                                                  )
                                      except Exception as hdf5_error:
                                          handle.write(
                                              f"mat_inspection_error={type(scipy_error).__name__}: {scipy_error}; "
                                              f"hdf5_error={type(hdf5_error).__name__}: {hdf5_error}\n"
                                          )
                          except Exception as exc:
                              handle.write(f"inspection_error={type(exc).__name__}: {exc}\n")
                  PY

                  cat "$report"

            - name: Upload discovery report
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: katja-button-press-discovery
                  path: ${{ runner.temp }}/katja-discovery.txt
                  if-no-files-found: warn

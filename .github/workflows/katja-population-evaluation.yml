name: Katja selected population confirmation

permissions:
    contents: read

on: # yamllint disable-line rule:truthy
    workflow_dispatch:
    pull_request:
        branches:
            - main
        paths:
            - .github/workflows/katja-population-evaluation.yml
            - experiments/katja-selected-population-config.json
            - experiments/katja-correct-order.patch
            - experiments/katja-refit-full-data.patch
            - src/neureptrace/katja_spm_feature_cache.py
            - src/neureptrace/katja_finger_sequence_benchmark.py
            - src/neureptrace/_katja_finger_sequence_support.py
            - src/neureptrace/decoding/_progressive_sequence_core.py
            - src/neureptrace/decoding/_progressive_sequence_model.py
            - src/neureptrace/decoding/_progressive_sequence_network.py
            - src/neureptrace/decoding/_progressive_sequence_training.py
            - src/neureptrace/decoding/progressive_sequence_finetune.py
            - tests/test_progressive_sequence_finetune.py
            - tests/test_katja_finger_sequence_benchmark.py

concurrency:
    group: ${{ github.repository }}-katja-population-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    selection-gate:
        name: Read selected s05 configuration
        runs-on: ubuntu-latest
        outputs:
            enabled: ${{ steps.selection.outputs.enabled }}
            configuration: ${{ steps.selection.outputs.configuration }}
        steps:
            - name: Check out selection configuration
              uses: actions/checkout@v7

            - name: Validate selection configuration
              id: selection
              shell: bash
              run: |
                  python - <<'PY'
                  import json
                  import os
                  from pathlib import Path

                  path = Path("experiments/katja-selected-population-config.json")
                  config = json.loads(path.read_text(encoding="utf-8"))
                  required = {
                      "enabled",
                      "configuration",
                      "selection_scope",
                      "sinkhorn_loss_weight",
                      "assignment_loss_weight",
                      "sinkhorn_temperature",
                  }
                  missing = sorted(required.difference(config))
                  if missing:
                      raise SystemExit(f"Selection config is missing fields: {missing}")
                  if not isinstance(config["enabled"], bool):
                      raise SystemExit("enabled must be boolean")
                  for key in (
                      "sinkhorn_loss_weight",
                      "assignment_loss_weight",
                      "sinkhorn_temperature",
                  ):
                      value = float(config[key])
                      if value < 0.0 or (key == "sinkhorn_temperature" and value <= 0.0):
                          raise SystemExit(f"Invalid {key}: {value}")
                  with Path(os.environ["GITHUB_OUTPUT"]).open(
                      "a", encoding="utf-8"
                  ) as stream:
                      stream.write(f"enabled={str(config['enabled']).lower()}\n")
                      stream.write(f"configuration={config['configuration']}\n")
                  print(json.dumps(config, indent=2, sort_keys=True))
                  PY

    population-evaluation:
        name: Exact-ICA selected 16-target confirmation
        needs: selection-gate
        if: needs.selection-gate.outputs.enabled == 'true'
        runs-on: [self-hosted, Linux, X64, nvidia-smi]
        timeout-minutes: 240
        env:
            KATJA_DATASET_ROOT: /mnt/lexar4tb/datasets/Katja Button Press Data
            KATJA_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_finger_events_exact_ica_v4.npz
            KATJA_PATCH_BASELINE: ca2ca39a1a3e5d7fd0b7cee4f697c9a9e1a47aa4
            KATJA_SELECTION_CONFIG: experiments/katja-selected-population-config.json
        steps:
            - name: Check out selected experiment branch
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Restore patch baseline and apply experiment patches
              shell: bash
              run: |
                  set -euo pipefail
                  git fetch --no-tags --depth=1 origin "$KATJA_PATCH_BASELINE"
                  for path in \
                    src/neureptrace/katja_spm_feature_cache.py \
                    src/neureptrace/decoding/_progressive_sequence_model.py \
                    src/neureptrace/decoding/_progressive_sequence_training.py
                  do
                      git show "$KATJA_PATCH_BASELINE:$path" > "$path"
                  done
                  git apply --check experiments/katja-correct-order.patch
                  git apply experiments/katja-correct-order.patch
                  git apply --check experiments/katja-refit-full-data.patch
                  git apply experiments/katja-refit-full-data.patch
                  git diff --check

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install project and evaluation dependencies
              run: |
                  python -m pip install --disable-pip-version-check -e .
                  python -m pip install --disable-pip-version-check pytest numpy scipy pandas h5py

            - name: Verify workstation2 data and CUDA
              shell: bash
              run: |
                  set -euo pipefail
                  nvidia-smi
                  python - <<'PY'
                  from pathlib import Path

                  import torch

                  root = Path("/mnt/lexar4tb/datasets/Katja Button Press Data")
                  if not root.is_dir():
                      raise SystemExit(f"Katja dataset directory is missing: {root}")
                  report = {
                      "dataset_root": str(root),
                      "dataset_entry_count": sum(1 for _ in root.iterdir()),
                      "torch": torch.__version__,
                      "cuda_available": torch.cuda.is_available(),
                      "cuda_device": (
                          torch.cuda.get_device_name(0)
                          if torch.cuda.is_available()
                          else None
                      ),
                  }
                  print(report)
                  if not torch.cuda.is_available():
                      raise SystemExit("CUDA is required for the Katja population benchmark")
                  PY

            - name: Run focused leakage and split tests
              run: |
                  python -m pytest -q \
                    tests/test_progressive_sequence_finetune.py \
                    tests/test_katja_finger_sequence_benchmark.py \
                    | tee "${RUNNER_TEMP}/katja-selected-population-tests.txt"

            - name: Validate or rebuild exact ICA response-locked cache
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "$(dirname "$KATJA_CACHE")"
                  cache_valid=0
                  if [ -s "$KATJA_CACHE" ]; then
                      if python - <<'PY'
                  import json
                  import os

                  import numpy as np

                  path = os.environ["KATJA_CACHE"]
                  with np.load(path, allow_pickle=False) as archive:
                      metadata = json.loads(str(archive["metadata_json"].item()))
                      shape = list(archive["features"].shape)
                  assert metadata["format"] == "neureptrace_katja_button_press_event_features_exact_ica_v4"
                  assert metadata["correct_order_rule"] == "finite variable timing and recorded press equals cueFinger"
                  print({"cache": path, "shape": shape, "format": metadata["format"]})
                  PY
                      then
                          cache_valid=1
                      fi
                  fi
                  if [ "$cache_valid" -ne 1 ]; then
                      temporary="${KATJA_CACHE%.npz}.tmp.${GITHUB_RUN_ID}.npz"
                      rm -f "$temporary"
                      python -m neureptrace.katja_spm_feature_cache \
                        --dataset-root "$KATJA_DATASET_ROOT" \
                        --output "$temporary" \
                        --button-lag-ms 30 \
                        --force
                      mv "$temporary" "$KATJA_CACHE"
                  fi

            - name: Run selected exact-ICA target-by-seed-by-k confirmation
              shell: bash
              run: |
                  set -euo pipefail
                  output="${RUNNER_TEMP}/katja-selected-population"
                  mkdir -p "$output"
                  python - <<'PY' | tee "${RUNNER_TEMP}/katja-selected-population.txt"
                  from __future__ import annotations

                  import json
                  import os
                  import time
                  from pathlib import Path

                  from neureptrace._katja_finger_sequence_support import (
                      DEFAULT_CALIBRATION_COUNTS,
                      DEFAULT_CALIBRATION_SEEDS,
                      DEFAULT_PARTICIPANTS,
                      load_katja_feature_cache,
                  )
                  from neureptrace.katja_finger_sequence_benchmark import (
                      run_katja_finger_sequence_benchmark,
                  )

                  output = Path(os.environ["RUNNER_TEMP"]) / "katja-selected-population"
                  selection = json.loads(
                      Path(os.environ["KATJA_SELECTION_CONFIG"]).read_text(
                          encoding="utf-8"
                      )
                  )
                  if not selection["enabled"]:
                      raise SystemExit("Selected population configuration is disabled")
                  cache = load_katja_feature_cache(os.environ["KATJA_CACHE"])
                  development_target = "s05"
                  confirmatory_targets = tuple(
                      target
                      for target in DEFAULT_PARTICIPANTS
                      if target != development_target
                  )
                  model_kwargs = {
                      "hidden_units": 96,
                      "num_layers": 2,
                      "num_heads": 4,
                      "adapter_rank": 8,
                      "source_max_epochs": 120,
                      "meta_epochs": 2,
                      "meta_support_trials": 4,
                      "meta_query_trials": 4,
                      "meta_inner_steps": 5,
                      "adapter_steps": 80,
                      "last_block_steps": 60,
                      "full_finetune_steps": 60,
                      "batch_size": 64,
                      "device": "cuda",
                      "refit_source_on_all": True,
                      "refit_target_on_all": True,
                      "sinkhorn_loss_weight": float(
                          selection["sinkhorn_loss_weight"]
                      ),
                      "assignment_loss_weight": float(
                          selection["assignment_loss_weight"]
                      ),
                      "sinkhorn_temperature": float(
                          selection["sinkhorn_temperature"]
                      ),
                  }
                  started = time.time()
                  per_seed, per_target, summary, metadata = (
                      run_katja_finger_sequence_benchmark(
                          cache,
                          participants=DEFAULT_PARTICIPANTS,
                          target_participants=confirmatory_targets,
                          calibration_counts=DEFAULT_CALIBRATION_COUNTS,
                          calibration_seeds=DEFAULT_CALIBRATION_SEEDS,
                          n_source_participants=9,
                          source_selection_seed=13,
                          pca_components=64,
                          model_kwargs=model_kwargs,
                      )
                  )
                  elapsed = time.time() - started
                  metadata.update(
                      {
                          "elapsed_seconds": elapsed,
                          "development_target": development_target,
                          "confirmatory_targets": list(confirmatory_targets),
                          "selection": selection,
                          "feature_cache": os.environ["KATJA_CACHE"],
                          "feature_format": "neureptrace_katja_button_press_event_features_exact_ica_v4",
                          "patch_baseline": os.environ["KATJA_PATCH_BASELINE"],
                      }
                  )
                  per_seed.to_csv(
                      output / "katja_selected_population_per_seed.csv",
                      index=False,
                  )
                  per_target.to_csv(
                      output / "katja_selected_population_per_target.csv",
                      index=False,
                  )
                  summary.to_csv(
                      output / "katja_selected_population_summary.csv",
                      index=False,
                  )
                  (output / "katja_selected_population_metadata.json").write_text(
                      json.dumps(metadata, indent=2, sort_keys=True),
                      encoding="utf-8",
                  )
                  print(json.dumps(selection, indent=2, sort_keys=True))
                  print(f"Elapsed seconds: {elapsed:.1f}")
                  print(summary.to_string(index=False))
                  PY

            - name: Write selected confirmation to workflow summary
              if: always()
              shell: bash
              run: |
                  if ! command -v python >/dev/null 2>&1; then
                      exit 0
                  fi
                  python - <<'PY'
                  import os
                  from pathlib import Path

                  import pandas as pd

                  result = (
                      Path(os.environ["RUNNER_TEMP"])
                      / "katja-selected-population"
                      / "katja_selected_population_summary.csv"
                  )
                  if not result.exists():
                      raise SystemExit(0)
                  frame = pd.read_csv(result).copy()
                  percent_columns = [
                      "independent_accuracy_mean",
                      "independent_accuracy_sem",
                      "permutation_accuracy_mean",
                      "permutation_accuracy_sem",
                      "julia_full_finetune_accuracy",
                      "independent_delta_vs_julia",
                      "permutation_delta_vs_julia",
                  ]
                  frame[percent_columns] *= 100.0
                  with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
                      "a", encoding="utf-8"
                  ) as stream:
                      stream.write("## Katja selected exact-ICA confirmation\n\n")
                      stream.write(
                          "Five seeds and 16 targets excluding development target s05.\n\n"
                      )
                      stream.write("```text\n")
                      stream.write(frame.to_string(index=False))
                      stream.write("\n```\n")
                  PY

            - name: Upload selected exact-ICA confirmation
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: katja-selected-population-exact-ica-v4
                  path: |
                      ${{ runner.temp }}/katja-selected-population-tests.txt
                      ${{ runner.temp }}/katja-selected-population.txt
                      ${{ runner.temp }}/katja-selected-population/*.csv
                      ${{ runner.temp }}/katja-selected-population/*.json
                  if-no-files-found: warn

name: OpenNeuro MEG LOSO
run-name: OpenNeuro MEG LOSO ${{ inputs.dataset }} ${{ inputs.mode }} ${{ inputs.runner_type }} shuffle=${{ inputs.label_shuffle_control }} prior=${{ inputs.class_prior_correction }}

on:
    workflow_dispatch:
        inputs:
            dataset:
                description: "OpenNeuro dataset recipe"
                required: true
                type: choice
                options:
                    - ds000117
                    - ds006629
                    - ds004276
                    - ds004330
                default: ds006629
            mode:
                description: "Smoke uses three subjects and small caps; full uses all configured subjects/runs."
                required: true
                type: choice
                options:
                    - smoke
                    - full
                default: smoke
            subjects:
                description: "Override subject ids/ranges, or leave empty for mode default"
                required: false
                default: ""
            runs:
                description: "Override run ids, or leave empty for mode default"
                required: false
                default: ""
            data_root:
                description: "Raw BIDS dataset root, or empty for persistent self-hosted cache"
                required: false
                default: ""
            staged_root:
                description: "Per-subject staged Epochs root, or empty for persistent self-hosted cache"
                required: false
                default: ""
            max_events_per_label:
                description: "Per-run class cap during staging; 0 disables the cap"
                required: true
                default: "120"
            run_decode:
                description: "Run LOSO decoding after staging"
                required: true
                type: boolean
                default: true
            no_download:
                description: "Fail instead of downloading missing raw files"
                required: true
                type: boolean
                default: false
            skip_failed_subjects:
                description: "Skip corrupt or missing subjects after download and decode the successful cohort"
                required: true
                type: boolean
                default: true
            min_successful_subjects:
                description: "Minimum staged subjects required when skip_failed_subjects is enabled"
                required: true
                default: "2"
            decoder:
                description: "Override decoder/classifier, or leave empty for the dataset config default"
                required: false
                default: ""
            config_overrides:
                description: 'Optional semicolon/newline-separated --set overrides, e.g. preprocessing.window_size=0.075, decoding.source_calibration=temperature, decoding.outer_test_groups=[sub-01], or workflow.outer_test_group_shards_json=["sub-01","sub-02"]'
                required: false
                default: ""
            diagnostics_best_time:
                description: "Optional fixed diagnostic time in seconds, e.g. 0.184"
                required: false
                default: ""
            temporal_smoothing:
                description: "Also write sticky temporal-posterior smoothed outputs; false disables smoothing"
                required: true
                type: choice
                options:
                    - "false"
                    - forward_backward
                    - forward_only
                    - poststimulus_forward_only
                default: "false"
            temporal_smoothing_fit_window:
                description: "Temporal smoothing fit window START,STOP, or full to fit all time bins"
                required: false
                default: "0.10,0.30"
            ensemble_weights:
                description: "Optional comma-separated logistic_svm_ensemble weights in source-decoder order, e.g. 0.5,0.3,0.2"
                required: false
                default: ""
            ensemble_source_decoders:
                description: "Optional comma-separated logistic_svm_ensemble source decoders, e.g. multinomial-logistic-weighted,linear_svm,shrinkage_lda"
                required: false
                default: ""
            ensemble_baseline_window:
                description: "Optional ensemble baseline-debiasing window START,STOP, or none to disable"
                required: false
                default: ""
            ensemble_min_probability:
                description: "Minimum probability floor for logistic_svm_ensemble log-space averaging"
                required: false
                default: "1e-12"
            time_decode_backend:
                description: "Same-time decoder backend for non-ensemble decoders"
                required: true
                type: choice
                options:
                    - sklearn
                    - mne
                default: sklearn
            class_prior_correction:
                description: "Optional train-fold class-prior correction for balanced-accuracy follow-ups"
                required: true
                type: choice
                options:
                    - none
                    - train_uniform
                default: none
            label_shuffle_control:
                description: "Shuffle train-fold labels as a matched null control"
                required: true
                type: boolean
                default: false
            label_shuffle_seed:
                description: "Seed for label-shuffle null controls"
                required: true
                default: "13"
            runner_type:
                description: "Runner family. GitHub-hosted starts immediately and uses actions/cache; self-hosted uses /home/github-runner/.cache/datasets."
                required: true
                type: choice
                options:
                    - self-hosted
                    - github-hosted
                default: github-hosted

jobs:
    resolve-matrix:
        runs-on: ubuntu-latest
        outputs:
            outer_test_group_shards_json: ${{ steps.matrix.outputs.outer_test_group_shards_json }}
        steps:
            - name: Resolve shard matrix
              id: matrix
              shell: bash
              env:
                  CONFIG_OVERRIDES_INPUT: ${{ inputs.config_overrides }}
              run: |
                  set -euo pipefail
                  python - <<'PY'
                  from __future__ import annotations

                  import json
                  import os
                  from pathlib import Path

                  shards_text = '[""]'
                  for override in os.environ.get("CONFIG_OVERRIDES_INPUT", "").replace(";", "\n").splitlines():
                      override = override.strip()
                      if override.startswith("workflow.outer_test_group_shards_json="):
                          shards_text = override.split("=", 1)[1].strip()
                      elif override.startswith("workflow.outer_test_group_shards="):
                          shards_text = override.split("=", 1)[1].strip()
                  try:
                      shards = json.loads(shards_text)
                  except json.JSONDecodeError as exc:
                      shards = [
                          shard.strip().strip("\"'")
                          for shard in shards_text.strip("[]").split(",")
                          if shard.strip().strip("\"'")
                      ]
                      if not shards:
                          raise SystemExit(f"Invalid workflow.outer_test_group_shards_json: {exc}") from exc
                  if not isinstance(shards, list) or not all(isinstance(item, str) for item in shards):
                      raise SystemExit("workflow.outer_test_group_shards_json must be a JSON array of strings.")
                  if not shards:
                      shards = [""]
                  compact = json.dumps(shards, separators=(",", ":"))
                  with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
                      handle.write(f"outer_test_group_shards_json={compact}\n")
                  print(f"OpenNeuro held-out shard matrix: {compact}")
                  PY

    openneuro-meg-loso:
        needs: resolve-matrix
        runs-on: ${{ fromJSON(inputs.runner_type == 'github-hosted' && '["ubuntu-latest"]' || '["self-hosted","Linux"]') }}
        timeout-minutes: 720
        strategy:
            fail-fast: false
            matrix:
                outer_test_groups: ${{ fromJSON(needs.resolve-matrix.outputs.outer_test_group_shards_json) }}
        env:
            OPENNEURO_API_KEY: ${{ secrets.OPENNEURO_API_KEY }}
            DATASET: ${{ inputs.dataset }}
            MODE: ${{ inputs.mode }}
            RUNNER_TYPE: ${{ inputs.runner_type }}
            SUBJECTS_INPUT: ${{ inputs.subjects }}
            RUNS_INPUT: ${{ inputs.runs }}
            DATA_ROOT_INPUT: ${{ inputs.data_root }}
            STAGED_ROOT_INPUT: ${{ inputs.staged_root }}
            MAX_EVENTS_PER_LABEL_INPUT: ${{ inputs.max_events_per_label }}
            RUN_DECODE: ${{ inputs.run_decode }}
            NO_DOWNLOAD: ${{ inputs.no_download }}
            SKIP_FAILED_SUBJECTS: ${{ inputs.skip_failed_subjects }}
            MIN_SUCCESSFUL_SUBJECTS: ${{ inputs.min_successful_subjects }}
            DECODER_INPUT: ${{ inputs.decoder }}
            CONFIG_OVERRIDES_INPUT: ${{ inputs.config_overrides }}
            OUTER_TEST_GROUPS_SHARD: ${{ matrix.outer_test_groups }}
            DIAGNOSTICS_BEST_TIME_INPUT: ${{ inputs.diagnostics_best_time }}
            TEMPORAL_SMOOTHING: ${{ inputs.temporal_smoothing != 'false' }}
            TEMPORAL_SMOOTHING_FIT_WINDOW: ${{ inputs.temporal_smoothing_fit_window }}
            TEMPORAL_SMOOTHING_MODE: ${{ inputs.temporal_smoothing }}
            ENSEMBLE_WEIGHTS_INPUT: ${{ inputs.ensemble_weights }}
            ENSEMBLE_SOURCE_DECODERS_INPUT: ${{ inputs.ensemble_source_decoders }}
            ENSEMBLE_BASELINE_WINDOW_INPUT: ${{ inputs.ensemble_baseline_window }}
            ENSEMBLE_MIN_PROBABILITY_INPUT: ${{ inputs.ensemble_min_probability }}
            TIME_DECODE_BACKEND: ${{ inputs.time_decode_backend }}
            CLASS_PRIOR_CORRECTION: ${{ inputs.class_prior_correction }}
            SOURCE_CALIBRATION: none
            LABEL_SHUFFLE_CONTROL: ${{ inputs.label_shuffle_control }}
            LABEL_SHUFFLE_SEED: ${{ inputs.label_shuffle_seed }}
            OPENNEURO_ARTIFACT_SUFFIX: ${{ inputs.label_shuffle_control == true && format('-label-shuffle-seed-{0}', inputs.label_shuffle_seed) || '' }}
            OPENNEURO_OUTPUT_SUFFIX: ${{ inputs.label_shuffle_control == true && format('_label_shuffle_seed_{0}', inputs.label_shuffle_seed) || '' }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Resolve GitHub-hosted OpenNeuro cache keys
              id: openneuro_cache_keys
              if: runner.environment == 'github-hosted'
              shell: bash
              env:
                  SUBJECTS_CACHE_INPUT: ${{ inputs.subjects }}
                  RUNS_CACHE_INPUT: ${{ inputs.runs }}
                  MAX_EVENTS_PER_LABEL_CACHE_INPUT: ${{ inputs.max_events_per_label }}
                  CONFIG_OVERRIDES_CACHE_INPUT: ${{ inputs.config_overrides }}
              run: |
                  set -euo pipefail
                  python - <<'PY'
                  from __future__ import annotations

                  import hashlib
                  import os
                  import re
                  from pathlib import Path

                  def safe_cache_token(value: str | None, fallback: str) -> str:
                      token = (value or fallback).strip() or fallback
                      token = re.sub(r"[^A-Za-z0-9_.-]+", "-", token).strip("-._")
                      if not token:
                          token = fallback
                      if len(token) > 120:
                          digest = hashlib.sha256(token.encode("utf-8")).hexdigest()[:16]
                          token = f"{token[:100].rstrip('-._')}-{digest}"
                      return token

                  def override_value(config_text: str, *keys: str) -> str:
                      for override in config_text.replace(";", "\n").splitlines():
                          key, separator, value = override.strip().partition("=")
                          if separator and key.strip() in keys:
                              return value.strip()
                      return ""

                  config_overrides = os.environ.get("CONFIG_OVERRIDES_CACHE_INPUT", "")
                  stage_seed = override_value(
                      config_overrides,
                      "workflow.stage_seed",
                      "openneuro.stage_seed",
                  ) or "13"

                  outputs = {
                      "subjects": safe_cache_token(os.environ.get("SUBJECTS_CACHE_INPUT"), "default"),
                      "runs": safe_cache_token(os.environ.get("RUNS_CACHE_INPUT"), "default"),
                      "cap": safe_cache_token(os.environ.get("MAX_EVENTS_PER_LABEL_CACHE_INPUT"), "none"),
                      "stage_seed": safe_cache_token(stage_seed, "13"),
                  }
                  with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
                      for key, value in outputs.items():
                          handle.write(f"{key}={value}\n")
                  print(f"OpenNeuro cache subjects token: {outputs['subjects']}")
                  print(f"OpenNeuro cache runs token: {outputs['runs']}")
                  print(f"OpenNeuro cache cap token: {outputs['cap']}")
                  print(f"OpenNeuro cache stage seed token: {outputs['stage_seed']}")
                  PY

            - name: Cache OpenNeuro raw files on GitHub-hosted runners
              if: runner.environment == 'github-hosted'
              uses: actions/cache@v5
              with:
                  path: ~/.cache/datasets/openneuro/${{ inputs.dataset }}
                  key: openneuro-meg-raw-${{ runner.os }}-${{ inputs.dataset }}-${{ inputs.mode }}-v1
                  restore-keys: |
                      openneuro-meg-raw-${{ runner.os }}-${{ inputs.dataset }}-
                      openneuro-meg-raw-${{ runner.os }}-

            - name: Cache staged OpenNeuro epochs on GitHub-hosted runners
              if: runner.environment == 'github-hosted'
              uses: actions/cache@v5
              with:
                  path: ~/.cache/datasets/openneuro/staged-epochs/${{ inputs.dataset }}
                  key: openneuro-meg-staged-${{ runner.os }}-${{ inputs.dataset }}-${{ inputs.mode }}-subjects-${{ steps.openneuro_cache_keys.outputs.subjects }}-runs-${{ steps.openneuro_cache_keys.outputs.runs }}-cap-${{ steps.openneuro_cache_keys.outputs.cap }}-stage-seed-${{ steps.openneuro_cache_keys.outputs.stage_seed }}-v1
                  restore-keys: |
                      openneuro-meg-staged-${{ runner.os }}-${{ inputs.dataset }}-${{ inputs.mode }}-subjects-${{ steps.openneuro_cache_keys.outputs.subjects }}-runs-${{ steps.openneuro_cache_keys.outputs.runs }}-cap-${{ steps.openneuro_cache_keys.outputs.cap }}-stage-seed-${{ steps.openneuro_cache_keys.outputs.stage_seed }}-

            - name: Install NeuRepTrace and OpenNeuro client
              shell: bash
              env:
                  DECODER_INPUT: ${{ inputs.decoder }}
                  CONFIG_OVERRIDES_INPUT: ${{ inputs.config_overrides }}
              run: |
                  set -euo pipefail
                  python -m pip install --upgrade pip
                  needs_torch=$(python - <<'PY'
                  from __future__ import annotations

                  import os

                  aliases = {
                      "dann",
                      "domain-adversarial",
                      "domain-adversarial-nn",
                      "domain-adversarial-neural-network",
                  }

                  def _norm(value: str) -> str:
                      return value.strip().strip("\"'").lower().replace("_", "-")

                  needs = _norm(os.environ.get("DECODER_INPUT", "")) in aliases
                  for override in os.environ.get("CONFIG_OVERRIDES_INPUT", "").replace(";", "\n").splitlines():
                      if "=" not in override:
                          continue
                      key, value = override.split("=", 1)
                      if _norm(key) in {"decoding.classifier", "decoding.decoder"} and _norm(value) in aliases:
                          needs = True
                  print("true" if needs else "false")
                  PY
                  )
                  if [[ "$needs_torch" == "true" ]]; then
                    python -m pip install -e ".[torch]" openneuro-py
                  else
                    python -m pip install -e . openneuro-py
                  fi

            - name: Resolve run parameters
              shell: bash
              env:
                  RUNNER_ENVIRONMENT: ${{ runner.environment }}
              run: |
                  set -euo pipefail
                  python - <<'PY'
                  from __future__ import annotations

                  import json
                  import os
                  from pathlib import Path

                  from neureptrace.openneuro_meg import DATASET_SPECS, parse_runs, parse_subjects

                  dataset = os.environ["DATASET"]
                  mode = os.environ["MODE"]
                  spec = DATASET_SPECS[dataset]
                  config_names = {
                      "ds000117": "ds000117_face_recognition.yml",
                      "ds004276": "ds004276_words.yml",
                      "ds006629": "ds006629_singsing.yml",
                      "ds004330": "ds004330_object_drawing.yml",
                  }
                  smoke_defaults = {
                      "ds000117": ("1,2,3", "01,02"),
                      "ds004276": ("1-3", "all"),
                      "ds006629": ("1,2,4", "0"),
                      "ds004330": ("1,2,4", "01,02,03"),
                  }
                  subjects = os.environ.get("SUBJECTS_INPUT") or (smoke_defaults[dataset][0] if mode == "smoke" else "all")
                  runs = os.environ.get("RUNS_INPUT") or (smoke_defaults[dataset][1] if mode == "smoke" else "all")
                  outer_test_groups_shard = os.environ.get("OUTER_TEST_GROUPS_SHARD", "").strip()
                  override_lines = [
                      override.strip()
                      for override in os.environ.get("CONFIG_OVERRIDES_INPUT", "").replace(";", "\n").splitlines()
                      if override.strip() and not override.strip().startswith("workflow.outer_test_group_shards_json=")
                  ]
                  def override_value(*keys: str) -> str:
                      for override in override_lines:
                          key, separator, value = override.partition("=")
                          if separator and key.strip() in keys:
                              return value.strip()
                      return ""
                  if outer_test_groups_shard:
                      override_lines.append(f"decoding.outer_test_groups=[{outer_test_groups_shard}]")
                  config_overrides_input = "\n".join(override_lines)
                  outer_test_groups = ""
                  for override in config_overrides_input.replace(";", "\n").splitlines():
                      override = override.strip()
                      if override.startswith("decoding.outer_test_groups=") or override.startswith("decoding.outer_test_group="):
                          outer_test_groups = override.split("=", 1)[1].strip()
                  parsed_runs = parse_runs(spec, runs)
                  subject_count = len(parse_subjects(spec, subjects))
                  max_events = int(os.environ["MAX_EVENTS_PER_LABEL_INPUT"])
                  stage_seed = override_value("workflow.stage_seed", "openneuro.stage_seed") or "13"
                  response_window_ensemble = (
                      override_value(
                          "workflow.response_window_ensemble",
                          "response_window.ensemble",
                          "response_window.enabled",
                      )
                      or "false"
                  ).lower()
                  response_window_mode = override_value("workflow.response_window_mode", "response_window.mode") or "uniform"
                  response_window_combine = (
                      override_value("workflow.response_window_combine", "response_window.combine")
                      or "log_probability_mean"
                  )
                  response_window_times = (
                      override_value("workflow.response_window_times", "response_window.times")
                      or "0.088,0.136,0.184,0.232,0.280"
                  )
                  if max_events <= 0:
                      max_events_arg = ""
                  else:
                      max_events_arg = f"--max-events-per-label {max_events}"
                  runner_environment = os.environ.get("RUNNER_ENVIRONMENT", "")
                  no_download = os.environ.get("NO_DOWNLOAD", "").lower() == "true"
                  dataset_cache_root = (
                      Path("/home/github-runner/.cache/datasets")
                      if runner_environment == "self-hosted"
                      else Path.home() / ".cache" / "datasets"
                  )
                  openneuro_cache_root = dataset_cache_root / "openneuro"
                  data_root = Path(os.environ.get("DATA_ROOT_INPUT") or openneuro_cache_root / dataset)
                  staged_root = Path(os.environ.get("STAGED_ROOT_INPUT") or openneuro_cache_root / "staged-epochs")
                  shard_output_suffix = f"_shard_{outer_test_groups_shard}" if outer_test_groups_shard else ""
                  shard_artifact_suffix = f"-shard-{outer_test_groups_shard}" if outer_test_groups_shard else ""
                  output_suffix = f"{os.environ.get('OPENNEURO_OUTPUT_SUFFIX', '')}{shard_output_suffix}"
                  output_dir = Path("outputs") / f"openneuro_{dataset}_{mode}{output_suffix}"
                  config_path = f"configs/openneuro/{config_names[dataset]}"
                  artifact_name = f"openneuro-meg-{dataset}-{mode}{os.environ.get('OPENNEURO_ARTIFACT_SUFFIX', '')}{shard_artifact_suffix}"
                  env_path = Path(os.environ["GITHUB_ENV"])
                  with env_path.open("a", encoding="utf-8") as handle:
                      handle.write(f"OPENNEURO_SUBJECTS={subjects}\n")
                      handle.write(f"OPENNEURO_REQUESTED_SUBJECTS={subjects}\n")
                      handle.write(f"OPENNEURO_RUNS={runs}\n")
                      handle.write(f"OPENNEURO_N_SPLITS={subject_count}\n")
                      handle.write(f"OPENNEURO_DATA_ROOT={data_root}\n")
                      handle.write(f"NEUREPTRACE_OPENNEURO_STAGED_DIR={staged_root}\n")
                      handle.write(f"OPENNEURO_OUTPUT_DIR={output_dir}\n")
                      handle.write(f"OPENNEURO_MAX_EVENTS_ARG={max_events_arg}\n")
                      handle.write(f"OPENNEURO_CONFIG={config_path}\n")
                      handle.write(f"RUNNER_ENVIRONMENT={runner_environment}\n")
                      handle.write(f"OPENNEURO_OUTPUT_SUFFIX={output_suffix}\n")
                      handle.write(f"OPENNEURO_ARTIFACT_NAME={artifact_name}\n")
                      handle.write(f"STAGE_SEED_INPUT={stage_seed}\n")
                      handle.write(f"RESPONSE_WINDOW_ENSEMBLE={response_window_ensemble}\n")
                      handle.write(f"RESPONSE_WINDOW_MODE={response_window_mode}\n")
                      handle.write(f"RESPONSE_WINDOW_COMBINE={response_window_combine}\n")
                      handle.write(f"RESPONSE_WINDOW_TIMES={response_window_times}\n")
                  output_dir.mkdir(parents=True, exist_ok=True)
                  manifest = {
                      "dataset": dataset,
                      "mode": mode,
                      "subjects": subjects,
                      "runs": runs,
                      "n_subjects": subject_count,
                      "n_runs": len(parsed_runs),
                      "config": config_path,
                      "runner_type_input": os.environ.get("RUNNER_TYPE", ""),
                      "runner_environment": runner_environment or "unknown",
                      "data_root": data_root.as_posix(),
                      "staged_root": staged_root.as_posix(),
                      "stage_overwrite": runner_environment == "self-hosted" and not no_download,
                      "output_dir": output_dir.as_posix(),
                      "artifact_name": artifact_name,
                      "max_events_per_label": max_events,
                      "stage_seed": stage_seed,
                      "run_decode": os.environ.get("RUN_DECODE", ""),
                      "no_download": os.environ.get("NO_DOWNLOAD", ""),
                      "skip_failed_subjects": os.environ.get("SKIP_FAILED_SUBJECTS", ""),
                      "min_successful_subjects": os.environ.get("MIN_SUCCESSFUL_SUBJECTS", ""),
                      "decoder_override": os.environ.get("DECODER_INPUT", ""),
                      "config_overrides": config_overrides_input,
                      "outer_test_groups_shard": outer_test_groups_shard,
                      "outer_test_groups": outer_test_groups,
                      "diagnostics_best_time": os.environ.get("DIAGNOSTICS_BEST_TIME_INPUT", ""),
                      "temporal_smoothing": os.environ.get("TEMPORAL_SMOOTHING", ""),
                      "temporal_smoothing_fit_window": os.environ.get("TEMPORAL_SMOOTHING_FIT_WINDOW", ""),
                      "temporal_smoothing_mode": os.environ.get("TEMPORAL_SMOOTHING_MODE", ""),
                      "temporal_smoothing_stay_grid_size": "200",
                      "response_window_ensemble": response_window_ensemble,
                      "response_window_mode": response_window_mode,
                      "response_window_combine": response_window_combine,
                      "response_window_times": response_window_times,
                      "ensemble_weights": os.environ.get("ENSEMBLE_WEIGHTS_INPUT", ""),
                      "ensemble_source_decoders": os.environ.get("ENSEMBLE_SOURCE_DECODERS_INPUT", ""),
                      "ensemble_source_temperatures": override_value(
                          "decoding.ensemble_source_temperatures",
                          "decoding.ensemble_source_temperature",
                      ),
                      "ensemble_baseline_window": os.environ.get("ENSEMBLE_BASELINE_WINDOW_INPUT", ""),
                      "ensemble_min_probability": os.environ.get("ENSEMBLE_MIN_PROBABILITY_INPUT", ""),
                      "time_decode_backend": os.environ.get("TIME_DECODE_BACKEND", ""),
                      "class_prior_correction": os.environ.get("CLASS_PRIOR_CORRECTION", ""),
                      "source_calibration": override_value("decoding.source_calibration") or os.environ.get(
                          "SOURCE_CALIBRATION",
                          "",
                      ),
                      "label_shuffle_control": os.environ.get("LABEL_SHUFFLE_CONTROL", ""),
                      "label_shuffle_seed": os.environ.get("LABEL_SHUFFLE_SEED", ""),
                      "github_run_id": os.environ.get("GITHUB_RUN_ID", ""),
                      "github_run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT", ""),
                      "github_ref": os.environ.get("GITHUB_REF", ""),
                      "github_sha": os.environ.get("GITHUB_SHA", ""),
                  }
                  (output_dir / "run_manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding="utf-8")
                  print(f"Dataset: {dataset}")
                  print(f"Subjects: {subjects} ({subject_count})")
                  print(f"Runs: {runs} ({len(parsed_runs)})")
                  print(f"Config: {config_path}")
                  print(f"Raw BIDS root: {data_root}")
                  print(f"Staged Epochs root: {staged_root}")
                  print(f"Runner environment: {runner_environment or 'unknown'}")
                  print(f"Dataset cache root: {dataset_cache_root}")
                  print(f"Output dir: {output_dir}")
                  print(f"Artifact name: {artifact_name}")
                  if outer_test_groups_shard:
                      print(f"Matrix held-out shard: {outer_test_groups_shard}")
                  PY

            - name: Check selected staged epochs
              id: staged_check
              shell: bash
              run: |
                  set -euo pipefail
                  python - <<'PY'
                  from __future__ import annotations

                  import os
                  from pathlib import Path

                  from neureptrace.openneuro_meg import DATASET_SPECS, parse_subjects, subject_label

                  dataset = os.environ["DATASET"]
                  runner_environment = os.environ.get("RUNNER_ENVIRONMENT", "")
                  no_download = os.environ.get("NO_DOWNLOAD", "").lower() == "true"
                  staged_root = Path(os.environ["NEUREPTRACE_OPENNEURO_STAGED_DIR"])
                  spec = DATASET_SPECS[dataset]
                  expected = [
                      staged_root / dataset / f"{subject_label(spec, subject)}_{dataset}_{spec.name}_epo.fif"
                      for subject in parse_subjects(spec, os.environ["OPENNEURO_SUBJECTS"])
                  ]
                  missing = [path for path in expected if not path.is_file() or path.stat().st_size <= 0]
                  ready = not missing and (runner_environment == "github-hosted" or no_download)
                  output_path = Path(os.environ["GITHUB_OUTPUT"])
                  with output_path.open("a", encoding="utf-8") as handle:
                      handle.write(f"ready={str(ready).lower()}\n")
                      handle.write(f"missing_count={len(missing)}\n")
                  if ready:
                      print(f"Found all {len(expected)} staged Epochs files; raw-file check/download can be skipped.")
                  else:
                      print(f"Staged Epochs cache is incomplete or not reusable; missing {len(missing)} of {len(expected)} file(s).")
                      for path in missing[:20]:
                          print(path)
                  PY

            - name: Check selected raw files
              id: raw_check
              if: steps.staged_check.outputs.ready != 'true'
              shell: bash
              run: |
                  set +e
                  python -m neureptrace.openneuro_meg check-raw \
                    --dataset "$DATASET" \
                    --bids-root "$OPENNEURO_DATA_ROOT" \
                    --subjects "$OPENNEURO_SUBJECTS" \
                    --runs "$OPENNEURO_RUNS" \
                    --validate-readable \
                    --delete-invalid
                  status="$?"
                  if [[ "$status" -eq 0 ]]; then
                    echo "ready=true" >> "$GITHUB_OUTPUT"
                  else
                    echo "ready=false" >> "$GITHUB_OUTPUT"
                  fi
                  exit 0

            - name: Download selected OpenNeuro files
              if: steps.staged_check.outputs.ready != 'true' && steps.raw_check.outputs.ready != 'true' && env.NO_DOWNLOAD != 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "$OPENNEURO_DATA_ROOT"
                  mkdir -p "$(dirname "$OPENNEURO_OUTPUT_DIR")"
                  if [[ -n "${OPENNEURO_API_KEY:-}" ]]; then
                    printf '%s\n' "$OPENNEURO_API_KEY" | openneuro-py login || true
                  fi
                  python -m neureptrace.openneuro_meg download-selected \
                    --dataset "$DATASET" \
                    --bids-root "$OPENNEURO_DATA_ROOT" \
                    --subjects "$OPENNEURO_SUBJECTS" \
                    --runs "$OPENNEURO_RUNS" \
                    --include-manifest "$OPENNEURO_OUTPUT_DIR.includes.txt" \
                    --batch-size 24 \
                    --max-attempts 3 \
                    --max-concurrent-downloads 2 \
                    --metadata-timeout 30

            - name: Re-check selected raw files
              if: steps.staged_check.outputs.ready != 'true'
              shell: bash
              run: |
                  set +e
                  python -m neureptrace.openneuro_meg check-raw \
                    --dataset "$DATASET" \
                    --bids-root "$OPENNEURO_DATA_ROOT" \
                    --subjects "$OPENNEURO_SUBJECTS" \
                    --runs "$OPENNEURO_RUNS" \
                    --validate-readable
                  status="$?"
                  if [[ "$status" -eq 0 ]]; then
                    exit 0
                  fi
                  if [[ "$SKIP_FAILED_SUBJECTS" == "true" ]]; then
                    echo "Some selected raw files are still missing or unreadable; resilient staging will skip failed subjects."
                    exit 0
                  fi
                  exit "$status"

            - name: Stage OpenNeuro MEG epochs
              if: steps.staged_check.outputs.ready != 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "$OPENNEURO_OUTPUT_DIR"
                  stage_module="neureptrace.openneuro_meg"
                  extra_stage_args=()
                  if [[ "$SKIP_FAILED_SUBJECTS" == "true" ]]; then
                    stage_module="neureptrace.openneuro_resilient"
                    extra_stage_args+=(
                      --skip-failed-subjects
                      --min-successful-subjects "$MIN_SUCCESSFUL_SUBJECTS"
                      --failure-summary-out "$OPENNEURO_OUTPUT_DIR/stage_failures.csv"
                      --successful-subjects-out "$OPENNEURO_OUTPUT_DIR/successful_subjects.txt"
                      --github-env "$GITHUB_ENV"
                    )
                  fi
                  max_events_args=()
                  if [[ -n "$OPENNEURO_MAX_EVENTS_ARG" ]]; then
                    read -r -a max_events_args <<< "$OPENNEURO_MAX_EVENTS_ARG"
                  fi
                  stage_args=(
                    stage
                    --dataset "$DATASET"
                    --bids-root "$OPENNEURO_DATA_ROOT"
                    --staged-dir "$NEUREPTRACE_OPENNEURO_STAGED_DIR"
                    --subjects "$OPENNEURO_SUBJECTS"
                    --runs "$OPENNEURO_RUNS"
                    --summary-out "$OPENNEURO_OUTPUT_DIR/stage_summary.csv"
                    --seed "$STAGE_SEED_INPUT"
                  )
                  stage_args+=("${max_events_args[@]}")
                  stage_args+=(--on-mismatch warn)
                  if [[ "$RUNNER_ENVIRONMENT" == "self-hosted" && "$NO_DOWNLOAD" != "true" ]]; then
                    stage_args+=(--overwrite)
                  fi
                  python -m "$stage_module" "${stage_args[@]}" "${extra_stage_args[@]}"

            - name: Run NeuRepTrace LOSO decode
              if: env.RUN_DECODE == 'true'
              shell: bash
              run: |
                  set -euo pipefail
                  args=(
                    "$OPENNEURO_CONFIG"
                    --set "participants.ids=$OPENNEURO_SUBJECTS"
                    --set "decoding.n_splits=$OPENNEURO_N_SPLITS"
                    --set "decoding.time_decode_backend=$TIME_DECODE_BACKEND"
                    --set "decoding.class_prior_correction=$CLASS_PRIOR_CORRECTION"
                    --set "decoding.source_calibration=$SOURCE_CALIBRATION"
                    --set "decoding.label_shuffle_control=$LABEL_SHUFFLE_CONTROL"
                    --set "decoding.label_shuffle_seed=$LABEL_SHUFFLE_SEED"
                    --set "outputs.base_dir=$OPENNEURO_OUTPUT_DIR/decode"
                  )
                  if [[ -n "$DECODER_INPUT" ]]; then
                    args+=(--set "decoding.classifier=$DECODER_INPUT")
                  fi
                  if [[ -n "$CONFIG_OVERRIDES_INPUT" ]]; then
                    while IFS= read -r override; do
                      override="${override#"${override%%[![:space:]]*}"}"
                      override="${override%"${override##*[![:space:]]}"}"
                      [[ -z "$override" || "$override" == \#* ]] && continue
                      [[ "$override" == workflow.* ]] && continue
                      args+=(--set "$override")
                    done < <(printf '%s\n' "$CONFIG_OVERRIDES_INPUT" | tr ';' '\n')
                  fi
                  if [[ "$RESPONSE_WINDOW_ENSEMBLE" == "true" && "$RESPONSE_WINDOW_MODE" == "strict_source_oof_nonnegative" ]]; then
                    args+=(--set "decoding.source_time_selection=source_oof_time_weighted_logits")
                    args+=(--set "decoding.source_time_selection_times=[$RESPONSE_WINDOW_TIMES]")
                    args+=(--set "decoding.source_time_selection_output_time=${DIAGNOSTICS_BEST_TIME_INPUT:-0.184}")
                  fi
                  if [[ "$RESPONSE_WINDOW_ENSEMBLE" == "true" && "$RESPONSE_WINDOW_MODE" == "strict_source_oof_classwise_nonnegative" ]]; then
                    args+=(--set "decoding.source_time_selection=source_oof_classwise_time_weighted_logits")
                    args+=(--set "decoding.source_time_selection_times=[$RESPONSE_WINDOW_TIMES]")
                    args+=(--set "decoding.source_time_selection_output_time=${DIAGNOSTICS_BEST_TIME_INPUT:-0.184}")
                  fi
                  if [[ "$RESPONSE_WINDOW_ENSEMBLE" == "true" && "$RESPONSE_WINDOW_MODE" == "strict_source_oof_logit_stacker" ]]; then
                    args+=(--set "decoding.source_time_selection=source_oof_logit_stacker")
                    args+=(--set "decoding.source_time_selection_times=[$RESPONSE_WINDOW_TIMES]")
                    args+=(--set "decoding.source_time_selection_output_time=${DIAGNOSTICS_BEST_TIME_INPUT:-0.184}")
                  fi
                  if [[ -n "$OUTER_TEST_GROUPS_SHARD" ]]; then
                    args+=(--set "decoding.outer_test_groups=[$OUTER_TEST_GROUPS_SHARD]")
                  fi
                  if [[ -n "$ENSEMBLE_WEIGHTS_INPUT" ]]; then
                    args+=(--set "decoding.ensemble_weights=[$ENSEMBLE_WEIGHTS_INPUT]")
                  fi
                  if [[ -n "$ENSEMBLE_SOURCE_DECODERS_INPUT" ]]; then
                    args+=(--set "decoding.ensemble_source_decoders=[$ENSEMBLE_SOURCE_DECODERS_INPUT]")
                  fi
                  if [[ -n "$ENSEMBLE_BASELINE_WINDOW_INPUT" ]]; then
                    case "${ENSEMBLE_BASELINE_WINDOW_INPUT,,}" in
                      none|null|off|false)
                        args+=(--set "decoding.ensemble_baseline_window=null")
                        ;;
                      *)
                        args+=(--set "decoding.ensemble_baseline_window=[$ENSEMBLE_BASELINE_WINDOW_INPUT]")
                        ;;
                    esac
                  fi
                  if [[ -n "$ENSEMBLE_MIN_PROBABILITY_INPUT" ]]; then
                    args+=(--set "decoding.ensemble_min_probability=$ENSEMBLE_MIN_PROBABILITY_INPUT")
                  fi
                  python -m neureptrace.decode_from_config "${args[@]}" &
                  decode_pid="$!"
                  (
                    while kill -0 "$decode_pid" 2>/dev/null; do
                      echo "NeuRepTrace LOSO decode still running at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                      sleep 120
                    done
                  ) &
                  keepalive_pid="$!"
                  status=0
                  wait "$decode_pid" || status="$?"
                  kill "$keepalive_pid" 2>/dev/null || true
                  wait "$keepalive_pid" 2>/dev/null || true
                  exit "$status"

            - name: Run temporal posterior smoothing
              if: ${{ always() && env.RUN_DECODE == 'true' && env.TEMPORAL_SMOOTHING == 'true' }}
              shell: bash
              run: |
                  set -euo pipefail
                  observations="$OPENNEURO_OUTPUT_DIR/decode/observations.csv"
                  if [[ ! -s "$observations" ]]; then
                    echo "Skipping temporal smoothing because observations are missing: $observations"
                    exit 0
                  fi
                  mkdir -p "$OPENNEURO_OUTPUT_DIR/decode/temporal_smoothing"
                  smoothing_args=(
                    "$observations"
                    --out-observations "$OPENNEURO_OUTPUT_DIR/decode/temporal_smoothing/observations.csv"
                    --out-metrics "$OPENNEURO_OUTPUT_DIR/decode/temporal_smoothing/time_decode_summary.csv"
                    --stay-grid-size 200
                    --mode "$TEMPORAL_SMOOTHING_MODE"
                  )
                  case "${TEMPORAL_SMOOTHING_FIT_WINDOW,,}" in
                    "")
                      smoothing_args+=(--fit-window 0.10 0.30)
                      ;;
                    full|all|none|null)
                      smoothing_args+=(--use-full-sequence-fit)
                      ;;
                    *)
                      IFS=',' read -r fit_start fit_stop <<< "$TEMPORAL_SMOOTHING_FIT_WINDOW"
                      smoothing_args+=(--fit-window "$fit_start" "$fit_stop")
                      ;;
                  esac
                  python -m neureptrace.temporal_smoothing "${smoothing_args[@]}"

            - name: Summarize LOSO decode
              if: ${{ always() && env.RUN_DECODE == 'true' }}
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ -z "${OPENNEURO_OUTPUT_DIR:-}" ]]; then
                    echo "Skipping LOSO summary because run parameters were not resolved."
                    exit 0
                  fi
                  python - <<'PY'
                  from pathlib import Path
                  import os
                  import pandas as pd

                  summary = Path(os.environ["OPENNEURO_OUTPUT_DIR"]) / "decode" / "time_decode_summary.csv"
                  if not summary.is_file() or summary.stat().st_size == 0:
                      print(f"No LOSO summary found at {summary}; skipping compact summary.")
                      raise SystemExit(0)
                  frame = pd.read_csv(summary)
                  metric_columns = [
                      column
                      for column in ["accuracy", "balanced_accuracy", "top2_accuracy", "top3_accuracy", "log_loss", "brier", "ece"]
                      if column in frame.columns
                  ]
                  if frame.empty or "time" not in frame.columns or not metric_columns:
                      print(f"LOSO summary at {summary} has no summarizable metric rows.")
                      raise SystemExit(0)
                  metrics = frame.groupby("time")[metric_columns].mean(numeric_only=True)
                  best_time = metrics["balanced_accuracy"].idxmax() if "balanced_accuracy" in metrics.columns else metrics.index[0]
                  print(metrics.loc[[best_time]].to_string())
                  PY

            - name: Write LOSO diagnostics
              if: ${{ always() && env.RUN_DECODE == 'true' }}
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ -z "${OPENNEURO_OUTPUT_DIR:-}" ]]; then
                    echo "Skipping LOSO diagnostics because run parameters were not resolved."
                    exit 0
                  fi
                  observations="$OPENNEURO_OUTPUT_DIR/decode/observations.csv"
                  summary="$OPENNEURO_OUTPUT_DIR/decode/time_decode_summary.csv"
                  if [[ ! -s "$observations" || ! -s "$summary" ]]; then
                    echo "Skipping LOSO diagnostics because observations or summary output is missing."
                    exit 0
                  fi
                  diagnostic_args=(
                    "$observations"
                    --summary-csv "$summary"
                    --stage-summary-csv "$OPENNEURO_OUTPUT_DIR/stage_summary.csv"
                    --out-dir "$OPENNEURO_OUTPUT_DIR/decode/diagnostics"
                  )
                  if [[ -n "$DIAGNOSTICS_BEST_TIME_INPUT" ]]; then
                    diagnostic_args+=(--best-time "$DIAGNOSTICS_BEST_TIME_INPUT")
                  fi
                  python -m neureptrace.loso_observation_diagnostics "${diagnostic_args[@]}"

                  if [[ "$TEMPORAL_SMOOTHING" == "true" && -s "$OPENNEURO_OUTPUT_DIR/decode/temporal_smoothing/observations.csv" ]]; then
                    smoothed_args=(
                      "$OPENNEURO_OUTPUT_DIR/decode/temporal_smoothing/observations.csv"
                      --summary-csv "$OPENNEURO_OUTPUT_DIR/decode/temporal_smoothing/time_decode_summary.csv"
                      --stage-summary-csv "$OPENNEURO_OUTPUT_DIR/stage_summary.csv"
                      --out-dir "$OPENNEURO_OUTPUT_DIR/decode/temporal_smoothing/diagnostics"
                      --selection-metric balanced_accuracy
                    )
                    if [[ -n "$DIAGNOSTICS_BEST_TIME_INPUT" ]]; then
                      smoothed_args+=(--best-time "$DIAGNOSTICS_BEST_TIME_INPUT")
                    fi
                    python -m neureptrace.loso_observation_diagnostics "${smoothed_args[@]}"
                  fi

                  if [[ "$RESPONSE_WINDOW_ENSEMBLE" == "true" && -s "$OPENNEURO_OUTPUT_DIR/decode/response_window/observations.csv" ]]; then
                    response_window_args=(
                      "$OPENNEURO_OUTPUT_DIR/decode/response_window/observations.csv"
                      --summary-csv "$OPENNEURO_OUTPUT_DIR/decode/response_window/time_decode_summary.csv"
                      --stage-summary-csv "$OPENNEURO_OUTPUT_DIR/stage_summary.csv"
                      --out-dir "$OPENNEURO_OUTPUT_DIR/decode/response_window/diagnostics"
                      --selection-metric balanced_accuracy
                    )
                    if [[ -n "$DIAGNOSTICS_BEST_TIME_INPUT" ]]; then
                      response_window_args+=(--best-time "$DIAGNOSTICS_BEST_TIME_INPUT")
                    fi
                    python -m neureptrace.loso_observation_diagnostics "${response_window_args[@]}"
                  fi

            - name: Write OpenNeuro workflow summary
              if: ${{ always() }}
              shell: bash
              run: |
                  set -euo pipefail
                  if [[ -z "${OPENNEURO_OUTPUT_DIR:-}" ]]; then
                    echo "Skipping OpenNeuro workflow summary because run parameters were not resolved."
                    exit 0
                  fi
                  python -m neureptrace.openneuro_decode_diagnostics \
                    "$OPENNEURO_OUTPUT_DIR" \
                    --diagnostics-out "$OPENNEURO_OUTPUT_DIR/decode_diagnostics.json" \
                    --best-out "$OPENNEURO_OUTPUT_DIR/decode_best_metrics.csv" \
                    --quality-out "$OPENNEURO_OUTPUT_DIR/workflow_quality_summary.csv"

            - name: Upload OpenNeuro MEG outputs
              if: ${{ always() }}
              uses: actions/upload-artifact@v7
              with:
                  name: openneuro-meg-${{ inputs.dataset }}-${{ inputs.mode }}${{ env.OPENNEURO_ARTIFACT_SUFFIX }}${{ matrix.outer_test_groups != '' && format('-shard-{0}', matrix.outer_test_groups) || '' }}
                  path: outputs/openneuro_${{ inputs.dataset }}_${{ inputs.mode }}*/**
                  if-no-files-found: warn

    aggregate-openneuro-shards:
        needs:
            - resolve-matrix
            - openneuro-meg-loso
        if: ${{ always() && needs.openneuro-meg-loso.result != 'cancelled' && inputs.run_decode == true }}
        runs-on: ubuntu-latest
        env:
            DATASET: ${{ inputs.dataset }}
            MODE: ${{ inputs.mode }}
            OPENNEURO_SHARD_MATRIX_RESULT: ${{ needs.openneuro-meg-loso.result }}
            OUTER_TEST_GROUP_SHARDS_JSON: ${{ needs.resolve-matrix.outputs.outer_test_group_shards_json }}
            DIAGNOSTICS_BEST_TIME_INPUT: ${{ inputs.diagnostics_best_time }}
            OPENNEURO_ARTIFACT_SUFFIX: ${{ inputs.label_shuffle_control == true && format('-label-shuffle-seed-{0}', inputs.label_shuffle_seed) || '' }}
            OPENNEURO_OUTPUT_SUFFIX: ${{ inputs.label_shuffle_control == true && format('_label_shuffle_seed_{0}', inputs.label_shuffle_seed) || '' }}
            OPENNEURO_AGGREGATE_OUTPUT_DIR: outputs/openneuro_${{ inputs.dataset }}_${{ inputs.mode }}${{ inputs.label_shuffle_control == true && format('_label_shuffle_seed_{0}', inputs.label_shuffle_seed) || '' }}_shard_aggregate
            CONFIG_OVERRIDES_INPUT: ${{ inputs.config_overrides }}

        steps:
            - name: Check out repository
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Install NeuRepTrace
              shell: bash
              run: |
                  set -euo pipefail
                  python -m pip install --upgrade pip
                  python -m pip install -e .

            - name: Download OpenNeuro shard artifacts
              uses: actions/download-artifact@v8
              with:
                  pattern: openneuro-meg-${{ inputs.dataset }}-${{ inputs.mode }}${{ env.OPENNEURO_ARTIFACT_SUFFIX }}*
                  path: downloaded_openneuro_artifacts
                  merge-multiple: false

            - name: Aggregate OpenNeuro shard diagnostics
              shell: bash
              run: |
                  set -euo pipefail
                  mapfile -t output_dirs < <(python - <<'PY'
                  from __future__ import annotations

                  import json
                  import os
                  from pathlib import Path

                  root = Path("downloaded_openneuro_artifacts")
                  expected = json.loads(os.environ.get("OUTER_TEST_GROUP_SHARDS_JSON") or '[""]')
                  expected_shards = {str(shard).strip() for shard in expected if str(shard).strip()}
                  output_dirs = sorted({path.parent for path in root.rglob("run_manifest.json")})
                  selected: list[Path] = []
                  for output_dir in output_dirs:
                      try:
                          artifact_name = output_dir.relative_to(root).parts[0]
                      except (IndexError, ValueError):
                          continue
                      if artifact_name.endswith("-shard-aggregate"):
                          continue
                      if expected_shards:
                          if not any(artifact_name.endswith(f"-shard-{shard}") for shard in expected_shards):
                              continue
                      elif "-shard-" in artifact_name:
                          continue
                      selected.append(output_dir)
                  for output_dir in selected:
                      print(output_dir.as_posix())
                  PY
                  )
                  if [[ "${#output_dirs[@]}" -eq 0 ]]; then
                    echo "No shard run_manifest.json files were downloaded; cannot aggregate OpenNeuro diagnostics."
                    exit 1
                  fi
                  mkdir -p "$OPENNEURO_AGGREGATE_OUTPUT_DIR"
                  printf '%s\n' "${output_dirs[@]}" > "$OPENNEURO_AGGREGATE_OUTPUT_DIR/source_output_dirs.txt"
                  printf 'Aggregating OpenNeuro output directories:\n'
                  printf '  %s\n' "${output_dirs[@]}"
                  aggregate_args=("${output_dirs[@]}" --aggregate-out "$OPENNEURO_AGGREGATE_OUTPUT_DIR")
                  if [[ -n "$DIAGNOSTICS_BEST_TIME_INPUT" ]]; then
                    aggregate_args+=(--best-time "$DIAGNOSTICS_BEST_TIME_INPUT")
                  fi
                  python -m neureptrace.openneuro_decode_diagnostics "${aggregate_args[@]}"
                  python - <<'PY'
                  from __future__ import annotations

                  import json
                  import os
                  from pathlib import Path

                  out_dir = Path(os.environ["OPENNEURO_AGGREGATE_OUTPUT_DIR"])
                  expected = json.loads(os.environ.get("OUTER_TEST_GROUP_SHARDS_JSON") or '[""]')
                  source_dirs = [
                      line
                      for line in (out_dir / "source_output_dirs.txt").read_text(encoding="utf-8").splitlines()
                      if line.strip()
                  ]
                  status = {
                      "matrix_result": os.environ.get("OPENNEURO_SHARD_MATRIX_RESULT", ""),
                      "expected_shards": expected,
                      "expected_shard_count": len(expected),
                      "downloaded_output_count": len(source_dirs),
                      "complete": len(source_dirs) == len(expected) and os.environ.get("OPENNEURO_SHARD_MATRIX_RESULT") == "success",
                      "source_output_dirs": source_dirs,
                  }
                  (out_dir / "shard_aggregation_status.json").write_text(
                      json.dumps(status, indent=2, sort_keys=True),
                      encoding="utf-8",
                  )
                  PY
                  python - <<'PY'
                  from __future__ import annotations

                  import os
                  from pathlib import Path

                  import pandas as pd

                  out_dir = Path(os.environ["OPENNEURO_AGGREGATE_OUTPUT_DIR"])
                  source_dirs = [
                      Path(line)
                      for line in (out_dir / "source_output_dirs.txt").read_text(encoding="utf-8").splitlines()
                      if line.strip()
                  ]
                  source_observation_paths = [
                      source_dir / "decode" / "ensemble_source_observations.csv"
                      for source_dir in source_dirs
                      if (source_dir / "decode" / "ensemble_source_observations.csv").is_file()
                  ]
                  if not source_observation_paths:
                      print("No ensemble source-observation sidecars found in shard artifacts.")
                      raise SystemExit(0)
                  output = out_dir / "decode" / "ensemble_source_observations.csv"
                  output.parent.mkdir(parents=True, exist_ok=True)
                  pd.concat((pd.read_csv(path) for path in source_observation_paths), ignore_index=True).to_csv(output, index=False)
                  print(f"Wrote aggregate ensemble source observations: {output}")
                  PY

            - name: Run aggregate response-window logit ensemble
              shell: bash
              run: |
                  set -euo pipefail
                  response_window_enabled="false"
                  response_window_mode="uniform"
                  response_window_combine="log_probability_mean"
                  response_window_times="0.088,0.136,0.184,0.232,0.280"
                  if [[ -n "$CONFIG_OVERRIDES_INPUT" ]]; then
                    while IFS= read -r override; do
                      override="${override#"${override%%[![:space:]]*}"}"
                      override="${override%"${override##*[![:space:]]}"}"
                      case "$override" in
                        workflow.response_window_ensemble=*|response_window.ensemble=*|response_window.enabled=*)
                          response_window_enabled="${override#*=}"
                          ;;
                        workflow.response_window_mode=*|response_window.mode=*)
                          response_window_mode="${override#*=}"
                          ;;
                        workflow.response_window_combine=*|response_window.combine=*)
                          response_window_combine="${override#*=}"
                          ;;
                        workflow.response_window_times=*|response_window.times=*)
                          response_window_times="${override#*=}"
                          ;;
                      esac
                    done < <(printf '%s\n' "$CONFIG_OVERRIDES_INPUT" | tr ';' '\n')
                  fi
                  if [[ "$response_window_enabled" != "true" ]]; then
                    echo "Skipping aggregate response-window ensemble because it was not requested."
                    exit 0
                  fi
                  if [[ "$response_window_mode" == "strict_source_oof_nonnegative" || "$response_window_mode" == "strict_source_oof_classwise_nonnegative" || "$response_window_mode" == "strict_source_oof_logit_stacker" ]]; then
                    echo "Skipping aggregate response-window ensemble because $response_window_mode is produced inside each outer decode fold."
                    exit 0
                  fi
                  if [[ "$response_window_mode" == "response_window_poststimulus_forward" ]]; then
                    echo "Running response-window C after poststimulus_forward_only temporal smoothing."
                  fi
                  observations="$OPENNEURO_AGGREGATE_OUTPUT_DIR/decode/observations.csv"
                  if [[ "$response_window_mode" == "decoder_source_oof_nonnegative" ]]; then
                    observations="$OPENNEURO_AGGREGATE_OUTPUT_DIR/decode/ensemble_source_observations.csv"
                  fi
                  if [[ ! -s "$observations" ]]; then
                    echo "Skipping aggregate response-window ensemble because observations are missing: $observations"
                    exit 0
                  fi
                  mkdir -p "$OPENNEURO_AGGREGATE_OUTPUT_DIR/decode/response_window"
                  python -m neureptrace.response_window_ensemble \
                    "$observations" \
                    --mode "$response_window_mode" \
                    --combine "$response_window_combine" \
                    --response-times "$response_window_times" \
                    --output-time "${DIAGNOSTICS_BEST_TIME_INPUT:-0.184}" \
                    --out-observations "$OPENNEURO_AGGREGATE_OUTPUT_DIR/decode/response_window/observations.csv" \
                    --out-metrics "$OPENNEURO_AGGREGATE_OUTPUT_DIR/decode/response_window/time_decode_summary.csv"

                  response_window_args=(
                    "$OPENNEURO_AGGREGATE_OUTPUT_DIR/decode/response_window/observations.csv"
                    --summary-csv "$OPENNEURO_AGGREGATE_OUTPUT_DIR/decode/response_window/time_decode_summary.csv"
                    --out-dir "$OPENNEURO_AGGREGATE_OUTPUT_DIR/decode/response_window/diagnostics"
                    --selection-metric balanced_accuracy
                  )
                  if [[ -s "$OPENNEURO_AGGREGATE_OUTPUT_DIR/stage_summary.csv" ]]; then
                    response_window_args+=(--stage-summary-csv "$OPENNEURO_AGGREGATE_OUTPUT_DIR/stage_summary.csv")
                  fi
                  if [[ -n "$DIAGNOSTICS_BEST_TIME_INPUT" ]]; then
                    response_window_args+=(--best-time "$DIAGNOSTICS_BEST_TIME_INPUT")
                  fi
                  python -m neureptrace.loso_observation_diagnostics "${response_window_args[@]}"
                  python -m neureptrace.openneuro_decode_diagnostics \
                    "$OPENNEURO_AGGREGATE_OUTPUT_DIR" \
                    --diagnostics-out "$OPENNEURO_AGGREGATE_OUTPUT_DIR/decode_diagnostics.json" \
                    --best-out "$OPENNEURO_AGGREGATE_OUTPUT_DIR/decode_best_metrics.csv" \
                    --quality-out "$OPENNEURO_AGGREGATE_OUTPUT_DIR/workflow_quality_summary.csv"

            - name: Upload aggregate OpenNeuro MEG output
              uses: actions/upload-artifact@v7
              with:
                  name: openneuro-meg-${{ inputs.dataset }}-${{ inputs.mode }}${{ env.OPENNEURO_ARTIFACT_SUFFIX }}-shard-aggregate
                  path: ${{ env.OPENNEURO_AGGREGATE_OUTPUT_DIR }}/**
                  if-no-files-found: error

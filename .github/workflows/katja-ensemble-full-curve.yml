name: Katja ensemble population full curve

permissions:
    contents: read

on: # yamllint disable-line rule:truthy
    workflow_dispatch:
    pull_request:
        branches:
            - main
        paths:
            - .github/workflows/katja-ensemble-full-curve.yml
            - experiments/katja-ensemble-full-curve-config.json
            - experiments/katja_ensemble_population.py
            - experiments/katja_ensemble_source_sweep.py

concurrency:
    group: katja-ensemble-full-curve-${{ github.ref }}
    cancel-in-progress: true

env:
    KATJA_DATASET_ROOT: /mnt/lexar4tb/datasets/Katja Button Press Data
    KATJA_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_finger_events_exact_ica_v4.npz
    KATJA_PATCH_BASELINE: ca2ca39a1a3e5d7fd0b7cee4f697c9a9e1a47aa4
    KATJA_FULL_CURVE_CONFIG: experiments/katja-ensemble-full-curve-config.json
    OMP_NUM_THREADS: "2"
    MKL_NUM_THREADS: "2"

jobs:
    evaluate:
        name: Dual-GPU six-k ensemble follow-up
        if: >-
            github.event_name == 'workflow_dispatch' ||
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: [self-hosted, Linux, X64, nvidia-smi]
        timeout-minutes: 240
        steps:
            - name: Check out experiment branch
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Validate locked full-curve scope
              shell: bash
              run: |
                  set -euo pipefail
                  config="$KATJA_FULL_CURVE_CONFIG"
                  grep -Eq '"enabled"[[:space:]]*:[[:space:]]*true' "$config"
                  grep -Eq '"development_target_excluded"[[:space:]]*:[[:space:]]*"s05"' "$config"
                  grep -Eq '"primary_configuration"[[:space:]]*:[[:space:]]*"hybrid_source_model_ensemble6"' "$config"
                  grep -Fq 'full_curve_follow_up_after_k20_ensemble_result' "$config"
                  python - <<'PY'
                  import json
                  import os

                  with open(os.environ["KATJA_FULL_CURVE_CONFIG"], encoding="utf-8") as stream:
                      config = json.load(stream)
                  assert config["calibration_counts"] == [1, 3, 5, 10, 15, 20]
                  assert config["calibration_seeds"] == [13, 29, 47, 71, 101]
                  assert len(config["targets"]) == 16
                  assert "s05" not in config["targets"]
                  assert len(config["reported_configurations"]) == 6
                  print(json.dumps(config, indent=2, sort_keys=True))
                  PY

            - name: Restore patch baseline and apply experiment patches
              shell: bash
              run: |
                  set -euo pipefail
                  git fetch --no-tags --depth=1 origin "$KATJA_PATCH_BASELINE"
                  for path in \
                    src/neureptrace/katja_spm_feature_cache.py \
                    src/neureptrace/decoding/_progressive_sequence_model.py \
                    src/neureptrace/decoding/_progressive_sequence_training.py
                  do
                      git show "$KATJA_PATCH_BASELINE:$path" > "$path"
                  done
                  git apply --check experiments/katja-correct-order.patch
                  git apply experiments/katja-correct-order.patch
                  git apply --check experiments/katja-refit-full-data.patch
                  git apply experiments/katja-refit-full-data.patch
                  git diff --check

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install project and evaluation dependencies
              run: |
                  python -m pip install --disable-pip-version-check -e .
                  python -m pip install --disable-pip-version-check \
                    pytest numpy scipy pandas h5py

            - name: Verify dual GPUs, scripts, and focused tests
              shell: bash
              run: |
                  set -euo pipefail
                  nvidia-smi
                  python -m py_compile \
                    experiments/katja_ensemble_source_sweep.py \
                    experiments/katja_ensemble_population.py
                  python - <<'PY'
                  from pathlib import Path

                  import torch

                  root = Path("/mnt/lexar4tb/datasets/Katja Button Press Data")
                  report = {
                      "dataset_exists": root.is_dir(),
                      "dataset_root": str(root),
                      "torch": torch.__version__,
                      "cuda_available": torch.cuda.is_available(),
                      "cuda_device_count": torch.cuda.device_count(),
                      "cuda_devices": [
                          torch.cuda.get_device_name(index)
                          for index in range(torch.cuda.device_count())
                      ],
                  }
                  print(report)
                  if not root.is_dir():
                      raise SystemExit(f"Katja dataset directory is missing: {root}")
                  if not torch.cuda.is_available() or torch.cuda.device_count() < 2:
                      raise SystemExit("Two CUDA devices are required for this follow-up")
                  PY
                  python -m pytest -q \
                    tests/test_progressive_sequence_finetune.py \
                    tests/test_katja_finger_sequence_benchmark.py \
                    | tee "${RUNNER_TEMP}/katja-ensemble-full-curve-tests.txt"

            - name: Validate or rebuild exact ICA response-locked cache
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "$(dirname "$KATJA_CACHE")"
                  cache_valid=0
                  if [ -s "$KATJA_CACHE" ]; then
                      if python - <<'PY'
                  import json
                  import os

                  import numpy as np

                  path = os.environ["KATJA_CACHE"]
                  with np.load(path, allow_pickle=False) as archive:
                      metadata = json.loads(str(archive["metadata_json"].item()))
                      shape = list(archive["features"].shape)
                  assert metadata["format"] == (
                      "neureptrace_katja_button_press_event_features_exact_ica_v4"
                  )
                  assert metadata["correct_order_rule"] == (
                      "finite variable timing and recorded press equals cueFinger"
                  )
                  assert shape == [15792, 1092]
                  print({"cache": path, "shape": shape, "format": metadata["format"]})
                  PY
                      then
                          cache_valid=1
                      fi
                  fi
                  if [ "$cache_valid" -ne 1 ]; then
                      temporary="${KATJA_CACHE%.npz}.tmp.${GITHUB_RUN_ID}.npz"
                      rm -f "$temporary"
                      python -m neureptrace.katja_spm_feature_cache \
                        --dataset-root "$KATJA_DATASET_ROOT" \
                        --output "$temporary" \
                        --button-lag-ms 30 \
                        --force
                      mv "$temporary" "$KATJA_CACHE"
                  fi

            - name: Run all six k values with eight concurrent workers
              shell: bash
              run: |
                  set -euo pipefail
                  output="${RUNNER_TEMP}/katja-ensemble-full-curve"
                  mkdir -p "$output/parts"
                  targets=(
                      s06 s08 s09 s10 s11 s13 s14 s15
                      s16 s17 s18 s20 s21 s24 s25 s28
                  )
                  failure=0
                  for batch_start in 0 8; do
                      pids=()
                      logs=()
                      batch_targets=()
                      for offset in 0 1 2 3 4 5 6 7; do
                          index=$((batch_start + offset))
                          target="${targets[$index]}"
                          gpu=$((offset % 2))
                          part="$output/parts/$target"
                          log="${RUNNER_TEMP}/katja-ensemble-full-curve-${target}.txt"
                          mkdir -p "$part"
                          CUDA_VISIBLE_DEVICES="$gpu" python -u \
                            experiments/katja_ensemble_population.py \
                            --feature-cache "$KATJA_CACHE" \
                            --targets "$target" \
                            --calibration-counts "1,3,5,10,15,20" \
                            --calibration-seeds "13,29,47,71,101" \
                            --output-dir "$part" \
                            > "$log" 2>&1 &
                          pids+=("$!")
                          logs+=("$log")
                          batch_targets+=("$target")
                      done
                      for index in "${!pids[@]}"; do
                          status=0
                          wait "${pids[$index]}" || status=$?
                          cat "${logs[$index]}"
                          if [ "$status" -ne 0 ]; then
                              echo "Worker ${batch_targets[$index]} failed with $status" >&2
                              failure=1
                          fi
                      done
                      if [ "$failure" -ne 0 ]; then
                          exit 1
                      fi
                  done

            - name: Combine, validate, and analyze the population curves
              shell: bash
              run: |
                  set -euo pipefail
                  python - <<'PY' | tee "${RUNNER_TEMP}/katja-ensemble-full-curve-summary.txt"
                  from __future__ import annotations

                  import json
                  import os
                  import sys
                  from pathlib import Path

                  import numpy as np
                  import pandas as pd
                  from scipy import stats

                  experiments = Path("experiments").resolve()
                  sys.path.insert(0, str(experiments))
                  from katja_ensemble_population import (  # noqa: E402
                      PRIMARY_CONFIGURATION,
                      _summarize_population,
                  )

                  output = Path(os.environ["RUNNER_TEMP"]) / "katja-ensemble-full-curve"
                  targets = [
                      "s06", "s08", "s09", "s10", "s11", "s13", "s14", "s15",
                      "s16", "s17", "s18", "s20", "s21", "s24", "s25", "s28",
                  ]
                  parts = [output / "parts" / target for target in targets]
                  per_seed = pd.concat(
                      [
                          pd.read_csv(part / "katja_ensemble_population_per_seed.csv")
                          for part in parts
                      ],
                      ignore_index=True,
                  ).sort_values(["configuration", "target", "k", "seed"])
                  expected_k = {1, 3, 5, 10, 15, 20}
                  expected_seeds = {13, 29, 47, 71, 101}
                  if set(per_seed["target"].unique()) != set(targets):
                      raise RuntimeError("Unexpected target registry in the combined curve")
                  if set(per_seed["k"].unique()) != expected_k:
                      raise RuntimeError("Unexpected calibration-count registry")
                  if set(per_seed["seed"].unique()) != expected_seeds:
                      raise RuntimeError("Unexpected calibration-seed registry")
                  expected_rows = 16 * 6 * 5 * 6
                  if per_seed.shape[0] != expected_rows:
                      raise RuntimeError(
                          f"Expected {expected_rows} per-seed rows, got {per_seed.shape[0]}"
                      )

                  per_target, summary = _summarize_population(per_seed)
                  primary_curve = summary[
                      summary["configuration"] == PRIMARY_CONFIGURATION
                  ].sort_values("k")
                  reproduced_k20 = float(
                      primary_curve.loc[
                          primary_curve["k"] == 20,
                          "independent_accuracy_mean",
                      ].iloc[0]
                  )
                  if not np.isclose(reproduced_k20, 0.657863, atol=5e-5):
                      raise RuntimeError(
                          "Full-curve k20 result does not reproduce the locked follow-up: "
                          f"{reproduced_k20:.8f}"
                      )

                  control_name = "nine_single_protocol"
                  paired_rows = []
                  for calibration_count in sorted(expected_k):
                      primary = (
                          per_target[
                              (per_target["configuration"] == PRIMARY_CONFIGURATION)
                              & (per_target["k"] == calibration_count)
                          ]
                          .set_index("target")["independent_accuracy"]
                          .sort_index()
                      )
                      control = (
                          per_target[
                              (per_target["configuration"] == control_name)
                              & (per_target["k"] == calibration_count)
                          ]
                          .set_index("target")["independent_accuracy"]
                          .sort_index()
                      )
                      if not primary.index.equals(control.index):
                          raise RuntimeError("Primary and control target registries differ")
                      difference = primary - control
                      test = stats.ttest_rel(primary.to_numpy(), control.to_numpy())
                      paired_rows.append(
                          {
                              "k": calibration_count,
                              "n_targets": int(difference.shape[0]),
                              "mean_primary_minus_control": float(difference.mean()),
                              "wins": int((difference > 0).sum()),
                              "ties": int((difference == 0).sum()),
                              "losses": int((difference < 0).sum()),
                              "paired_t_statistic": float(test.statistic),
                              "paired_t_pvalue": float(test.pvalue),
                          }
                      )
                  paired = pd.DataFrame(paired_rows)

                  per_seed.to_csv(
                      output / "katja_ensemble_full_curve_per_seed.csv",
                      index=False,
                  )
                  per_target.to_csv(
                      output / "katja_ensemble_full_curve_per_target.csv",
                      index=False,
                  )
                  summary.to_csv(
                      output / "katja_ensemble_full_curve_summary.csv",
                      index=False,
                  )
                  primary_curve.to_csv(
                      output / "katja_ensemble_primary_curve.csv",
                      index=False,
                  )
                  paired.to_csv(
                      output / "katja_ensemble_primary_vs_control.csv",
                      index=False,
                  )
                  part_metadata = [
                      json.loads(
                          (part / "katja_ensemble_population_metadata.json").read_text(
                              encoding="utf-8"
                          )
                      )
                      for part in parts
                  ]
                  metadata = {
                      "analysis_status": "full_curve_follow_up_after_k20_ensemble_result",
                      "development_run_id": 31007742231,
                      "development_artifact_id": 8931215635,
                      "k20_population_run_id": 31009907653,
                      "k20_population_artifact_id": 8932702885,
                      "primary_configuration": PRIMARY_CONFIGURATION,
                      "targets": targets,
                      "calibration_counts": sorted(expected_k),
                      "calibration_seeds": sorted(expected_seeds),
                      "k20_reproduction": reproduced_k20,
                      "parts": part_metadata,
                      "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
                  }
                  (output / "katja_ensemble_full_curve_metadata.json").write_text(
                      json.dumps(metadata, indent=2, sort_keys=True),
                      encoding="utf-8",
                  )
                  print("\nPrimary hybrid curve:\n")
                  print(primary_curve.to_string(index=False))
                  print("\nPrimary versus exact single-model control:\n")
                  print(paired.to_string(index=False))
                  PY

            - name: Write full curve to workflow summary
              if: always()
              shell: bash
              run: |
                  if ! command -v python >/dev/null 2>&1; then
                      exit 0
                  fi
                  python - <<'PY'
                  import os
                  from pathlib import Path

                  import pandas as pd

                  output = Path(os.environ["RUNNER_TEMP"]) / "katja-ensemble-full-curve"
                  result = output / "katja_ensemble_primary_curve.csv"
                  paired_path = output / "katja_ensemble_primary_vs_control.csv"
                  if not result.exists():
                      raise SystemExit(0)
                  curve = pd.read_csv(result)
                  paired = pd.read_csv(paired_path)
                  percent_columns = [
                      "independent_accuracy_mean",
                      "independent_accuracy_sem",
                      "permutation_accuracy_mean",
                      "permutation_accuracy_sem",
                      "julia_full_finetune_accuracy",
                      "independent_delta_vs_julia",
                      "permutation_delta_vs_julia",
                  ]
                  curve[percent_columns] *= 100.0
                  paired["mean_primary_minus_control"] *= 100.0
                  with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
                      "a", encoding="utf-8"
                  ) as stream:
                      stream.write("## Katja hybrid ensemble full calibration curve\n\n")
                      stream.write(
                          "This is a full-curve follow-up on the same 16 participants used "
                          "for the locked k20 ensemble evaluation, not a new untouched cohort.\n\n"
                      )
                      stream.write("```text\n")
                      stream.write(
                          curve[
                              [
                                  "k",
                                  "independent_accuracy_mean",
                                  "independent_accuracy_sem",
                                  "julia_full_finetune_accuracy",
                                  "independent_delta_vs_julia",
                                  "permutation_accuracy_mean",
                                  "permutation_accuracy_sem",
                              ]
                          ].to_string(index=False)
                      )
                      stream.write("\n```\n\n")
                      stream.write("### Primary versus exact single-model control\n\n")
                      stream.write("```text\n")
                      stream.write(paired.to_string(index=False))
                      stream.write("\n```\n")
                  PY

            - name: Upload ensemble full-curve follow-up
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: katja-ensemble-population-full-curve-exact-ica-v4
                  path: |
                      ${{ runner.temp }}/katja-ensemble-full-curve-tests.txt
                      ${{ runner.temp }}/katja-ensemble-full-curve-s*.txt
                      ${{ runner.temp }}/katja-ensemble-full-curve-summary.txt
                      ${{ runner.temp }}/katja-ensemble-full-curve/*.csv
                      ${{ runner.temp }}/katja-ensemble-full-curve/*.json
                      ${{ runner.temp }}/katja-ensemble-full-curve/parts/*/*.csv
                      ${{ runner.temp }}/katja-ensemble-full-curve/parts/*/*.json
                  if-no-files-found: warn

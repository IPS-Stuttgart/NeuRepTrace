---
name: Fix source-roll domain tuples

"on":
  pull_request:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  patch:
    if: github.head_ref == 'fix/source-roll-feature-label-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/source-roll-feature-label-validation
      - name: Preserve composite domain identities
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/neureptrace/decoding/source_roll.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _domain_vector(values: Sequence[Hashable] | np.ndarray | None, *, expected_length: int) -> np.ndarray:
              if values is None:
                  return np.full(expected_length, "source", dtype=object)
              vector = np.asarray(_materialize_one_pass_iterables(values), dtype=object).reshape(-1)
              if vector.shape[0] != expected_length:
                  raise ValueError(f"source_domains must contain one value per feature row: {vector.shape[0]} != {expected_length}.")
              for value in vector.tolist():
                  try:
                      hash(value)
                  except TypeError as exc:
                      raise ValueError(f"source_domains must be hashable; got {value!r}.") from exc
              return vector
          '''.replace("          ", "")
          new = '''def _domain_vector(values: Sequence[Hashable] | np.ndarray | None, *, expected_length: int) -> np.ndarray:
              if values is None:
                  return np.full(expected_length, "source", dtype=object)
              if isinstance(values, np.ndarray):
                  raw_values = values.tolist()
              elif isinstance(values, (str, bytes)) or not isinstance(values, Iterable):
                  raw_values = [values]
              else:
                  raw_values = list(values)
              vector = _object_vector(_freeze_label(value) for value in raw_values)
              if vector.shape[0] != expected_length:
                  raise ValueError(f"source_domains must contain one value per feature row: {vector.shape[0]} != {expected_length}.")
              for value in vector.tolist():
                  try:
                      hash(value)
                  except TypeError as exc:
                      raise ValueError(f"source_domains must be hashable; got {value!r}.") from exc
              return vector
          '''.replace("          ", "")
          if text.count(old) != 1:
              raise SystemExit(f"expected one domain-vector block, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          Path(".github/workflows/fix-source-roll-domain-tuples.yml").unlink()
          PY
      - name: Commit focused repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/neureptrace/decoding/source_roll.py .github/workflows/fix-source-roll-domain-tuples.yml
          git commit -m "Preserve composite source-domain identities"
          git push origin HEAD:fix/source-roll-feature-label-validation

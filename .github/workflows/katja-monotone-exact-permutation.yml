name: Katja monotone exact permutation evaluation

permissions:
    contents: read

on: # yamllint disable-line rule:truthy
    workflow_dispatch:
    pull_request:
        branches:
            - main
        paths:
            - .github/workflows/katja-monotone-exact-permutation.yml
            - experiments/katja-monotone-exact-config.json
            - src/neureptrace/decoding/exact_permutation.py
            - src/neureptrace/decoding/monotone_exact_sequence.py
            - tests/test_monotone_exact_sequence.py

concurrency:
    group: ${{ github.repository }}-katja-monotone-exact-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    gate:
        name: Validate registered experiment
        runs-on: ubuntu-latest
        outputs:
            enabled: ${{ steps.config.outputs.enabled }}
        steps:
            - name: Check out experiment branch
              uses: actions/checkout@v7

            - name: Validate configuration
              id: config
              shell: bash
              run: |
                  python - <<'PY'
                  import json
                  import os
                  from pathlib import Path

                  path = Path("experiments/katja-monotone-exact-config.json")
                  config = json.loads(path.read_text(encoding="utf-8"))
                  required = {
                      "enabled",
                      "development_target",
                      "calibration_counts",
                      "calibration_seeds",
                      "reference_independent_k20",
                      "minimum_promotion_gain",
                      "configurations",
                  }
                  missing = sorted(required.difference(config))
                  if missing:
                      raise SystemExit(f"Missing configuration fields: {missing}")
                  if not isinstance(config["enabled"], bool):
                      raise SystemExit("enabled must be boolean")
                  configurations = config["configurations"]
                  if set(configurations) != {"monotone_sinkhorn", "monotone_exact"}:
                      raise SystemExit(
                          "Expected monotone_sinkhorn and monotone_exact configurations"
                      )
                  required_model_fields = {
                      "sinkhorn_loss_weight",
                      "assignment_loss_weight",
                      "sinkhorn_temperature",
                      "exact_permutation_loss_weight",
                      "exact_permutation_temperature",
                  }
                  for name, values in configurations.items():
                      missing_model = sorted(required_model_fields.difference(values))
                      if missing_model:
                          raise SystemExit(
                              f"Configuration {name} is missing fields: {missing_model}"
                          )
                      if float(values["sinkhorn_temperature"]) <= 0.0:
                          raise SystemExit(f"Invalid Sinkhorn temperature for {name}")
                      if float(values["exact_permutation_temperature"]) <= 0.0:
                          raise SystemExit(
                              f"Invalid exact permutation temperature for {name}"
                          )
                  with Path(os.environ["GITHUB_OUTPUT"]).open(
                      "a", encoding="utf-8"
                  ) as stream:
                      stream.write(f"enabled={str(config['enabled']).lower()}\n")
                  print(json.dumps(config, indent=2, sort_keys=True))
                  PY

    development:
        name: Five-seed s05 development selection
        needs: gate
        if: needs.gate.outputs.enabled == 'true'
        runs-on: [self-hosted, Linux, X64, nvidia-smi]
        timeout-minutes: 240
        outputs:
            winner: ${{ steps.select.outputs.winner }}
            winner_accuracy: ${{ steps.select.outputs.winner_accuracy }}
            promote: ${{ steps.select.outputs.promote }}
        env:
            KATJA_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_finger_events_exact_ica_v4.npz
            KATJA_CONFIG: experiments/katja-monotone-exact-config.json
        steps:
            - name: Check out experiment branch
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install project and test dependencies
              run: |
                  python -m pip install --disable-pip-version-check -e .
                  python -m pip install --disable-pip-version-check pytest numpy scipy pandas h5py

            - name: Verify CUDA, cache, and focused tests
              shell: bash
              run: |
                  set -euo pipefail
                  test -s "$KATJA_CACHE"
                  nvidia-smi
                  python - <<'PY'
                  import json
                  import os

                  import numpy as np
                  import torch

                  if not torch.cuda.is_available():
                      raise SystemExit("CUDA is required")
                  with np.load(os.environ["KATJA_CACHE"], allow_pickle=False) as archive:
                      metadata = json.loads(str(archive["metadata_json"].item()))
                      shape = list(archive["features"].shape)
                  expected = "neureptrace_katja_button_press_event_features_exact_ica_v4"
                  if metadata.get("format") != expected:
                      raise SystemExit(
                          f"Unexpected cache format: {metadata.get('format')!r}"
                      )
                  print(
                      {
                          "torch": torch.__version__,
                          "device": torch.cuda.get_device_name(0),
                          "cache_shape": shape,
                          "cache_format": metadata["format"],
                      }
                  )
                  PY
                  python -m pytest -q \
                    tests/test_monotone_exact_sequence.py \
                    tests/test_progressive_sequence_finetune.py \
                    tests/test_katja_finger_sequence_benchmark.py \
                    | tee "${RUNNER_TEMP}/katja-monotone-exact-tests.txt"

            - name: Compare monotone Sinkhorn and exact permutation objectives
              id: select
              shell: bash
              run: |
                  set -euo pipefail
                  output="${RUNNER_TEMP}/katja-monotone-exact-development"
                  mkdir -p "$output"
                  python - <<'PY' | tee "${RUNNER_TEMP}/katja-monotone-exact-development.txt"
                  from __future__ import annotations

                  import json
                  import os
                  import time
                  from pathlib import Path

                  import pandas as pd

                  import neureptrace.katja_finger_sequence_benchmark as benchmark
                  from neureptrace._katja_finger_sequence_support import (
                      DEFAULT_PARTICIPANTS,
                      load_katja_feature_cache,
                  )
                  from neureptrace.decoding.monotone_exact_sequence import (
                      TorchMonotoneExactSequenceClassifier,
                  )

                  config = json.loads(
                      Path(os.environ["KATJA_CONFIG"]).read_text(encoding="utf-8")
                  )
                  output = (
                      Path(os.environ["RUNNER_TEMP"])
                      / "katja-monotone-exact-development"
                  )
                  cache = load_katja_feature_cache(os.environ["KATJA_CACHE"])
                  benchmark.TorchProgressiveSequenceClassifier = (
                      TorchMonotoneExactSequenceClassifier
                  )
                  base_kwargs = {
                      "hidden_units": 96,
                      "num_layers": 2,
                      "num_heads": 4,
                      "adapter_rank": 8,
                      "source_max_epochs": 120,
                      "meta_epochs": 2,
                      "meta_support_trials": 4,
                      "meta_query_trials": 4,
                      "meta_inner_steps": 5,
                      "adapter_steps": 80,
                      "last_block_steps": 60,
                      "full_finetune_steps": 60,
                      "batch_size": 64,
                      "device": "cuda",
                      "refit_source_on_all": True,
                      "refit_target_on_all": True,
                  }
                  seed_frames = []
                  target_frames = []
                  summary_frames = []
                  metadata = {}
                  for name, objective in config["configurations"].items():
                      started = time.time()
                      model_kwargs = {**base_kwargs, **objective}
                      per_seed, per_target, summary, run_metadata = (
                          benchmark.run_katja_finger_sequence_benchmark(
                              cache,
                              participants=DEFAULT_PARTICIPANTS,
                              target_participants=(config["development_target"],),
                              calibration_counts=tuple(config["calibration_counts"]),
                              calibration_seeds=tuple(config["calibration_seeds"]),
                              n_source_participants=9,
                              source_selection_seed=13,
                              pca_components=64,
                              model_kwargs=model_kwargs,
                          )
                      )
                      elapsed = time.time() - started
                      for frame in (per_seed, per_target, summary):
                          frame.insert(0, "configuration", name)
                          frame.insert(1, "elapsed_seconds", elapsed)
                      seed_frames.append(per_seed)
                      target_frames.append(per_target)
                      summary_frames.append(summary)
                      metadata[name] = {
                          "elapsed_seconds": elapsed,
                          "model_kwargs": model_kwargs,
                          "benchmark_metadata": run_metadata,
                      }
                      print(f"\n=== {name} ({elapsed:.1f} s) ===")
                      print(summary.to_string(index=False))

                  all_seed = pd.concat(seed_frames, ignore_index=True)
                  all_target = pd.concat(target_frames, ignore_index=True)
                  all_summary = pd.concat(summary_frames, ignore_index=True)
                  all_seed.to_csv(output / "per_seed.csv", index=False)
                  all_target.to_csv(output / "per_target.csv", index=False)
                  all_summary.to_csv(output / "summary.csv", index=False)
                  (output / "metadata.json").write_text(
                      json.dumps(
                          {
                              "registered_config": config,
                              "runs": metadata,
                          },
                          indent=2,
                          sort_keys=True,
                      ),
                      encoding="utf-8",
                  )
                  ranking = all_summary[all_summary["k"] == 20].sort_values(
                      ["independent_accuracy_mean", "permutation_accuracy_mean"],
                      ascending=False,
                  )
                  winner = str(ranking.iloc[0]["configuration"])
                  winner_accuracy = float(
                      ranking.iloc[0]["independent_accuracy_mean"]
                  )
                  threshold = float(config["reference_independent_k20"]) + float(
                      config["minimum_promotion_gain"]
                  )
                  promote = winner_accuracy > threshold
                  with Path(os.environ["GITHUB_OUTPUT"]).open(
                      "a", encoding="utf-8"
                  ) as stream:
                      stream.write(f"winner={winner}\n")
                      stream.write(f"winner_accuracy={winner_accuracy:.12f}\n")
                      stream.write(f"promote={str(promote).lower()}\n")
                  print("\n=== registered selection ===")
                  print(
                      {
                          "winner": winner,
                          "winner_accuracy": winner_accuracy,
                          "promotion_threshold": threshold,
                          "promote": promote,
                      }
                  )
                  print(ranking.to_string(index=False))
                  PY

            - name: Upload development comparison
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: katja-monotone-exact-development
                  path: |
                      ${{ runner.temp }}/katja-monotone-exact-tests.txt
                      ${{ runner.temp }}/katja-monotone-exact-development.txt
                      ${{ runner.temp }}/katja-monotone-exact-development/*.csv
                      ${{ runner.temp }}/katja-monotone-exact-development/*.json
                  if-no-files-found: warn

    confirmation:
        name: Five-seed 16-target confirmation
        needs:
            - gate
            - development
        if: needs.development.outputs.promote == 'true'
        runs-on: [self-hosted, Linux, X64, nvidia-smi]
        timeout-minutes: 360
        env:
            KATJA_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_finger_events_exact_ica_v4.npz
            KATJA_CONFIG: experiments/katja-monotone-exact-config.json
            WINNER: ${{ needs.development.outputs.winner }}
        steps:
            - name: Check out experiment branch
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install project and evaluation dependencies
              run: |
                  python -m pip install --disable-pip-version-check -e .
                  python -m pip install --disable-pip-version-check numpy scipy pandas h5py

            - name: Verify CUDA and exact-ICA cache
              shell: bash
              run: |
                  set -euo pipefail
                  test -s "$KATJA_CACHE"
                  nvidia-smi
                  python - <<'PY'
                  import torch

                  if not torch.cuda.is_available():
                      raise SystemExit("CUDA is required")
                  print(torch.__version__, torch.cuda.get_device_name(0))
                  PY

            - name: Run registered winner on untouched targets
              shell: bash
              run: |
                  set -euo pipefail
                  output="${RUNNER_TEMP}/katja-monotone-exact-confirmation"
                  mkdir -p "$output"
                  python - <<'PY' | tee "${RUNNER_TEMP}/katja-monotone-exact-confirmation.txt"
                  from __future__ import annotations

                  import json
                  import os
                  import time
                  from pathlib import Path

                  import neureptrace.katja_finger_sequence_benchmark as benchmark
                  from neureptrace._katja_finger_sequence_support import (
                      DEFAULT_CALIBRATION_COUNTS,
                      DEFAULT_CALIBRATION_SEEDS,
                      DEFAULT_PARTICIPANTS,
                      load_katja_feature_cache,
                  )
                  from neureptrace.decoding.monotone_exact_sequence import (
                      TorchMonotoneExactSequenceClassifier,
                  )

                  config = json.loads(
                      Path(os.environ["KATJA_CONFIG"]).read_text(encoding="utf-8")
                  )
                  winner = os.environ["WINNER"]
                  if winner not in config["configurations"]:
                      raise SystemExit(f"Unknown registered winner: {winner!r}")
                  output = (
                      Path(os.environ["RUNNER_TEMP"])
                      / "katja-monotone-exact-confirmation"
                  )
                  cache = load_katja_feature_cache(os.environ["KATJA_CACHE"])
                  benchmark.TorchProgressiveSequenceClassifier = (
                      TorchMonotoneExactSequenceClassifier
                  )
                  model_kwargs = {
                      "hidden_units": 96,
                      "num_layers": 2,
                      "num_heads": 4,
                      "adapter_rank": 8,
                      "source_max_epochs": 120,
                      "meta_epochs": 2,
                      "meta_support_trials": 4,
                      "meta_query_trials": 4,
                      "meta_inner_steps": 5,
                      "adapter_steps": 80,
                      "last_block_steps": 60,
                      "full_finetune_steps": 60,
                      "batch_size": 64,
                      "device": "cuda",
                      "refit_source_on_all": True,
                      "refit_target_on_all": True,
                      **config["configurations"][winner],
                  }
                  development_target = config["development_target"]
                  confirmation_targets = tuple(
                      participant
                      for participant in DEFAULT_PARTICIPANTS
                      if participant != development_target
                  )
                  started = time.time()
                  per_seed, per_target, summary, metadata = (
                      benchmark.run_katja_finger_sequence_benchmark(
                          cache,
                          participants=DEFAULT_PARTICIPANTS,
                          target_participants=confirmation_targets,
                          calibration_counts=DEFAULT_CALIBRATION_COUNTS,
                          calibration_seeds=DEFAULT_CALIBRATION_SEEDS,
                          n_source_participants=9,
                          source_selection_seed=13,
                          pca_components=64,
                          model_kwargs=model_kwargs,
                      )
                  )
                  elapsed = time.time() - started
                  metadata.update(
                      {
                          "winner": winner,
                          "registered_config": config,
                          "development_target": development_target,
                          "confirmation_targets": list(confirmation_targets),
                          "elapsed_seconds": elapsed,
                      }
                  )
                  per_seed.to_csv(output / "per_seed.csv", index=False)
                  per_target.to_csv(output / "per_target.csv", index=False)
                  summary.to_csv(output / "summary.csv", index=False)
                  (output / "metadata.json").write_text(
                      json.dumps(metadata, indent=2, sort_keys=True),
                      encoding="utf-8",
                  )
                  print(f"Winner: {winner}")
                  print(f"Elapsed seconds: {elapsed:.1f}")
                  print(summary.to_string(index=False))
                  PY

            - name: Upload confirmation results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: katja-monotone-exact-confirmation
                  path: |
                      ${{ runner.temp }}/katja-monotone-exact-confirmation.txt
                      ${{ runner.temp }}/katja-monotone-exact-confirmation/*.csv
                      ${{ runner.temp }}/katja-monotone-exact-confirmation/*.json
                  if-no-files-found: warn

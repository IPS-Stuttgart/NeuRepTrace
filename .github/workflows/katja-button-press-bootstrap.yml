name: Install Katja benchmark payload

on:
    push:
        paths:
            - .github/workflows/katja-button-press-bootstrap.yml

permissions:
    contents: write

jobs:
    install:
        runs-on: [self-hosted, Linux, X64]
        timeout-minutes: 60
        steps:
            - name: Check out experiment branch
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Decode and verify payload
              shell: bash
              run: |
                  set -euo pipefail
                  cat .github/katja-payload-*.b64 > "${RUNNER_TEMP}/katja-payload.b64"
                  base64 --decode "${RUNNER_TEMP}/katja-payload.b64" > "${RUNNER_TEMP}/katja-payload.tar.gz"
                  echo "166afed6cf73c6c8028ef33ac590e2ad469a82e2da6ff7abb8f8f8c43328d354  ${RUNNER_TEMP}/katja-payload.tar.gz" | sha256sum --check -
                  tar -xzf "${RUNNER_TEMP}/katja-payload.tar.gz" -C "${GITHUB_WORKSPACE}"

            - name: Declare HDF5 dependency
              shell: bash
              run: |
                  set -euo pipefail
                  python - <<'PY'
                  from pathlib import Path

                  path = Path("pyproject.toml")
                  text = path.read_text(encoding="utf-8")
                  dependency = 'h5py = "*"\n'
                  if dependency not in text:
                      marker = 'python = ">=3.11,<3.15"\n'
                      if marker not in text:
                          raise RuntimeError("Could not locate the Python dependency marker in pyproject.toml")
                      text = text.replace(marker, marker + dependency, 1)
                      path.write_text(text, encoding="utf-8")
                  PY

            - name: Validate implementation
              shell: bash
              run: |
                  set -euo pipefail
                  python -m pip install --disable-pip-version-check -e .
                  python -m pytest -q \
                    tests/test_structured_sequence.py \
                    tests/test_class_mapping.py \
                    tests/test_katja_button_press_data.py \
                    tests/test_katja_benchmark_helpers.py

            - name: Replace payload with implementation
              shell: bash
              run: |
                  set -euo pipefail
                  rm -f .github/workflows/katja-button-press-bootstrap.yml
                  rm -f .github/katja-payload-*.b64
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  if git diff --cached --quiet; then
                    echo "No implementation changes to commit."
                    exit 0
                  fi
                  git commit -m "Add Katja finger-transfer benchmark"
                  git push origin "HEAD:${GITHUB_REF_NAME}"

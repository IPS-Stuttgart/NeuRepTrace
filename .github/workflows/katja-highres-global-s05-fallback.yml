name: Katja exact ICA high-resolution global-finger s05 screen

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/katja-highres-global-s05-fallback.yml
      - experiments/katja-correct-order.patch
      - src/neureptrace/_katja_finger_sequence_support.py
      - src/neureptrace/katja_global_physical_benchmark.py

permissions:
  contents: read

jobs:
  highres-global-s05-fallback:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 150
    env:
      KATJA_HIGHRES_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_finger_events_16x25ms_exact_ica_v4.npz
    steps:
      - uses: actions/checkout@v7

      - name: Apply exact ICA and correct-order protocol
        run: |
          git apply --recount --check experiments/katja-correct-order.patch
          git apply --recount experiments/katja-correct-order.patch

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check numpy scipy h5py

      - name: Verify CUDA
        run: |
          nvidia-smi
          python - <<'PY'
          import torch

          print(torch.__version__, torch.cuda.is_available())
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is required")
          PY

      - name: Build exact ICA 16-bin feature cache when absent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KATJA_HIGHRES_CACHE")"
          if [ ! -s "$KATJA_HIGHRES_CACHE" ]; then
            temporary="${KATJA_HIGHRES_CACHE%.npz}.tmp.${GITHUB_RUN_ID}.npz"
            python - "$temporary" <<'PY'
          from __future__ import annotations

          import sys

          from neureptrace.katja_spm_feature_cache import (
              build_katja_spm_feature_cache,
          )

          response_start = -0.2
          response_stop = 0.2
          temporal_bins = 16
          width = (response_stop - response_start) / temporal_bins
          centers = tuple(
              response_start + (index + 0.5) * width
              for index in range(temporal_bins)
          )
          build_katja_spm_feature_cache(
              "/mnt/lexar4tb/datasets/Katja Button Press Data",
              sys.argv[1],
              window_centers_seconds=centers,
              window_width_seconds=width,
              button_lag_seconds=0.03,
          )
          PY
            mv "$temporary" "$KATJA_HIGHRES_CACHE"
          fi

      - name: Run exact high-resolution global k20 screen
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/katja-highres-global-s05-fallback"
          mkdir -p "$output"
          python - <<'PY' | tee "${RUNNER_TEMP}/katja-highres-global-s05-fallback.txt"
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          import neureptrace.katja_global_physical_benchmark as benchmark
          from neureptrace._katja_finger_sequence_support import (
              DEFAULT_PARTICIPANTS,
              katja_nested_trial_calibration_indices,
              load_katja_feature_cache,
          )
          from neureptrace.decoding.progressive_sequence_finetune import (
              NestedTrialCalibrationSplit,
          )

          def exact_splits(
              strata,
              calibration_counts=(1, 3, 5, 10, 15, 20),
              *,
              max_per_stratum=None,
              min_evaluation_per_stratum=1,
              seed=13,
              context=(),
          ):
              del context
              counts = tuple(int(value) for value in calibration_counts)
              if max_per_stratum is not None and int(max_per_stratum) != max(counts):
                  raise ValueError("Exact Katja split requires max_per_stratum=max(calibration_counts).")
              if int(min_evaluation_per_stratum) != 1:
                  raise ValueError("Exact Katja split uses one or more evaluation trials per sequence.")
              calibration, evaluation, pool = katja_nested_trial_calibration_indices(
                  strata,
                  counts,
                  seed=int(seed),
              )
              return {
                  count: NestedTrialCalibrationSplit(
                      calibration_indices=indices,
                      evaluation_indices=evaluation.copy(),
                      calibration_pool_indices=pool.copy(),
                      per_stratum=int(count),
                      max_per_stratum=max(counts),
                      seed=int(seed),
                  )
                  for count, indices in calibration.items()
              }

          benchmark.select_nested_trial_calibration_splits = exact_splits
          output = Path(os.environ["RUNNER_TEMP"]) / "katja-highres-global-s05-fallback"
          cache = load_katja_feature_cache(os.environ["KATJA_HIGHRES_CACHE"])
          model_kwargs = {
              "hidden_units": 128,
              "num_layers": 2,
              "num_heads": 4,
              "adapter_rank": 16,
              "source_max_epochs": 120,
              "meta_epochs": 2,
              "meta_support_trials": 4,
              "meta_query_trials": 4,
              "meta_inner_steps": 5,
              "adapter_steps": 100,
              "last_block_steps": 80,
              "full_finetune_steps": 80,
              "batch_size": 64,
              "device": "cuda",
          }
          per_seed, per_target, summary, metadata = (
              benchmark.run_katja_global_physical_benchmark(
                  cache,
                  participants=DEFAULT_PARTICIPANTS,
                  target_participants=("s05",),
                  calibration_counts=(20,),
                  calibration_seeds=(13,),
                  n_source_participants=9,
                  source_selection_seed=2026,
                  pca_components=512,
                  model_kwargs=model_kwargs,
              )
          )
          metadata["comparison_source_seed"] = 2026
          metadata["comparison_split_implementation"] = "recovered_sequential_rng"
          metadata["spm_input_selection"] = "Bfc*ICA_corrected.mat"
          metadata["response_feature_layout"] = "16 contiguous 25-ms bins from -0.2 to 0.2 s"
          per_seed.to_csv(output / "per_seed.csv", index=False)
          per_target.to_csv(output / "per_target.csv", index=False)
          summary.to_csv(output / "summary.csv", index=False)
          (output / "metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print(summary.to_string(index=False))
          PY

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: katja-highres-global-s05-fallback
          path: |
            ${{ runner.temp }}/katja-highres-global-s05-fallback.txt
            ${{ runner.temp }}/katja-highres-global-s05-fallback/*.csv
            ${{ runner.temp }}/katja-highres-global-s05-fallback/*.json
          if-no-files-found: warn

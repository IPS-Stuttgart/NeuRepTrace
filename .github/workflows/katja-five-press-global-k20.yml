name: Katja exact ICA five-press global full k20

on:
  workflow_dispatch:
  pull_request:
    branches:
      - agent/katja-global-physical-finger
    paths:
      - .github/workflows/katja-five-press-global-k20.yml
      - src/neureptrace/katja_five_press_feature_cache.py
      - src/neureptrace/katja_five_press_sequence_benchmark.py
      - tests/test_katja_five_press_sequence_benchmark.py

permissions:
  contents: read

jobs:
  five-press-global-k20:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 480
    env:
      KATJA_DATASET_ROOT: /mnt/lexar4tb/datasets/Katja Button Press Data
      KATJA_FIVE_PRESS_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_five_press_exact_ica_v1.npz
    steps:
      - uses: actions/checkout@v7

      - name: Apply exact ICA input selection
        run: |
          git apply --recount --check experiments/katja-correct-order.patch
          git apply --recount experiments/katja-correct-order.patch

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies and run focused tests
        run: |
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pytest numpy scipy h5py
          python -m pytest -q tests/test_katja_five_press_sequence_benchmark.py

      - name: Verify CUDA
        run: |
          nvidia-smi
          python - <<'PY'
          import torch

          print(
              {
                  "torch": torch.__version__,
                  "cuda_available": torch.cuda.is_available(),
                  "cuda_device": (
                      torch.cuda.get_device_name(0)
                      if torch.cuda.is_available()
                      else None
                  ),
              }
          )
          if not torch.cuda.is_available():
              raise SystemExit("CUDA is required")
          PY

      - name: Build exact five-press ICA cache when absent
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$KATJA_FIVE_PRESS_CACHE")"
          if [ ! -s "$KATJA_FIVE_PRESS_CACHE" ]; then
            temporary="${KATJA_FIVE_PRESS_CACHE%.npz}.tmp.${GITHUB_RUN_ID}.npz"
            python -m neureptrace.katja_five_press_feature_cache \
              --dataset-root "$KATJA_DATASET_ROOT" \
              --output "$temporary" \
              --button-lag-ms 30 \
              --force
            mv "$temporary" "$KATJA_FIVE_PRESS_CACHE"
          fi

      - name: Audit complete five-press cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee "${RUNNER_TEMP}/katja-five-press-cache-audit.txt"
          from __future__ import annotations

          import json
          import os

          import numpy as np

          from neureptrace._katja_finger_sequence_support import (
              load_katja_feature_cache,
          )

          cache = load_katja_feature_cache(os.environ["KATJA_FIVE_PRESS_CACHE"])
          subjects = cache["subjects"].astype(str)
          positions = cache["press_positions"].astype(int)
          trials = cache["trial_ids"]
          labels = cache["finger_codes"]
          failures = []
          n_trials = 0
          for subject in sorted(set(subjects.tolist())):
              subject_mask = subjects == subject
              for trial in sorted(set(trials[subject_mask].tolist())):
                  mask = subject_mask & (trials == trial)
                  n_trials += 1
                  if sorted(positions[mask].tolist()) != [1, 2, 3, 4, 5]:
                      failures.append([subject, trial, "positions"])
                  if np.unique(labels[mask]).shape[0] != 5:
                      failures.append([subject, trial, "labels"])
          report = {
              "feature_shape": list(cache["features"].shape),
              "n_participants": int(np.unique(subjects).shape[0]),
              "n_trials": int(n_trials),
              "n_failures": len(failures),
              "first_failures": failures[:10],
          }
          print(json.dumps(report, indent=2, sort_keys=True))
          if failures:
              raise SystemExit("Five-press cache audit failed")
          PY

      - name: Run all 17 targets at k20 seed 13
        shell: bash
        run: |
          set -euo pipefail
          output="${RUNNER_TEMP}/katja-five-press-global-k20"
          mkdir -p "$output"
          python - <<'PY' | tee "${RUNNER_TEMP}/katja-five-press-global-k20.txt"
          from __future__ import annotations

          import json
          import os
          import time
          from pathlib import Path

          from neureptrace._katja_finger_sequence_support import (
              DEFAULT_PARTICIPANTS,
              load_katja_feature_cache,
          )
          from neureptrace.katja_five_press_sequence_benchmark import (
              run_katja_five_press_sequence_benchmark,
          )

          output = Path(os.environ["RUNNER_TEMP"]) / "katja-five-press-global-k20"
          cache = load_katja_feature_cache(os.environ["KATJA_FIVE_PRESS_CACHE"])
          model_kwargs = {
              "hidden_units": 96,
              "num_layers": 2,
              "num_heads": 4,
              "adapter_rank": 8,
              "source_max_epochs": 120,
              "meta_epochs": 2,
              "meta_support_trials": 4,
              "meta_query_trials": 4,
              "meta_inner_steps": 5,
              "adapter_steps": 80,
              "last_block_steps": 60,
              "full_finetune_steps": 60,
              "batch_size": 64,
              "device": "cuda",
              "enforce_permutation_labels": True,
          }
          started = time.time()
          per_seed, per_target, summary, metadata = (
              run_katja_five_press_sequence_benchmark(
                  cache,
                  participants=DEFAULT_PARTICIPANTS,
                  target_participants=DEFAULT_PARTICIPANTS,
                  calibration_counts=(20,),
                  calibration_seeds=(13,),
                  n_source_participants=9,
                  source_selection_seed=2026,
                  pca_components=256,
                  model_kwargs=model_kwargs,
              )
          )
          metadata.update(
              {
                  "spm_input_selection": "Bfc*ICA_corrected.mat",
                  "elapsed_seconds": time.time() - started,
                  "screening_policy": "pre_registered_complete_sequence_auxiliary_context",
              }
          )
          per_seed.to_csv(output / "per_seed.csv", index=False)
          per_target.to_csv(output / "per_target.csv", index=False)
          summary.to_csv(output / "summary.csv", index=False)
          (output / "metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          print("\n=== population summary ===")
          print(summary.to_string(index=False))
          print("\n=== per-target ranking ===")
          print(
              per_target.sort_values("independent_accuracy", ascending=False).to_string(
                  index=False
              )
          )
          PY

      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: katja-five-press-global-k20
          path: |
            ${{ runner.temp }}/katja-five-press-cache-audit.txt
            ${{ runner.temp }}/katja-five-press-global-k20.txt
            ${{ runner.temp }}/katja-five-press-global-k20/*.csv
            ${{ runner.temp }}/katja-five-press-global-k20/*.json
          if-no-files-found: warn

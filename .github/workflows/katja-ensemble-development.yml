name: Katja source-model ensemble development

permissions:
    contents: read

on: # yamllint disable-line rule:truthy
    workflow_dispatch:
    pull_request:
        branches:
            - main
        paths:
            - .github/workflows/katja-ensemble-development.yml
            - experiments/katja-ensemble-development-config.json
            - experiments/katja_ensemble_source_sweep.py

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    gate:
        name: Read ensemble development gate
        runs-on: ubuntu-latest
        outputs:
            enabled: ${{ steps.config.outputs.enabled }}
        steps:
            - name: Check out experiment branch
              uses: actions/checkout@v7

            - name: Validate development gate
              id: config
              shell: bash
              run: |
                  python - <<'PY'
                  import json
                  import os
                  from pathlib import Path

                  config = json.loads(
                      Path(
                          "experiments/katja-ensemble-development-config.json"
                      ).read_text(encoding="utf-8")
                  )
                  if config.get("target") != "s05":
                      raise SystemExit("The ensemble sweep must remain s05-only")
                  enabled = bool(config.get("enabled", False))
                  with Path(os.environ["GITHUB_OUTPUT"]).open(
                      "a", encoding="utf-8"
                  ) as stream:
                      stream.write(f"enabled={str(enabled).lower()}\n")
                  print(json.dumps(config, indent=2, sort_keys=True))
                  PY

    development:
        name: Source and model ensemble sweep on s05
        needs: gate
        if: needs.gate.outputs.enabled == 'true'
        runs-on: [self-hosted, Linux, X64, nvidia-smi]
        timeout-minutes: 180
        env:
            KATJA_DATASET_ROOT: /mnt/lexar4tb/datasets/Katja Button Press Data
            KATJA_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_finger_events_exact_ica_v4.npz
            KATJA_PATCH_BASELINE: ca2ca39a1a3e5d7fd0b7cee4f697c9a9e1a47aa4
        steps:
            - name: Check out experiment branch
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1

            - name: Restore patch baseline and apply experiment patches
              shell: bash
              run: |
                  set -euo pipefail
                  git fetch --no-tags --depth=1 origin "$KATJA_PATCH_BASELINE"
                  for path in \
                    src/neureptrace/katja_spm_feature_cache.py \
                    src/neureptrace/decoding/_progressive_sequence_model.py \
                    src/neureptrace/decoding/_progressive_sequence_training.py
                  do
                      git show "$KATJA_PATCH_BASELINE:$path" > "$path"
                  done
                  git apply --check experiments/katja-correct-order.patch
                  git apply experiments/katja-correct-order.patch
                  git apply --check experiments/katja-refit-full-data.patch
                  git apply experiments/katja-refit-full-data.patch
                  git diff --check

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install project and evaluation dependencies
              run: |
                  python -m pip install --disable-pip-version-check -e .
                  python -m pip install --disable-pip-version-check \
                    pytest numpy scipy pandas h5py

            - name: Verify workstation2, CUDA, script, and focused tests
              shell: bash
              run: |
                  set -euo pipefail
                  nvidia-smi
                  python -m py_compile \
                    experiments/katja_ensemble_source_sweep.py
                  python - <<'PY'
                  from pathlib import Path

                  import torch

                  root = Path("/mnt/lexar4tb/datasets/Katja Button Press Data")
                  report = {
                      "dataset_exists": root.is_dir(),
                      "dataset_root": str(root),
                      "torch": torch.__version__,
                      "cuda_available": torch.cuda.is_available(),
                      "cuda_device_count": torch.cuda.device_count(),
                      "cuda_device": (
                          torch.cuda.get_device_name(0)
                          if torch.cuda.is_available()
                          else None
                      ),
                  }
                  print(report)
                  if not root.is_dir():
                      raise SystemExit(f"Katja dataset directory is missing: {root}")
                  if not torch.cuda.is_available():
                      raise SystemExit("CUDA is required for the ensemble sweep")
                  PY
                  python -m pytest -q \
                    tests/test_progressive_sequence_finetune.py \
                    tests/test_katja_finger_sequence_benchmark.py \
                    | tee "${RUNNER_TEMP}/katja-ensemble-development-tests.txt"

            - name: Validate or rebuild exact ICA response-locked cache
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p "$(dirname "$KATJA_CACHE")"
                  cache_valid=0
                  if [ -s "$KATJA_CACHE" ]; then
                      if python - <<'PY'
                  import json
                  import os

                  import numpy as np

                  path = os.environ["KATJA_CACHE"]
                  with np.load(path, allow_pickle=False) as archive:
                      metadata = json.loads(str(archive["metadata_json"].item()))
                      shape = list(archive["features"].shape)
                  assert metadata["format"] == (
                      "neureptrace_katja_button_press_event_features_exact_ica_v4"
                  )
                  assert metadata["correct_order_rule"] == (
                      "finite variable timing and recorded press equals cueFinger"
                  )
                  print({"cache": path, "shape": shape, "format": metadata["format"]})
                  PY
                      then
                          cache_valid=1
                      fi
                  fi
                  if [ "$cache_valid" -ne 1 ]; then
                      temporary="${KATJA_CACHE%.npz}.tmp.${GITHUB_RUN_ID}.npz"
                      rm -f "$temporary"
                      python -m neureptrace.katja_spm_feature_cache \
                        --dataset-root "$KATJA_DATASET_ROOT" \
                        --output "$temporary" \
                        --button-lag-ms 30 \
                        --force
                      mv "$temporary" "$KATJA_CACHE"
                  fi

            - name: Run development-only source and model ensemble sweep
              shell: bash
              run: |
                  set -euo pipefail
                  output="${RUNNER_TEMP}/katja-ensemble-development"
                  mkdir -p "$output"
                  python experiments/katja_ensemble_source_sweep.py \
                    --feature-cache "$KATJA_CACHE" \
                    --output-dir "$output" \
                    | tee "${RUNNER_TEMP}/katja-ensemble-development.txt"

            - name: Write ensemble ranking to workflow summary
              if: always()
              shell: bash
              run: |
                  if ! command -v python >/dev/null 2>&1; then
                      exit 0
                  fi
                  python - <<'PY'
                  import json
                  import os
                  from pathlib import Path

                  import pandas as pd

                  output = (
                      Path(os.environ["RUNNER_TEMP"])
                      / "katja-ensemble-development"
                  )
                  ranking_path = output / "katja_ensemble_ranking.csv"
                  metadata_path = output / "katja_ensemble_metadata.json"
                  if not ranking_path.exists() or not metadata_path.exists():
                      raise SystemExit(0)
                  ranking = pd.read_csv(ranking_path).copy()
                  for column in (
                      "independent_k15",
                      "independent_k20",
                      "permutation_k20",
                  ):
                      ranking[column] *= 100.0
                  metadata = json.loads(
                      metadata_path.read_text(encoding="utf-8")
                  )
                  with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
                      "a", encoding="utf-8"
                  ) as stream:
                      stream.write("## Katja ensemble development sweep\n\n")
                      stream.write(
                          "Only s05 and the five prespecified calibration seeds "
                          "were used. No 16-target follow-up labels were read.\n\n"
                      )
                      stream.write("```text\n")
                      stream.write(ranking.to_string(index=False))
                      stream.write("\n```\n\n")
                      stream.write(
                          "Selected: `"
                          + metadata["selected_configuration"]
                          + "`; independent k20 change versus the existing "
                          + "s05 selection: "
                          + f"{100.0 * metadata['improvement_over_current_selected_k20']:+.2f} pp.\n"
                      )
                  PY

            - name: Upload ensemble development results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: katja-ensemble-development-s05-exact-ica-v4
                  path: |
                      ${{ runner.temp }}/katja-ensemble-development-tests.txt
                      ${{ runner.temp }}/katja-ensemble-development.txt
                      ${{ runner.temp }}/katja-ensemble-development/*.csv
                      ${{ runner.temp }}/katja-ensemble-development/*.json
                  if-no-files-found: warn

---
name: Refresh PR 1563

"on":
  pull_request:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  merge-main:
    if: github.head_ref == 'fix/source-bagging-estimator-output-shapes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/source-bagging-estimator-output-shapes
          fetch-depth: 0
      - name: Merge current main and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          rm .github/workflows/refresh-pr-1563.yml
          git add -A
          git commit -m "Merge current main into source-bagging validation fix"
          git push origin HEAD:fix/source-bagging-estimator-output-shapes

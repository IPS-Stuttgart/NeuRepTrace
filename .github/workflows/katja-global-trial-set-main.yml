name: Katja global trial-set k20 main-ref screen

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/katja-global-trial-set-main.yml
      - src/neureptrace/decoding/trial_set_sequence.py
      - src/neureptrace/katja_global_trial_set_benchmark.py
      - tests/test_trial_set_sequence.py

permissions:
  contents: read

jobs:
  global-trial-set:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 420
    env:
      KATJA_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_finger_events_exact_ica_v4.npz
      KATJA_OUT: ${{ runner.temp }}/katja-global-trial-set-main
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install and validate
        shell: bash
        run: |
          set -euo pipefail
          test -s "$KATJA_CACHE"
          python -m pip install --disable-pip-version-check -e .
          python -m pip install --disable-pip-version-check pytest numpy scipy h5py
          python -m pytest -q tests/test_trial_set_sequence.py
          nvidia-smi
          python - <<'PY'
          import torch
          assert torch.cuda.is_available(), "CUDA is required"
          print(torch.__version__, torch.cuda.get_device_name(0))
          PY
      - name: Run exact full cohort
        run: |
          python -m neureptrace.katja_global_trial_set_benchmark \
            --feature-cache "$KATJA_CACHE" --output-dir "$KATJA_OUT" \
            --participants s05,s06,s08,s09,s10,s11,s13,s14,s15,s16,s17,s18,s20,s21,s24,s25,s28 \
            --calibration-counts 20 --calibration-seeds 13 \
            --n-source-participants 9 --source-selection-seed 2026 \
            --pca-components 256 --hidden-units 96 --num-layers 2 \
            --num-heads 4 --adapter-rank 8 --source-max-epochs 120 \
            --meta-epochs 2 --adapter-steps 80 --last-block-steps 60 \
            --full-finetune-steps 60 --batch-size 64 \
            --trial-set-loss-weight 0.1 --device cuda \
            | tee "${RUNNER_TEMP}/katja-global-trial-set-main.txt"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: katja-global-trial-set-main
          path: |
            ${{ runner.temp }}/katja-global-trial-set-main.txt
            ${{ runner.temp }}/katja-global-trial-set-main/*.csv
            ${{ runner.temp }}/katja-global-trial-set-main/*.json
          if-no-files-found: warn

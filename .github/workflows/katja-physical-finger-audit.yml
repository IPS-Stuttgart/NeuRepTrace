name: Katja physical-finger semantics audit

permissions:
    contents: read

on: # yamllint disable-line rule:truthy
    workflow_dispatch:
    pull_request:
        branches:
            - agent/katja-source-model-ensemble
        paths:
            - .github/workflows/katja-physical-finger-audit.yml

jobs:
    archive-note:
        name: Physical-finger audit archived
        runs-on: ubuntu-latest
        steps:
            - name: Record completed label-semantics audit
              run: |
                  echo "The exact-ICA physical-finger audit completed in run 31021222903."
                  echo "Global codes: 1,2,3,4,5."
                  echo "Fixed code counts: code 2 for 6 participants, code 3 for 7, code 4 for 4."
                  echo "Participant-local classes 1 and 2 are not globally physically consistent."
                  echo "Artifact: 8936661599."
                  echo "The self-hosted audit is archived to avoid repeated dataset access."

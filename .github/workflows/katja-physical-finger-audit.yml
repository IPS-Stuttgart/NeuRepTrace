name: Katja physical-finger semantics audit

permissions:
    contents: read

on: # yamllint disable-line rule:truthy
    workflow_dispatch:
    pull_request:
        branches:
            - agent/katja-source-model-ensemble
        paths:
            - .github/workflows/katja-physical-finger-audit.yml
            - experiments/katja_physical_finger_audit.py

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    audit:
        name: Audit participant-local versus physical finger codes
        runs-on: [self-hosted, Linux, X64, nvidia-smi]
        timeout-minutes: 20
        env:
            KATJA_CACHE: /mnt/lexar4tb/datasets/Katja Button Press Data/.neureptrace/katja_finger_events_exact_ica_v4.npz
        steps:
            - name: Check out experiment branch
              uses: actions/checkout@v7

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install audit dependencies
              run: |
                  python -m pip install --disable-pip-version-check numpy pandas

            - name: Validate cache and run physical-finger audit
              shell: bash
              run: |
                  set -euo pipefail
                  test -s "$KATJA_CACHE"
                  output="${RUNNER_TEMP}/katja-physical-finger-audit"
                  mkdir -p "$output"
                  python experiments/katja_physical_finger_audit.py \
                    --feature-cache "$KATJA_CACHE" \
                    --output-dir "$output" \
                    | tee "${RUNNER_TEMP}/katja-physical-finger-audit.txt"

            - name: Write audit result to workflow summary
              if: always()
              shell: bash
              run: |
                  if ! command -v python >/dev/null 2>&1; then
                      exit 0
                  fi
                  python - <<'PY'
                  import json
                  import os
                  from pathlib import Path

                  output = Path(os.environ["RUNNER_TEMP"]) / "katja-physical-finger-audit"
                  report_path = output / "katja_physical_finger_audit.json"
                  mapping_path = output / "katja_physical_finger_mapping.csv"
                  if not report_path.exists() or not mapping_path.exists():
                      raise SystemExit(0)
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
                  with summary.open("a", encoding="utf-8") as stream:
                      stream.write("## Katja physical-finger semantics audit\n\n")
                      stream.write("```json\n")
                      stream.write(json.dumps(report, indent=2, sort_keys=True))
                      stream.write("\n```\n")
                  PY

            - name: Upload physical-finger audit
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: katja-physical-finger-audit
                  path: |
                      ${{ runner.temp }}/katja-physical-finger-audit.txt
                      ${{ runner.temp }}/katja-physical-finger-audit/*.csv
                      ${{ runner.temp }}/katja-physical-finger-audit/*.json
                  if-no-files-found: warn

name: BUSH-MEG Category 2 autoencoder LOSO

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - workflow-triggers/bushmeg_category2_autoencoder_loso.txt
      - .github/workflows/bushmeg-category2-autoencoder-loso.yml
  push:
    branches:
      - feature/category2-ae-latent-loso
    paths:
      - workflow-triggers/bushmeg_category2_autoencoder_loso.txt
      - .github/workflows/bushmeg-category2-autoencoder-loso.yml

jobs:
  run-category2-loso:
    runs-on: [self-hosted, Linux]
    timeout-minutes: 720
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install NeuRepTrace
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Locate BUSH-MEG data
        run: |
          set -euo pipefail
          if [ -n "${BUSH_MEG_DATA_DIR:-}" ] && [ -f "${BUSH_MEG_DATA_DIR}/Part1Data.mat" ]; then
            echo "BUSH_MEG_DATA_DIR=${BUSH_MEG_DATA_DIR}" >> "$GITHUB_ENV"
            exit 0
          fi
          root="$(find /home/github-runner/.cache/datasets -type f -name 'Part1Data.mat' -printf '%h\n' | head -n 1 || true)"
          if [ -z "$root" ]; then
            echo "Could not find Part1Data.mat under /home/github-runner/.cache/datasets" >&2
            exit 1
          fi
          echo "BUSH_MEG_DATA_DIR=${root}" >> "$GITHUB_ENV"
          echo "Using BUSH_MEG_DATA_DIR=${root}"

      - name: Run Category 2 autoencoder LOSO
        run: |
          set -euo pipefail
          python -m neureptrace.bushmeg_category2_autoencoder_loso \
            configs/bush_meg/category2_autoencoder_loso.yml \
            --out results/bush_meg/category2_autoencoder_loso/workflow_summary.csv \
            --predictions-out results/bush_meg/category2_autoencoder_loso/workflow_predictions.csv

      - name: Print summary
        run: |
          python - <<'PY'
          import pandas as pd
          path = 'results/bush_meg/category2_autoencoder_loso/workflow_summary.csv'
          summary = pd.read_csv(path)
          print(summary[['outer_test_subject', 'balanced_accuracy', 'top2_accuracy', 'reconstruction_mse_target']].to_string(index=False))
          print('mean_balanced_accuracy', float(summary['balanced_accuracy'].mean()))
          print('mean_top2_accuracy', float(summary['top2_accuracy'].mean()))
          PY

      - name: Upload results
        uses: actions/upload-artifact@v7
        with:
          name: bushmeg-category2-autoencoder-loso-results
          path: results/bush_meg/category2_autoencoder_loso/

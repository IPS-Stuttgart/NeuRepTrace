name: Katja online-window preparation

permissions:
    contents: read

on: # yamllint disable-line rule:truthy
    workflow_dispatch:
        inputs:
            participants:
                description: Comma-separated participant registry
                required: false
                default: s05,s06,s08,s09,s10,s11,s13,s14,s15,s16,s17,s18,s20,s21,s24,s25,s28
                type: string
    pull_request:
        branches:
            - main
        paths:
            - .github/workflows/katja-online-window-preparation.yml
            - docs/katja_online_window_alignment.md
            - docs/progressive_sequence_finetune.md
            - experiments/katja-ensemble-population-config.json
            - src/neureptrace/katja_press_timing.py
            - src/neureptrace/katja_sliding_window_manifest.py
            - src/neureptrace/katja_online_protocol.py
            - tests/test_katja_press_timing.py
            - tests/test_katja_sliding_window_manifest.py
            - tests/test_katja_online_protocol.py

concurrency:
    group: katja-online-window-preparation-${{ github.ref }}
    cancel-in-progress: true

env:
    KATJA_DATASET_ROOT: /mnt/lexar4tb/datasets/Katja Button Press Data
    KATJA_PARTICIPANTS: ${{ github.event.inputs.participants || 's05,s06,s08,s09,s10,s11,s13,s14,s15,s16,s17,s18,s20,s21,s24,s25,s28' }}
    PYTHONUNBUFFERED: "1"

jobs:
    prepare:
        name: Audit press timing and materialize raw overlaps
        if: >-
            github.event_name == 'workflow_dispatch' ||
            github.event.pull_request.head.repo.full_name == github.repository
        runs-on: [self-hosted, Linux, X64, nvidia-smi]
        timeout-minutes: 120
        steps:
            - name: Check out NeuRepTrace
              uses: actions/checkout@v7
              with:
                  fetch-depth: 1
                  persist-credentials: false

            - name: Set up Python
              uses: actions/setup-python@v7
              with:
                  python-version: "3.11"

            - name: Install project and focused dependencies
              run: |
                  python -m pip install --disable-pip-version-check -e .
                  python -m pip install --disable-pip-version-check pytest numpy scipy pandas h5py

            - name: Run focused pure regressions
              run: |
                  python -m pytest -q \
                    tests/test_katja_press_timing.py \
                    tests/test_katja_sliding_window_manifest.py \
                    tests/test_katja_online_protocol.py \
                    | tee "${RUNNER_TEMP}/katja-online-preparation-tests.txt"

            - name: Audit UPPT002 against behavioral press times
              shell: bash
              run: |
                  set -euo pipefail
                  output="${RUNNER_TEMP}/katja-online-preparation"
                  mkdir -p "$output"
                  test -d "$KATJA_DATASET_ROOT"
                  python -m neureptrace.katja_press_timing \
                    --dataset-root "$KATJA_DATASET_ROOT" \
                    --output-dir "$output/timing" \
                    --participants "$KATJA_PARTICIPANTS" \
                    --channel-label UPPT002 \
                    --expected-lag-ms 30 \
                    --match-tolerance-ms 150 \
                    --min-separation-ms 50 \
                    | tee "${RUNNER_TEMP}/katja-press-timing-audit.txt"

            - name: Build raw 500-ms by 40-ms overlap manifest
              shell: bash
              run: |
                  set -euo pipefail
                  output="${RUNNER_TEMP}/katja-online-preparation"
                  python -m neureptrace.katja_sliding_window_manifest \
                    --press-timing "$output/timing/katja_press_timing_per_press.csv.gz" \
                    --output "$output/katja_window_intersections.csv.gz" \
                    --execution-start-seconds 0 \
                    --execution-stop-seconds 6 \
                    --window-width-ms 500 \
                    --stride-ms 40 \
                    --press-before-ms 400 \
                    --press-after-ms 100 \
                    --grid-reference start \
                    --allow-incomplete-trials \
                    | tee "${RUNNER_TEMP}/katja-window-manifest.txt"

            - name: Build candidate trial split manifests
              shell: bash
              run: |
                  set -euo pipefail
                  output="${RUNNER_TEMP}/katja-online-preparation"
                  python - <<'PY'
                  import os
                  from pathlib import Path

                  import pandas as pd

                  root = Path(os.environ["RUNNER_TEMP"]) / "katja-online-preparation"
                  windows = pd.read_csv(root / "katja_window_intersections.csv.gz")
                  registry = (
                      windows[["subject", "trial_id", "sequence_id"]]
                      .drop_duplicates()
                      .sort_values(["subject", "sequence_id", "trial_id"])
                  )
                  registry.to_csv(root / "katja_trial_registry.csv", index=False)
                  PY
                  for mode in nested_rest independent_rest fixed_max_complement; do
                      python -m neureptrace.katja_online_protocol splits \
                        --trials "$output/katja_trial_registry.csv" \
                        --output "$output/katja_splits_${mode}.csv.gz" \
                        --calibration-counts 1,3,5,10,15,20 \
                        --seeds 0,1,2,3,4 \
                        --mode "$mode"
                  done

            - name: Validate label-agnostic artifact contract
              shell: bash
              run: |
                  set -euo pipefail
                  python - <<'PY' | tee "${RUNNER_TEMP}/katja-online-preparation-audit.txt"
                  import json
                  import os
                  from pathlib import Path

                  import pandas as pd

                  root = Path(os.environ["RUNNER_TEMP"]) / "katja-online-preparation"
                  timing = pd.read_csv(root / "timing" / "katja_press_timing_per_press.csv.gz")
                  subject_summary = pd.read_csv(root / "timing" / "katja_press_timing_per_subject.csv")
                  windows = pd.read_csv(root / "katja_window_intersections.csv.gz")
                  metadata = json.loads(
                      (root / "katja_window_intersections.csv.metadata.json").read_text(
                          encoding="utf-8"
                      )
                  )
                  forbidden = {"true_label", "finger_label", "null_label"}
                  if forbidden.intersection(windows.columns):
                      raise RuntimeError("Window manifest assigned labels before the reference function")
                  if metadata["defines_null_labels"] or metadata["defines_finger_labels"]:
                      raise RuntimeError("Window metadata must remain label agnostic")
                  press_counts = timing.groupby(["subject", "trial_id"])["press_position"].nunique()
                  if not (press_counts == 5).all():
                      raise RuntimeError("Every materialized trial must contain all five press rows")
                  report = {
                      "subjects": sorted(timing["subject"].unique().tolist()),
                      "n_trials": int(press_counts.shape[0]),
                      "n_press_rows": int(timing.shape[0]),
                      "n_window_rows": int(windows.shape[0]),
                      "n_windows_per_trial": metadata["n_windows_per_trial"],
                      "trigger_match_fraction_min": float(
                          subject_summary["trigger_match_fraction"].min()
                      ),
                      "trigger_match_fraction_mean": float(
                          subject_summary["trigger_match_fraction"].mean()
                      ),
                      "label_assignment_status": metadata["label_assignment_status"],
                  }
                  print(json.dumps(report, indent=2, sort_keys=True))
                  PY

            - name: Upload timing, overlap, and split preparation
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: katja-online-window-preparation
                  path: |
                      ${{ runner.temp }}/katja-online-preparation-tests.txt
                      ${{ runner.temp }}/katja-press-timing-audit.txt
                      ${{ runner.temp }}/katja-window-manifest.txt
                      ${{ runner.temp }}/katja-online-preparation-audit.txt
                      ${{ runner.temp }}/katja-online-preparation/**
                  if-no-files-found: warn

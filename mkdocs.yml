theme:
    name: material
    features:
        - navigation.sections
        - navigation.expand
        - content.code.copy

plugins:
    - search
    - mkdocstrings:
          handlers:
              python:
                  paths: [src]
                  options:
                      docstring_style: numpy
                      show_source: true
                      show_root_heading: true

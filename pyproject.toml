[tool.poetry]
name = "neureptrace"
description = "Probabilistic tracing of neural representations over time."
readme = "README.md"
authors = ["Florian Pfaff <pfaff@ias.uni-stuttgart.de>"]
version = "0.1.1"
license = "MIT"
packages = [
  { include = "neureptrace", from = "src" },
  { include = "reptrace", from = "src" },
]

[tool.poetry.scripts]
neureptrace = "neureptrace.cli:main"
neureptrace-benchmark = "neureptrace.benchmark:main"
neureptrace-dataset-manifest = "neureptrace.dataset_manifest:main"
neureptrace-epoch-transfer-decode = "neureptrace.epoch_transfer_decode:main"
neureptrace-fieldtrip-to-mne = "neureptrace.fieldtrip_mat:main"
neureptrace-continuous-stimulus-scan = "neureptrace.continuous_stimulus_scan:main"
neureptrace-event-detect = "neureptrace.event_detection:main"
neureptrace-metadata = "neureptrace.metadata:main"
neureptrace-mne-time-decode = "neureptrace.mne_time_decode:main"
neureptrace-observation-ensemble = "neureptrace.observation_ensemble:main"
neureptrace-onset-detect = "neureptrace.onset_detection:main"
neureptrace-plot-time-decode = "neureptrace.plot_time_decode:main"
neureptrace-results = "neureptrace.results:main"
neureptrace-stimulus-detect = "neureptrace.stimulus_detection:main"
neureptrace-temporal-model = "neureptrace.temporal_model:main"
neureptrace-temporal-smoothing = "neureptrace.temporal_smoothing:main"
neureptrace-temporal-state-workflow = "neureptrace.temporal_state_workflow:main"
neureptrace-time-transfer-decode = "neureptrace.time_transfer_decode:main"
neureptrace-validate-manifest = "neureptrace.validate_manifest:main"
neureptrace-validate-observations = "neureptrace.observation_schema:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
joblib = "*"
matplotlib = "*"
mne = "*"
numpy = "*"
pandas = "*"
PyYAML = "*"
scipy = "*"
scikit-learn = "*"
xgboost = { version = "*", optional = true }
torch = { version = "*", optional = true }
pytorch-lightning = { version = "*", optional = true }

[tool.poetry.extras]
xgboost = ["xgboost"]
torch = ["torch", "pytorch-lightning"]
ml = ["xgboost", "torch", "pytorch-lightning"]
all = ["xgboost", "torch", "pytorch-lightning"]

[tool.poetry.group.dev.dependencies]
pytest = "*"
ruff = "*"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.1"
mkdocstrings = { version = "^1.0.4", extras = ["python"] }
mkdocs-material = "^9.7.6"

[tool.mypy]
check_untyped_defs = true

[tool.ruff]
line-length = 180

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
markers = [
  "performance: deterministic performance-regression tests, skipped unless requested",
  "parity: opt-in migration/parity tests for PyMEGDec phase-out data and reference artifacts",
]

[tool.pylint.MAIN]
py-version = "3.13"
fail-under = 10
ignore = ["CVS"]

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "raw-checker-failed",
  "bad-inline-option",
  "locally-disabled",
  "file-ignored",
  "suppressed-message",
  "deprecated-pragma",
  "use-symbolic-message-instead",
  "C",
]

[tool.pylint.FORMAT]
max-line-length = 180

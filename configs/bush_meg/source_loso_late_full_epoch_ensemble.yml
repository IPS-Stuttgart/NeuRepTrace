# Strict source-only BUSH-MEG LOSO sweep focused on late/full-epoch information.
#
# This config intentionally loads only Part*Data.mat.  Cue files remain excluded.
# It is designed as a cleaner follow-up to the failed direct NeuRepTrace run:
# the feature representation is compact temporal-bin means, probabilities are
# ensembled source-only, and the optional reranker is fitted only from inner
# source-subject out-of-fold predictions.
schema_version: neureptrace.dataset.v1
paths:
    base: cwd
dataset:
    name: bush_meg
    type: fieldtrip_mat
    root: ${BUSH_MEG_DATA_DIR}
    participant_file: "Part{participant}Data.mat"
    variable: data
    channel_type: mag
    fields:
        trial: trial
        time: time
        label: label
        trialinfo: trialinfo
        sensor_geometry: grad
participants:
    ids: "1-4,6,8,9,10,13-27"
validation:
    trim_channel_labels_to_data: true
    channel_policy: exact
metadata:
    columns:
        - name: stimulus_class
          index: 0
        - name: condition
          index: 1
          optional: true
preprocessing:
    tmin: -0.35
    tmax: 0.70
    normalization: subject_baseline_whiten
    baseline_window: [-0.35, -0.05]
    feature_preprocessor: pca
    pca_components: 96
    window_size: 0.100
decoding:
    label_column: stimulus_class
    group_column: participant
    classifier: multinomial-logistic
    emission_mode: uncalibrated
    max_iter: 2500
source_loso:
    group_column: participant
    selection_metric: balanced_accuracy
    ensemble_top_k: 5
    ensemble_weighting: stacked
    ensemble_class_bias: balanced_accuracy
    ensemble_temperature: 0.01
    rerank_top_k: 3
    rerank_alpha_grid: [0.0, 0.25, 0.5, 1.0, 2.0]
    candidate_grid:
        # 4 bins keeps 100 ms windows compact; 8 bins allow full-epoch candidates
        # to preserve coarse temporal shape without sensor-by-sample flattening.
        temporal_bins: [4, 8]
        decoders: [multinomial-logistic]
        emission_modes: [uncalibrated]
        feature_preprocessors: [pca]
        pca_components: [64, 128]
        c_grid: [0.1, 1.0, 10.0]
        sample_weightings: [none]
        class_bias_modes: [none]
        feature_kinds: [evoked, prototype]
        window_sets:
            # Retain the known early visual baselines for sanity checking.
            - name: early_single_150ms
              centers: [0.150]
              window_size: 0.100
            - name: early_single_175ms
              centers: [0.175]
              window_size: 0.100
            - name: early_single_200ms
              centers: [0.200]
              window_size: 0.100
            - name: early_triplet_150_200ms
              centers: [0.150, 0.175, 0.200]
              window_size: 0.100
            # Explicit late ranges target the likely semantic/object-category regime.
            - name: late_300_550ms
              start: 0.300
              stop: 0.550
              step: 0.050
              window_size: 0.100
            - name: midlate_200_650ms
              start: 0.200
              stop: 0.650
              step: 0.050
              window_sizes: [0.100, 0.150]
            # Full-epoch compact candidates: one window, many temporal bins.
            - name: full_0_650ms
              full_epoch: true
              start: 0.000
              stop: 0.650
            - name: full_m50_700ms
              full_epoch: true
              start: -0.050
              stop: 0.700
outputs:
    base_dir: results/{dataset}/source_loso_late_full_epoch_ensemble
    source_loso_ensemble_summary_csv: source_loso_late_full_epoch_ensemble_summary.csv
    source_loso_ensemble_inner_cv_csv: source_loso_late_full_epoch_ensemble_inner_cv.csv
    source_loso_ensemble_candidate_summary_csv: source_loso_late_full_epoch_ensemble_candidate_summary.csv
    source_loso_ensemble_predictions_csv: source_loso_late_full_epoch_ensemble_predictions.csv
    provenance: true
    hash_input_files: true

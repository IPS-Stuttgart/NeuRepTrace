schema_version: neureptrace.dataset.v1

paths:
  base: cwd

dataset:
  name: bush_meg
  type: fieldtrip_mat
  root: ${BUSH_MEG_DATA_DIR}
  participant_file: "Part{participant}Data.mat"
  variable: data
  channel_type: mag
  fields:
    trial: trial
    time: time
    label: label
    trialinfo: trialinfo
    sensor_geometry: grad

participants:
  ids: "1-4,6,8,9,10,13-27"

validation:
  trim_channel_labels_to_data: true
  channel_policy: exact

metadata:
  columns:
    - name: stimulus_class
      index: 0
    - name: condition
      index: 1
      optional: true

preprocessing:
  # Keep the full baseline interval; earlier smoke configs cropped away part of
  # the requested [-0.35, -0.05] baseline before normalization.
  tmin: -0.35
  tmax: 0.25
  window_size: 0.1
  window_step: 0.025
  normalization: subject_baseline_whiten
  baseline_window: [-0.35, -0.05]
  feature_preprocessor: pca
  pca_components: 128

decoding:
  label_column: stimulus_class
  group_column: participant

  # Main-task source-only LOSO. No CueData and no target-subject labels are used
  # for alignment, calibration, model selection, or classifier fitting.
  n_splits: 23

  # Use the strongest simple source-only family observed so far, but make the
  # training signal less brittle by pooling nearby visual-response windows.
  classifier: multinomial-logistic
  emission_mode: uncalibrated
  max_iter: 3000
  feature_preprocessor: pca
  pca_components: 128

  # Treat selected train-time windows as fold-local temporal augmentation.
  # With 100 ms windows and 25 ms steps, this focuses on the 125-225 ms visual
  # response region while still evaluating every test-time window.
  temporal_train_window: [0.125, 0.225]
  temporal_train_mode: pooled

  # Nested, source-subject-only model selection. The grouped inner split keeps
  # all temporal augmentations of the same source subject inside one inner fold.
  tune_hyperparameters: true
  tuning_cv_splits: 5
  tuning_scoring: balanced_accuracy
  tuning_c_grid: [0.003, 0.01, 0.03, 0.1, 0.3, 1.0, 3.0, 10.0]

outputs:
  base_dir: results/{dataset}/temporal_pool
  summary_csv: stimulus_decoding_temporal_pool_summary.csv
  observations_csv: stimulus_decoding_temporal_pool_observations.csv
  calibration_csv: ""
  provenance: true
  hash_input_files: true

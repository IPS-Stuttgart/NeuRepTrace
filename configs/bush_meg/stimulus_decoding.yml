schema_version: neureptrace.dataset.v1

paths:
    # Outputs are relative to the current working directory by default. Use
    # config_dir for examples that should write next to the YAML file, or
    # project_root when running from inside a source checkout.
    base: cwd

dataset:
    name: bush_meg
    type: fieldtrip_mat
    root: ${BUSH_MEG_DATA_DIR}
    participant_file: "Part{participant}Data.mat"
    variable: data
    channel_type: mag
    fields:
        trial: trial
        time: time
        label: label
        trialinfo: trialinfo
        sensor_geometry: grad

participants:
    ids: "1-4,6,8,9,10,13-27"

validation:
    trim_channel_labels_to_data: true
    channel_policy: exact

metadata:
    columns:
        - name: stimulus_class
          index: 0
        - name: condition
          index: 1
          optional: true
    # Optional examples for replacing Python-side label handling:
    # maps:
    #   stimulus_class:
    #     1: face
    #     2: object
    # filters:
    #   - column: stimulus_class
    #     include: [1, 2]

preprocessing:
    tmin: -0.2
    tmax: 0.6
    window_size: 0.1
    window_step: 0.05
    normalization: subject_baseline_whiten
    baseline_window: [-0.35, -0.05]
    feature_preprocessor: pca
    pca_components: 100

decoding:
    label_column: stimulus_class
    group_column: participant
    classifier: multiclass-svm
    emission_mode: calibrated
    n_splits: 5
    max_iter: 1000

outputs:
    base_dir: results/{dataset}
    summary_csv: stimulus_decoding_summary.csv
    observations_csv: stimulus_decoding_observations.csv
    calibration_csv: stimulus_decoding_calibration.csv
    provenance: true
    hash_input_files: true

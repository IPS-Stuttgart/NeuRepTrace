schema_version: neureptrace.dataset.v1

dataset:
  name: bush_meg
  type: fieldtrip_mat
  root: ${BUSH_MEG_DATA_DIR}
  participant_file: "Part{participant}Data.mat"
  variable: data
  channel_type: mag
  fields:
    trial: trial
    time: time
    label: label
    trialinfo: trialinfo
    sensor_geometry: grad

participants:
  ids: "1-4,6,8,9,10,13-27"

validation:
  trim_channel_labels_to_data: true

metadata:
  columns:
    - name: stimulus_class
      index: 0
    - name: condition
      index: 1
      optional: true

preprocessing:
  tmin: -0.2
  tmax: 0.6
  window_size: 0.1
  window_step: 0.05
  normalization: subject_baseline_whiten
  baseline_window: [-0.35, -0.05]
  feature_preprocessor: pca
  pca_components: 100

decoding:
  label_column: stimulus_class
  group_column: participant
  classifier: multiclass-svm
  emission_mode: calibrated
  n_splits: 5
  max_iter: 1000

outputs:
  summary_csv: results/{dataset}/stimulus_decoding_summary.csv
  observations_csv: results/{dataset}/stimulus_decoding_observations.csv
  calibration_csv: results/{dataset}/stimulus_decoding_calibration.csv

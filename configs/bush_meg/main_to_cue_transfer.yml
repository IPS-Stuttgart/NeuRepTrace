schema_version: neureptrace.dataset.v1

paths:
    base: cwd

dataset:
    name: bush_meg
    type: fieldtrip_mat
    root: ${BUSH_MEG_DATA_DIR}
    variable: data
    channel_type: mag
    files:
        - path: "Part2Data.mat"
          participant: 2
          split: main
        - path: "Part2CueData.mat"
          participant: 2
          split: cue
    fields:
        trial: trial
        time: time
        label: label
        trialinfo: trialinfo
        sensor_geometry: grad

validation:
    trim_channel_labels_to_data: true
    channel_policy: exact

metadata:
    columns:
        - name: stimulus_class
          index: 0
        - name: condition
          index: 1
          optional: true

preprocessing:
    tmin: -0.2
    tmax: 0.6
    window_size: 0.1
    window_step: 0.05
    normalization: subject_baseline_whiten
    baseline_window: [-0.35, -0.05]
    feature_preprocessor: pca
    pca_components: 100

transfer:
    label_column: stimulus_class
    train_filter:
        split: main
    test_filter:
        split: cue
    classifier: multiclass-svm
    emission_mode: calibrated
    max_iter: 1000

outputs:
    base_dir: results/{dataset}
    summary_csv: main_to_cue_transfer_summary.csv
    observations_csv: main_to_cue_transfer_observations.csv
    provenance: true
    hash_input_files: true

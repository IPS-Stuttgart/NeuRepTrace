# Strict main-task LOSO classifier with cue-derived source-subject weighting.
#
# Cue epochs are used only to compute subject-level source weights.  They are
# not appended to the training set, not used as test trials, and not used to fit
# class labels.  This is intended as a safer alternative to cue-fitted M-CCA or
# hyperalignment when cue geometry does not preserve main-task class structure.
# jscpd:ignore-start
schema_version: neureptrace.dataset.v1
paths:
  base: cwd
dataset:
  name: bush_meg
  type: fieldtrip_mat
  root: ${BUSH_MEG_DATA_DIR}
  participant_file: "Part{participant}Data.mat"
  variable: data
  channel_type: mag
  fields:
    trial: trial
    time: time
    label: label
    trialinfo: trialinfo
    sensor_geometry: grad
participants:
  ids: "1-4,6,8,9,10,13-27"
validation:
  trim_channel_labels_to_data: true
  channel_policy: exact
metadata:
  columns:
    - name: stimulus_class
      index: 0
    - name: condition
      index: 1
      optional: true
preprocessing:
  tmin: -0.35
  tmax: 0.25
  normalization: subject_baseline_whiten
  baseline_window: [-0.35, -0.05]
  feature_preprocessor: pca
  pca_components: 96
  window_size: 0.100
decoding:
  label_column: stimulus_class
  group_column: participant
  classifier: multinomial-logistic
  emission_mode: uncalibrated
  max_iter: 2500
# jscpd:ignore-end
source_loso:
  group_column: participant
  selection_metric: balanced_accuracy
  ensemble_top_k: 7
  ensemble_weighting: stacked
  ensemble_class_bias: balanced_accuracy
  ensemble_temperature: 0.01
  cue_source_weighting:
    enabled: true
    participant_file: "Part{participant}CueData.mat"
    # Conservative default: blend cue-nearest weighting with uniform all-source
    # weighting so a poor cue similarity estimate cannot fully discard sources.
    mode: softmax_top_k
    top_k: 12
    temperature: 0.25
    blend: 0.50
    feature_kinds: [baseline_logvar, evoked_gfp, evoked_mean]
    baseline_window: [-0.35, -0.05]
    response_window: [0.05, 0.25]
    temporal_bins: 8
  candidate_grid:
    temporal_bins: [2, 4]
    feature_kinds:
      [
        evoked,
        evoked_logvar,
        prototype,
        evoked_prototype,
        xdawn,
        xdawn_prototype,
      ]
    feature_families: [bin_means, template_similarity]
    sample_weightings: [subject_class_balanced]
    class_bias_modes: [none, balanced_accuracy]
    decoders: [multinomial-logistic, shrinkage_lda, linear_svm, ovo_linear_svm]
    emission_modes: [uncalibrated]
    feature_preprocessors: [pca, pca_whiten, anova_select]
    pca_components: [32, 64, 128]
    xdawn_components: [6, 8, 12]
    c_grid: [0.1, 1.0, 10.0]
    window_sets:
      - name: single_150ms
        centers: [0.150]
        window_size: 0.100
      - name: single_175ms
        centers: [0.175]
        window_size: 0.100
      - name: single_200ms
        centers: [0.200]
        window_size: 0.100
      - name: triplet_125_175_225ms
        centers: [0.125, 0.175, 0.225]
        window_size: 0.100
      - name: broad_75_300ms
        centers: [0.075, 0.125, 0.175, 0.225, 0.275, 0.300]
        window_size: 0.100
outputs:
  base_dir: results/{dataset}/source_loso_cue_weighted_ensemble
  source_loso_ensemble_summary_csv: source_loso_cue_weighted_ensemble_summary.csv
  source_loso_ensemble_inner_cv_csv: source_loso_cue_weighted_ensemble_inner_cv.csv
  source_loso_ensemble_candidate_summary_csv: source_loso_cue_weighted_ensemble_candidate_summary.csv
  source_loso_ensemble_predictions_csv: source_loso_cue_weighted_ensemble_predictions.csv
  source_loso_ensemble_cue_weights_csv: source_loso_cue_weighted_ensemble_cue_weights.csv
  provenance: true
  hash_input_files: true

schema_version: neureptrace.dataset.v1

paths:
    base: cwd

dataset:
    name: bush_meg
    type: fieldtrip_mat
    root: ${BUSH_MEG_DATA_DIR}
    participant_file: "Part{participant}Data.mat"
    variable: data
    channel_type: mag
    fields:
        trial: trial
        time: time
        label: label
        trialinfo: trialinfo
        sensor_geometry: grad

participants:
    ids: "1-4,6,8,9,10,13-27"

validation:
    trim_channel_labels_to_data: true
    channel_policy: exact

metadata:
    columns:
        - name: stimulus_class
          index: 0
        - name: condition
          index: 1
          optional: true

preprocessing:
    # The workflow remains cue-free. Baseline whitening is fitted subject-locally
    # before LOSO, exactly as in the source_loso baseline, and the supervised PLS
    # subspace is then fitted only on source subjects within each inner/outer fold.
    tmin: -0.35
    tmax: 0.35
    normalization: subject_baseline_whiten
    baseline_window: [-0.35, -0.05]

decoding:
    label_column: stimulus_class
    group_column: participant
    classifier: multinomial-logistic
    max_iter: 3000

supervised_lowrank_loso:
    group_column: participant
    selection_metric: balanced_accuracy
    ensemble_size: 3
    ensemble_aggregation: log_mean
    min_probability: 1.0e-12
    candidate_grid:
        # Wider binned epochs preserve temporal structure that can be lost in the
        # short 100 ms PCA-window baseline. The grid is intentionally modest so it
        # remains feasible on self-hosted runners; use --set to widen it.
        temporal_bins: [8, 12]
        pls_components: [8, 16, 32]
        decoders:
            - multinomial-logistic
        c_grid: [0.1, 1.0, 10.0]
        include_deltas: [false]
        epoch_windows:
            - name: post_000_250ms
              start: 0.000
              stop: 0.250
            - name: post_m050_250ms
              start: -0.050
              stop: 0.250
            - name: post_000_350ms
              start: 0.000
              stop: 0.350

outputs:
    base_dir: results/{dataset}
    supervised_lowrank_loso_summary_csv: supervised_lowrank_loso_summary.csv
    supervised_lowrank_loso_inner_cv_csv: supervised_lowrank_loso_inner_cv.csv
    supervised_lowrank_loso_predictions_csv: supervised_lowrank_loso_predictions.csv
    provenance: true
    hash_input_files: true

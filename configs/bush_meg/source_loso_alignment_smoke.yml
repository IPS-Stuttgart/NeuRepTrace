schema_version: neureptrace.dataset.v1

paths:
    base: cwd

dataset:
    name: bush_meg
    type: fieldtrip_mat
    root: ${BUSH_MEG_DATA_DIR}
    participant_file: "Part{participant}Data.mat"
    variable: data
    channel_type: mag
    fields:
        trial: trial
        time: time
        label: label
        trialinfo: trialinfo
        sensor_geometry: grad

participants:
    ids: "1-3"

validation:
    trim_channel_labels_to_data: true
    channel_policy: exact

metadata:
    columns:
        - name: stimulus_class
          index: 0
        - name: condition
          index: 1
          optional: true

preprocessing:
    tmin: -0.35
    tmax: 0.35
    normalization: subject_baseline_whiten
    baseline_window: [-0.35, -0.05]
    feature_preprocessor: pca
    pca_components: 32
    window_size: 0.100

decoding:
    label_column: stimulus_class
    group_column: participant
    classifier: multinomial-logistic
    emission_mode: uncalibrated
    max_iter: 1000

source_loso:
    group_column: participant
    selection_metric: balanced_accuracy
    alignment_method: none
    alignment_anchor_mode: class_mean
    alignment_repetition_cap: 16
    alignment_components: 64
    alignment_times: [0.088, 0.136, 0.184, 0.232, 0.280]
    alignment_target_projection: group_projection
    label_shuffle_control: false
    label_shuffle_seed: 13
    candidate_grid:
        temporal_bins: [4]
        feature_kinds: [evoked]
        decoders: [multinomial-logistic]
        emission_modes: [uncalibrated]
        feature_preprocessors: [pca]
        pca_components: [32]
        c_grid: [1.0]
        window_sets:
            - name: fixed_184ms
              centers: [0.184]
              window_size: 0.100
            - name: response_window_c
              centers: [0.088, 0.136, 0.184, 0.232, 0.280]
              window_size: 0.048

outputs:
    base_dir: outputs/bushmeg_source_loso_alignment_smoke
    source_loso_summary_csv: summary.csv
    source_loso_inner_cv_csv: inner_cv.csv
    source_loso_predictions_csv: predictions.csv
    provenance: true
    hash_input_files: false

schema_version: neureptrace.dataset.v1

paths:
  base: cwd

dataset:
  name: bush_meg
  type: fieldtrip_mat
  root: ${BUSH_MEG_DATA_DIR}
  participant_file: "Part{participant}Data.mat"
  variable: data
  channel_type: mag
  fields:
    trial: trial
    time: time
    label: label
    trialinfo: trialinfo
    sensor_geometry: grad

participants:
  ids: "1-4,6,8,9,10,13-27"

validation:
  trim_channel_labels_to_data: true
  channel_policy: exact

metadata:
  columns:
    - name: stimulus_class
      index: 0
    - name: condition
      index: 1
      optional: true

preprocessing:
  # Keep the pre-stimulus baseline in memory because the decoder uses
  # fold-local subject_baseline_whiten statistics fitted only on training
  # participants within each LOSO fold.
  tmin: -0.35
  tmax: 0.25
  window_size: 0.1
  window_step: 0.025
  normalization: subject_baseline_whiten
  baseline_window: [-0.35, -0.05]
  feature_preprocessor: pca
  pca_components: 128

decoding:
  label_column: stimulus_class
  group_column: participant
  # The temporal-decision workflow expands this alias to the two source-only
  # decoders that were strongest in prior smoke runs, without writing large
  # per-source intermediate observation tables.
  classifier: logistic_svm_ensemble
  emission_mode: calibrated
  max_iter: 5000

temporal_decision:
  split_strategy: leave_one_group_out
  # A compact decision interval around the observed 150--200 ms sweet spot.
  # Override this from the CLI for sweeps, e.g.
  # --set temporal_decision.test_window='[0.125,0.225]'
  test_window: [0.075, 0.225]
  aggregation: log_mean
  min_probability: 1.0e-12

outputs:
  base_dir: results/{dataset}
  summary_csv: stimulus_decision_loso_temporal_ensemble_summary.csv
  observations_csv: stimulus_decision_loso_temporal_ensemble_observations.csv
  provenance: true
  hash_input_files: true

schema_version: neureptrace.dataset.v1

paths:
    base: cwd

dataset:
    name: bush_meg
    type: fieldtrip_mat
    root: ${BUSH_MEG_DATA_DIR}
    participant_file: "Part{participant}Data.mat"
    variable: data
    channel_type: mag
    fields:
        trial: trial
        time: time
        label: label
        trialinfo: trialinfo
        sensor_geometry: grad

participants:
    ids: "1-4,6,8,9,10,13-27"

validation:
    trim_channel_labels_to_data: true
    channel_policy: exact

metadata:
    columns:
        - name: stimulus_class
          index: 0
        - name: condition
          index: 1
          optional: true

preprocessing:
    # Keep the cue task out of the workflow.  The response-window C centers
    # require data through 0.330 s when using 100 ms windows.
    tmin: -0.35
    tmax: 0.35
    normalization: subject_baseline_whiten
    baseline_window: [-0.35, -0.05]
    feature_preprocessor: pca
    pca_components: 96
    window_size: 0.100

decoding:
    label_column: stimulus_class
    group_column: participant
    classifier: multinomial-logistic
    emission_mode: uncalibrated
    max_iter: 2000
    label_shuffle_control: false
    label_shuffle_seed: 13

source_loso:
    group_column: participant
    selection_metric: balanced_accuracy
    candidate_grid:
        temporal_bins: [4]
        feature_kinds:
            - evoked
            - evoked_baseline_contrast
            - evoked_slope
            - evoked_dct
        decoders:
            - multinomial-logistic
            - linear_svm
        emission_modes:
            - uncalibrated
        feature_preprocessors:
            - pca
        pca_components: [64, 128]
        c_grid: [0.1, 1.0, 10.0]
        window_combines:
            - log_probability_mean
        window_sets:
            - name: response_window_c
              centers: [0.088, 0.136, 0.184, 0.232, 0.280]
              window_size: 0.100

outputs:
    base_dir: results/{dataset}/source_loso_response_window_c
    source_loso_summary_csv: source_loso_response_window_c_summary.csv
    source_loso_inner_cv_csv: source_loso_response_window_c_inner_cv.csv
    source_loso_predictions_csv: source_loso_response_window_c_predictions.csv
    provenance: true
    hash_input_files: true
